  <br>
  <br>
<li><b><a HREF="Functions_numeric.html#abs">abs</a></b>
<i>Renvoie la valeur absolue d'un nombre. </i>
<li><b><a HREF="Functions_numeric.html#alea">alea</a></b>
<i>Renvoie un nombre aléatoire.</i>
<li><b><a HREF="Functions_numeric.html#alea.entre.bornes">alea.entre.bornes</a></b>
<i>Renvoie un nombre aléatoire.</i>
<li><b><a HREF="Functions_numeric.html#arrondi">arrondi</a></b>
<i>Renvoie la valeur arrondie d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#arrondi.inf">arrondi.inf</a></b>
<i>Renvoie la valeur arrondie d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#arrondi.sup">arrondi.sup</a></b>
<i>Renvoie la valeur arrondie d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#base">base</a></b>
<i>Convertit un nombre dans une autre base.</i>
<li><b><a HREF="Functions_numeric.html#carré">carré</a></b>
<i>Renvoie le carré d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#degrés">degrés</a></b>
<i>Convertit les radians en degrés.</i>
<li><b><a HREF="Functions_numeric.html#e">e</a></b>
<i>Renvoie la valeur de exponentielle de 1.</i>
<li><b><a HREF="Functions_numeric.html#ent">ent</a></b>
<i>Renvoie l'entier le plus proche du <i>nombre</i>.</i>
<li><b><a HREF="Functions_numeric.html#exp">exp</a></b>
<i>Renvoie l'exponentielle d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#fact">fact</a></b>
<i>Renvoie la factorielle d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#frac">frac</a></b>
<i>Renvoie la partie fractionnaire d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#inv">inv</a></b>
<i>Renvoie l'inverse d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#ln">ln</a></b>
<i>Renvoie le logarithme népérien d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#log">log</a></b>
<i>Renvoie le logarithme d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#log10">log10</a></b>
<i>Renvoie le logarithme de base 10 d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#mod">mod</a></b>
<i>Renvoie le modulo d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#pi">pi</a></b>
<i>Renvoie le nombre pi.</i>
<li><b><a HREF="Functions_numeric.html#produit">produit</a></b>
<i>Renvoie le produit des nombres passés en paramètre.</i>
<li><b><a HREF="Functions_numeric.html#racine">racine</a></b>
<i>Renvoie la racine carrée d'un nombre.</i>
<li><b><a HREF="Functions_numeric.html#radians">radians</a></b>
<i>Convertit les degrés en radians.</i>
<li><b><a HREF="Functions_numeric.html#random">random</a></b>
<i>Renvoie un nombre aléatoire.</i>
<li><b><a HREF="Functions_numeric.html#signe">signe</a></b>
<i>Renvoie le signe du nombre.</i>
<li><b><a HREF="Functions_numeric.html#somme">somme</a></b>
<i>Renvoie la somme des nombres passés en paramètre.</i>
<li><b><a HREF="Functions_numeric.html#tronque">tronque</a></b>
<i>Renvoie la valeur arrondie d'un nombre.</i>
