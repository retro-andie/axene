  <p>
  <br>
  <br>
<li><b><a HREF="Functions_text.html#car">car</a></b>
<i>Convertit un nombre en caractères.</i>
<li><b><a HREF="Functions_text.html#cherche">cherche</a></b>
<i>Renvoie la position d'un texte dans un autre.</i>
<li><b><a HREF="Functions_text.html#cnum">cnum</a></b>
<i>Renvoie le nombre correspondant au texte.</i>
<li><b><a HREF="Functions_text.html#code">code</a></b>
<i>Convertit un caractère en nombre.</i>
<li><b><a HREF="Functions_text.html#ctxt">ctxt</a></b>
<i>Convertit un nombre en texte.</i>
<li><b><a HREF="Functions_text.html#droite">droite</a></b>
<i>Découpe un texte en partant de la fin.</i>
<li><b><a HREF="Functions_text.html#épurage">épurage</a></b>
<i>Epure un texte.</i>
<li><b><a HREF="Functions_text.html#exact">exact</a></b>
<i>Compare deux textes.</i>
<li><b><a HREF="Functions_text.html#gauche">gauche</a></b>
<i>Découpe un texte en partant du début.</i>
<li><b><a HREF="Functions_text.html#majuscule">majuscule</a></b>
<i>Convertit le texte en majuscules.</i>
<li><b><a HREF="Functions_text.html#minuscule">minuscule</a></b>
<i>Convertit le texte en minuscules.</i>
<li><b><a HREF="Functions_text.html#nbcar">nbcar</a></b>
<i>Renvoie le nombre de caractère du <i>texte</i>.</i>
<li><b><a HREF="Functions_text.html#nompropre">nompropre</a></b>
<i>Renvoie le texte en nom propre.</i>
<li><b><a HREF="Functions_text.html#remplacer">remplacer</a></b>
<i>Remplace un morceau de texte par un autre.</i>
<li><b><a HREF="Functions_text.html#répéter">répéter</a></b>
<i>Répète un texte un certain nombre de fois.</i>
<li><b><a HREF="Functions_text.html#stxt">stxt</a></b>
<i>Extrait des caractères dans un texte.</i>
<li><b><a HREF="Functions_text.html#substitue">substitue</a></b>
<i>Remplace un texte par un autre.</i>
<li><b><a HREF="Functions_text.html#supprespace">supprespace</a></b>
<i>Supprime les espaces d'un texte.</i>
<li><b><a HREF="Functions_text.html#t">t</a></b>
<i>Renvoie du texte.</i>
<li><b><a HREF="Functions_text.html#trouve">trouve</a></b>
<i>Recherche une texte dans un autre.</i>
  <p>
  </ul>
