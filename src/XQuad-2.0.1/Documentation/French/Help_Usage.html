<title>Utilisation de l'aide</title>

<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleHelpUse.gif" ALT="Utilisation de l'aide" WIDTH="162" HEIGHT="34"> </p>

<p><br>
<br>
</p>

<p>Il existe deux formes d'aide dans XQuad. </p>

<p>La première est la <a HREF="Main_Interface.html#hint_line">barre d'information</a> qui
permet de <b>connaître de manière concise l'utilité d'une icône</b> dans les barres
d'icônes. Lorsque le curseur souris est positionné sur une icône, une phrase
explicative est affichée dans la barre d'information située en bas de l'interface
principale d'XQuad. </p>

<p>La deuxième forme d'aide est l'<b>aide en ligne</b>. Celle-ci est écrite sous forme
de pages HTML que l'on peut visualiser avec n'importe quel &quot;navigateur HTML&quot;
(tel que Netscape, Mosaic, Lynx, etc.). Axene propose d'utiliser son propre logiciel de
visualisation de page HTML, nommé XMayday, qui est le mieux adapté à l'affichage de
l'aide en ligne pour XQuad et les autres produits Axene. Le choix du logiciel pour
visualiser la documentation en ligne s'effectue grâce à la section <a HREF="ConfigHelp.html">\HELP_CONFIG</a> des <a HREF="Config.html">fichiers de
configurations</a>. </p>

<p>Pour accéder à l'aide en ligne, il existe plusieurs moyens&nbsp;: 

<ul>
  <li>à partir du <a HREF="Menu_Help.html">menu Aide</a>, cliquer sur les entrées <a HREF="Menu_Help.html#overview_menu_entry"><i>&quot;Aide Générale...&quot;</i></a>, <a HREF="Menu_Help.html#table_of_contents_menu_entry"><i>&quot;Table des Matières...&quot;</i></a>,
    <a HREF="Menu_Help.html#keyboard_menu_entry"><i>&quot;Clavier...&quot;</i></a>, <a HREF="Menu_Help.html#mouse_menu_entry"><i>&quot;Souris...&quot;</i></a> ou <a HREF="Menu_Help.html#using_help_menu_entry"><i>&quot;Utiliser de l'aide...&quot;</i></a>. <br>
    &nbsp; </li>
  <li>dans les boîtes de dialogue principales, un bouton icône permet d'accéder à l'aide
    de ces boîtes. <br>
    &nbsp; </li>
  <li>à partir de l'entrée <a HREF="Menu_Help.html#help_on_item_menu_entry"><i>&quot;Aide
    sur Item...&quot;</i></a> du <a HREF="Menu_Help.html">menu Aide</a>. Le curseur souris se
    transforme en point d'interrogation. Il suffit alors de cliquer sur une composante de
    l'interface d'XQuad pour obtenir une aide spécifique associée. Par exemple, pour
    comprendre à quoi sert un bouton icône de la barre horizontale d'icônes affichée, il
    suffit de choisir &quot;Aide / Aide sur Item....&quot; puis de cliquer sur ce bouton
    icône. <br>
    Pour activer cette forme d'aide, il est également possible de presser simultanément les
    touches <tt>Ctrl</tt> et <tt>F1</tt>. Dans les boîtes de dialogues (où le menu Aide
    n'est pas accessible) ce raccourci clavier est le seul moyen d'obtenir l'aide sur item. <br>
    &nbsp; </li>
  <li>en sélectionnant un élément d'interface et en pressant la touche <tt>F1</tt>. Un
    élément d'interface est sélectionné lorsqu'il est entouré d'un fin trait noir. <p>La
    méthode de 'l'aide sur item' est plus commode et efficace. </p>
  </li>
</ul>
