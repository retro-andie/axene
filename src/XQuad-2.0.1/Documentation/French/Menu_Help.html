<h3>Le menu Aide comporte les entrées suivantes&nbsp;:</h3>

<ul>
  <li><a NAME="overview_menu_entry">l'entrée <i>&quot;Aide Générale...&quot;</i> permet
    d'obtenir des </a><a HREF="Overview.html">informations générales</a> sur la manière
    d'utiliser XQuad. <br>
    &nbsp;</li>
  <li><a NAME="table_of_contents_menu_entry">l'entrée <i>&quot;Table des Matières...&quot;</i>
    permet d'accéder à la </a><a HREF="index.html">table des matières</a> de l'aide. <br>
    &nbsp;</li>
  <li><a NAME="keyboard_menu_entry">l'entrée <i>&quot;Clavier...&quot;</i> permet d'obtenir
    de l'aide sur l'usage général du clavier, notamment les </a><a HREF="Keyboard.html#shortcuts">raccourcis claviers</a> et la façon d'entrer les <a HREF="Keyboard.html#special_car">caractères spéciaux</a>. <br>
    &nbsp; </li>
  <li><a NAME="mouse_menu_entry">l'entrée <i>&quot;Souris...&quot;</i> permet d'obtenir de
    l'aide sur l'</a><a HREF="Mouse.html">usage général de la souris</a>, notamment
    l'utilité des boutons. <br>
    &nbsp;</li>
  <li><a NAME="help_on_item_menu_entry">l'entrée <i>&quot;Aide sur Item&quot;</i> permet
    d'obtenir de l'aide en cliquant sur une certaine partie de l'interface. Par exemple, on
    peut savoir à quoi sert un bouton icône en choisissant cette entrée puis en cliquant
    sur l'icône en question. </a><br>
    &nbsp;</li>
  <li><a NAME="using_help_menu_entry">l'entrée <i>&quot;Utiliser l'aide...&quot;</i> permet
    d'obtenir des informations sur les différentes manières d'avoir de l'</a><a HREF="Help_Usage.html">aide</a>. <br>
    &nbsp;</li>
  <li><a NAME="licence_menu_entry">l'entrée <i>&quot;Licence...&quot;</i> permet d'ouvrir une
    boîte dans laquelle il est indiqué les conditions de la </a><a HREF="License.html">licence</a>
    actuelle d'XQuad. <br>
    &nbsp;</li>
  <li><a NAME="registration_menu_entry">l'entrée <i>&quot;Listes de diffusion...&quot;</i>
    permet d'ouvrir une boîte à partir de laquelle il est possible d'envoyer un e-mail à
    Axene. Cet e-mail permet de s'enregistrer auprès d'Axene pour accéder à plusieurs
    listes de diffusion Axene. </a><br>
    &nbsp;</li>
  <li><a NAME="about_XQuad_menu_entry">l'entrée <i>&quot;A propos d'XQuad...&quot;</i> permet
    d'ouvrir une boîte indiquant des informations sur la version d'XQuad utilisée et les
    adresses pour </a><a HREF="About.html">contacter Axene</a>. </li>
</ul>
