<i><b>

<p>XQuad Chapter 4</p>
</b></i>

<p>&nbsp;</p>

<p>&nbsp;</p>
<b>

<p>Horizontal Toolbar: General Functions</p>

<p>&nbsp;</p>
</b>

<p>The General Functions toolbar quickly accesses frequently-used functions. Unlike other
toolbars, it has no specific theme. </p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>First Section of the Toolbar:</p>

<blockquote>
  <p>The first button saves the active worksheet to a file. If a worksheet is new and has
  not been named, the <i>&quot;Saving a Document as...&quot;</i> file selector appears to
  name the worksheet. If the worksheet has already been named, it will be saved under its
  current filename. </p>
  <p>The second button prints the active worksheet. Clicking on this button opens the <i>&quot;Print&quot;</i>
  dialog box.</p>
  <p>&nbsp;</p>
</blockquote>

<p>Second section of the toolbar:</p>

<blockquote>
  <p>The first button cuts selected cells and copies them to the clipboard. When pasted, the
  <i>&quot;cut&quot;</i> cells are erased from their original location. The clipboard
  contains only cell coordinates, so if a &quot;cut&quot; cell&#146;s contents are changed
  before pasting, the new contents will be pasted. Executing a <i>&quot;cut&quot;</i>
  command replaces any previous clipboard contents. </p>
  <p>The second button <i>&quot;copies&quot;</i> the selected cells to the clipboard. The
  clipboard contains only cell coordinates, so if a &quot;copied<i>&quot;</i> cell&#146;s
  contents are changed before pasting, the new contents will be pasted. Executing a <i>&quot;copy&quot;</i>
  command replaces any previous clipboard contents. </p>
  <p>The third button &quot;<i>pastes</i>&quot; cells from clipboard to worksheet. This
  operation retrieves cell coordinates from the most recent <i>&quot;cut&quot;</i> or <i>&quot;copy&quot;</i>
  command and pastes those cells at the current active cell. All cell attributes are moved
  to the new location; clipboard contents are not lost, even if the destination cell is
  already full. It is possible to perform multiple <i>&quot;paste&quot;</i> commands
  consecutively. If the last clipboard operation was <i>&quot;cut&quot;</i>, the cells at
  the original location are erased (both values and attributes).</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Third Section of the toolbar:</p>

<blockquote>
  <p>The first button adds an <i>equals sign </i>(=) at the front of the formula bar<i>.</i>
  In this position on the formula bar the symbol lets the user create formulas. If the
  formula bar already contains an <i>equals sign</i> at this position, pushing this button
  will remove it.</p>
  <p>The second button adds a <i>function name</i> to the formula bar. This button opens the<i>
  &quot;Paste a function</i>&quot; dialog box. The function chosen in this dialog box will
  be inserted to the formula bar at the cursor. If the cursor is at the front of the text
  field, the <i>equals</i> symbol is added automatically.</p>
  <p>The third button inserts the <i>sum function</i> in the formula bar. The <i>&quot;sum
  (... )&quot;</i> character-string is inserted at the cursor. If the cursor is at the front
  of the text field, the <i>equals sign</i> is added automatically.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Fourth Section of the Toolbar:</p>

<blockquote>
  <p>The first button applies standard <i>thousands (1000s) </i>numeric format to selected
  cells. Standard <i>thousands </i>format displays numbers by separating every 3 digits with
  a space. This button is engaged whenever the active cell uses <i>standard 1000s</i>
  format. If clicked while engaged, this button returns selected cells to the default
  standard numbers format. </p>
  <p>The second button applies standard<i> monetary</i> numeric format to all selected
  cells. Standard<i> monetary</i> format displays numbers followed by their unit, for
  example &quot;F&quot; for French francs (negative numbers appear in red). This button is
  engaged whenever the active cells use standard<i> monetary</i> format<i>.</i> If clicked
  while engaged, this button returns selected cells to the default standard numbers format.</p>
  <p>The third button applies standard <i>percentage</i> numeric format to selected cells.
  Standard <i>percentage </i>format is followed by a <i>%</i> sign and automatically
  multiplied by 100. This button is engaged whenever the active cell uses <i>percengage</i>
  format. If clicked while engaged, this button returns selected cells to the default
  standard number format.</p>
  <p>The fourth button applies standard<i> scientific</i> numeric format to all selected
  cells. <i>Scientific</i> format displays numbers in the form &quot;E<sup>xponent</sup>.&quot;
  &quot;E&quot; never contains more than a single digit. This button is engaged whenever the
  active cell uses <i>scientific </i>format. If clicked while engaged, it returns selected
  cells to the default standard number format. </p>
  <p>The fifth button applies standard<i> engineering</i> numeric format to all selected
  cells. <i>Engineering</i> format displays numbers in the form &quot;E<sup>xponent</sup>&quot;,with
  the exponent always a multiple of 3. This button is engaged whenever the active cell uses
  engineering format. If clicked while engaged, it returns the selected cells to the default
  standard number format.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Fifth Section of the toolbar:</p>

<blockquote>
  <p>The first button adds a decimal place to the selected cell&#146;s display. This
  function adds one decimal place to the minimum precision of a selected cell. Maximum and
  minimum number precision are the same. Minimum precision can contain up to 20 decimal
  places; after that point the button no longer has effect. </p>
  <p>The second button removes a decimal place from the selected cell&#146;s display. This
  function removes one decimal place from the minimum precision of a selected cell. Maximum
  and minimum number precision are the same. Minimum precision cannot go below zero decimal
  places; after that point the button no longer has effect.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Horizontal Toolbar: Font Manipulations</p>

<p>&nbsp;</p>
</b>

<p>The Font Manipulation toolbar quickly alters the appearance of characters displayed in
worksheet cells. The user can change fonts, font features (bold, italic, underline, etc.),
as well as text size and color.</p>

<p>&nbsp;</p>

<p>First section of the toolbar:</p>

<blockquote>
  <p>The pulldown list lets the user change fonts in all selected cells. The elements on
  this list come from the font section of the configuration files. When fonts are changed,
  the selected cells retain the previous font size and features (bold/italic) if the new
  font permits.</p>
  <p>&nbsp;</p>
</blockquote>

<p>Second section of the toolbar:</p>

<blockquote>
  <p>The first button puts the selected cell&#146;s contents in bold. This button is not
  available if the current font does not support bold text. This button is engaged whenever
  the active cell uses bold. Clicking when the button is already engaged removes bold
  features from the selected cells. </p>
  <p>The second button puts the selected cell&#146;s contents in italics. This button not
  available if the current font does not support italic text. This button is engaged
  whenever the active cell uses italics. Clicking when the button is already engaged removes
  italic features from the selected cells. </p>
  <p>&nbsp;</p>
</blockquote>

<p>Third Section of the Toolbar:</p>

<blockquote>
  <p>The first button increases the selected cell&#146;s font size. The size is enlarged in
  pre-defined increments. These increases enlarge cell fonts by one increment. Font size
  cannot exceed 1000 pts.</p>
  <p>The second button reduces the selected cell&#146;s font size. The size is reduced in
  pre-defined increments. This function reduces cell fonts by one increment. Font size
  cannot fall below one (1) point.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <b><p>&nbsp;</p>
</blockquote>

<p>Horizontal Toolbar: Text Manipulations:</p>
</b>

<p>&nbsp;</p>

<p>The text manipulation toolbar lets the user select horizontal and vertical alignment,
control line spacing, and select the direction of text flow. The default alignment modes
are:</p>

<p>&nbsp;</p>
<i>

<p>+ aligned at the left for text</p>

<p>+ aligned at the right for numbers (numeric values, dates, hours)</p>

<p>+ centered for boolean values</p>
</i>

<p>&nbsp;</p>

<p>Only text can flow over into adjacent cells (depending on the alignment mode and the
direction of text flow) if the column width is inadequate and if the adjacent columns are
empty. </p>

<p>&nbsp;</p>

<p>In vertical text mode, all alignment modes are still available, but they have the
inverse effects: horizontal alignment acts vertically and vice versa.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>First Section of the Toolbar:</p>

<blockquote>
  <p>The first button aligns the selected cell&#146;s contents at the left. This button is
  engaged whenever the active cell uses left alignment. If clicked when engaged, this button
  returns the selected cells to the default alignment mode. In left alignment mode texts may
  flow over the cell border to the right. </p>
  <p>The second button centers the selected cell&#146;s contents horizontally. This button
  is engaged whenever the active cell uses centering. If clicked when engaged, this button
  returns the selected cells to the default alignment mode. When centered, text can flow
  over cell borders to both the left and right. </p>
  <p>The third button aligns the selected cell&#146;s contents at the right. This button is
  engaged whenever the active cell uses right alignment. If clicked when engaged, this
  button returns the selected cells to the default alignment mode. In right alignment mode
  texts may flow over the cell border to the left.</p>
  <p>The last button horizontally justifies (from left to right) the selected cell&#146;s
  contents. This button is engaged whenever the active cell uses horizontal justification.
  If clicked when engaged, this button returns the selected cells to the default alignment
  mode. </p>
  <p>&nbsp;</p>
</blockquote>

<p>Second Section of the toolbar:</p>

<blockquote>
  <p>The first button aligns the selected cell&#146;s contents at the top of the cell. This
  button is engaged whenever the active cell uses top alignment mode. If clicked when
  engaged, it returns the selected cells to centered vertical alignment. </p>
  <p>The second button aligns the selected cell&#146;s contents at the bottom of the cell.
  This button is engaged whenever the active cell uses bottom alignment mode. If clicked
  when engaged, it returns the selected cells to centered vertical alignment.</p>
  <p>The last button vertically justifies (from top to bottom) the selected cell&#146;s
  contents. This button only affects those cells in &quot;multiple line&quot; mode and is
  engaged whenever the active cell uses vertical justification mode. If clicked when
  engaged, it returns the selected cells to centered vertical justification. Vertical
  justification in multi-line mode lets the user evenly distribute vertical space (cell
  height) between text lines.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Third Section of the Toolbar:</p>

<blockquote>
  <p>This button lets the user shift selected cells to &quot;multi-line&quot; mode.
  Multi-line mode applies only to cells containing text. Rather than display text on one
  line, causing it to spill over into adjacent cells when possible, the text will be
  displayed within a single cell using several lines. This button is engaged whenever the
  active cell uses multi-line mode. If clicked when engaged, it returns the selected cells
  to single line mode. </p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Last Section of the Icon Bar:</p>

<blockquote>
  <p>The first button displays the selected cell&#146;s contents at a -90<font FACE="Symbol">°</font>
  angle. This button is engaged whenever the active cell uses -90<font FACE="Symbol">°</font>
  writing mode. If clicked when engaged, it returns the selected cells to horizontal writing
  mode. </p>
  <p>The second button displays the selected cell&#146;s contents at a +90<font
  FACE="Symbol">°</font> angle. This button is engaged whenever the active cell uses +90<font
  FACE="Symbol">°</font> writing mode. If clicked when engaged, it returns the selected
  cells to horizontal writing mode. </p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Horizontal Toolbar: Cell design</p>

<p>&nbsp;</p>
</b>

<p>The Cell Design toolbar quickly accesses cell design functions. Cells can feature
different border thicknesses and colored background motifs. This toolbar provides shortcut
access to cell design elements, as they are defined from the &quot;Cell Background&quot;
and &quot;Cell Borders&quot; dialog boxes.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>First Section of the Toolbar:</p>

<blockquote>
  <p>The first button eliminates all cell borders in selected cells.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Second Section of the Toolbar:</p>

<p>Borders created in this section are fine black lines (outlines are thicker). To create
personalized borders use the &quot;Cell borders&quot; dialog box.</p>

<p>&nbsp;</p>

<blockquote>
  <p>The first button gives each selected cell a left border. This button is engaged
  whenever the active cell has a left border. If clicked when engaged, it removes the left
  border of selected cells.</p>
  <p>The second button gives each selected cell a bottom border. This button is engaged
  whenever the active cell has a bottom border. If clicked when engaged, it removes the
  bottom border of selected cells.</p>
  <p>The third button gives each selected cell a right border. This button is engaged
  whenever the active cell has a right border. If clicked when engaged, it removes the right
  border of selected cells. </p>
  <p>The fourth button gives each selected cell a top border. This button is engaged
  whenever the active cell has a top border. If clicked when engaged, it removes the top
  border of selected cells. </p>
  <p>The last button outlines all selected cells. Clicking on this button outlines each cell
  region with a double wide line.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Third Section of the Toolbar:</p>

<blockquote>
  <p>The first button gives the selected cell backgrounds a grey weave motif. This shortcut
  background is a fine weave of black and white points. To create personalized backgrounds
  use the <i>&quot;Cell background</i>&quot; dialog box.</p>
  <p>The second button inverses background color with text color (inverse video) in each
  selected cell. This function inverses the font and background color for each selected
  cell. If the cell has no background, the background is said to be &quot;white&quot; (the
  gray worksheet background is merely for decoration).</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Horizontal toolbar: Graphic Manipulations</p>
</b>

<p>&nbsp;</p>

<p>First section of the toolbar:</p>

<blockquote>
  <p>The first button exits frame creation mode. The second button on this toolbar shifts
  XQuad into frame creation mode. This button allows the user to return to default frame or
  cell selection mode.</p>
  <p>The second button creates a rectangular frame. </p>
</blockquote>

<p>1. Click on the display screen to place one point of the rectangle.</p>

<p>2. Move the mouse to stretch out the rectangular form.</p>

<p>3. Click again to place the opposite diagonal point of the rectangle to create the
frame.</p>

<p>4. Repeat from step one. To exit creation mode, click on the first button of this
toolbar, or click anywhere using the right button. </p>

<p>This operation is affected by magnetism. It can be cancelled during step two by
clicking the right mouse button. To create a square, press shift while stretching the
rectangle.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>Second Section of the toolbar:</p>

<p>All frames are positioned on different planes. With these tools the user may modify the
stacking order of frames. </p>

<blockquote>
  <p>The first button shifts the selected frames to the foreground, above all others . </p>
  <p>The second button shifts the selected frames to the background, beneath all others.</p>
  <p>The third button brings the selected frames forward by one plane, exchanging its place
  with the frame just above it.</p>
  <p>The last button pushes the selected frames backwards by one plane, exchanging its place
  with the frame just below it.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Third Section of the Toolbar:</p>

<blockquote>
  <p>The first button creates or changes a histogram graph. A histogram represents values
  using vertical bars. The X-axis of the graph is divided equally between the various
  series, and each series section is subdivided equally for each value. The histogram legend
  displays a color for each value of the series.</p>
  <p>The second button creates or changes a bar graph. A bar graph represents values using
  horizontal bars. The Y-axis of the graph is divided equally between the various series,
  and each series section is subdivided equally for each value. The bar graph legend
  displays a color for each value of the series. </p>
  <p>The third button creates or changes a line graph. A line graph represents values using
  a two dimensional line for each series. The X-axis is divided equally between the various
  series values. The line graph legend displays a color for each value of the series. </p>
  <p>The fourth button creates or changes an area graph. An area graph represents values
  using a two dimensional surface area for each series. The X-axis is equally divided
  between the various series values. The area graph legend displays a color for each value
  of the series. These values are added to corresponding values of preceeding series before
  being reported in the graph.</p>
  <p>The fifth button creates or changes a pie graph. Pie graphs represent values using
  angular sections of a circle for each series. Each disc is divided into positive values
  above zero (zero and negative values are not included). Each section is identified by its
  color and the amount of space it occupies on the disc. A pie graph legend displays a color
  for each value of the series. A pie graph has no Y-axis.</p>
  <p>The last button creates or changes a radar graph. A radar graph represents values using
  two dimensional polar lines resembling a radar antenna. For each X-value a line extends
  forth from a central point, equally spaced from other lines. Each series value is reported
  on corresponding axes, creating a colored line between the axes. The radar graph legend
  displays a color for each series. </p>
  <p>&nbsp;</p>
</blockquote>

<p>The buttons in this section fulfill two roles: creation of framed graphs based upon
data from selected cells, or alteration of a selected graph. The function of these buttons
therefore depends on what is selected: worksheet cells or a frame containing a graph. When
one of these buttons creates a new graph, XQuad shifts to frame creation mode; once
defined this frame will contain the new graph. If XQuad cannot determine the exact area of
a selected cell region, the &quot;Graph Configuration&quot; dialog box is automatically
opened. </p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>Fourth Section of the Icon Bar:</p>

<p>The buttons in this section modify the configuration of the selected graph.</p>

<p>&nbsp;</p>

<blockquote>
  <p>The first button displays/hides the Y-axis. This button can be applied to all graph
  types except pie graphs. Y-axis lines will be extended across the entire width of the
  graph.</p>
  <p>The second button displays/hides the legend. Depending upon graph type the legend can
  be displayed or hidden if series or X-axis titles exist. </p>
  <p>The third button displays/hides X-axis titles. X-axis titles exist when the third
  button of the graph configuration dialog box is engaged.</p>
  <p>The fourth button displays/ hides series titles. Series titles exist when the fifth
  button of the graph configuration dialog box is engaged. </p>
  <p>The fifth button displays/hides the graph title. A graph title exists only if series
  titles and X-axis titles exist.</p>
  <p>The last button changes the area of cell regions which are the source of values
  reported in the graph. This button opens the graph configuration dialog box.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Last Section of the Toolbar:</p>

<blockquote>
  <p>This button locks selected frames. Locking a frame prohibits all movement and
  modification of the frame. A locked frame within a selection can render the entire
  selection inalterable. The mouse cursor takes on the shape of a &quot;Do Not Enter&quot;
  sign when pointed at a selected locked frame. This button is engaged when one of the
  frames in a selection is locked. To unlock a frame selection, deactivate this button.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Horizontal Toolbar: Zoom</p>

<p>&nbsp;</p>
</b>

<p>The Zoom toolbar provides tools to modify the enlargement factor of the current active
worksheet. An enlargement factor is kept for each individual open worksheet.</p>

<p>&nbsp;</p>

<p>First section of the toolbar:</p>

<blockquote>
  <p>The first button increases the zoom factor by 25%. The zoom factor is limited to a
  maximum enlargement of 400%. If this limit is reached, the button has no effect.</p>
  <p>The second button reduces the zoom factor by 25%. The zoom factor is limited to a
  minimum reduction of 50%. Once this limit is reached, the button has no effect.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Second Section of the toolbar:</p>

<blockquote>
  <p>The five buttons set the enlargement factor at 50%, 75%, 100%, 200%, and 400%.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>
