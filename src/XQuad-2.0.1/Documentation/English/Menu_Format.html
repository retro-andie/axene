<h3>The Format menu contains the following options:</h3>

<ul>
  <li><a NAME="numbers_menu_entry"><i>&quot;Numbers...&quot;</i> <b>lets you change the
    numeric format</b>. It opens the '</a><a HREF="Box_NumFormat.html">Numeric Format</a>'
    dialog box.<br>
    &nbsp;</li>
  <li><a NAME="patterns_menu_entry"><i>&quot;Patterns...&quot;</i> <b>lets you change the
    background's pattern and colors</b>. It opens the '</a><a HREF="Box_CellPattern.html">Cell
    Background</a>' dialog box.<br>
    &nbsp;</li>
  <li><a NAME="borders_menu_entry"><i>&quot;Borders...&quot;</i> <b>lets you change the
    borders' patterns and colors</b>. It opens the '</a><a HREF="Box_CellBorder.html">Cell
    Borders</a>' dialog box.<br>
    &nbsp;</li>
  <li><a NAME="fonts_menu_entry"><i>&quot;Fonts...&quot;</i> <b>lets you change the character
    font</b>. It opens the '</a><a HREF="Box_Font.html">Font</a>' dialog box.<br>
    &nbsp;</li>
  <li><a NAME="rc_sizes_menu_entry"><i>&quot;Rows and columns...&quot;</i> <b>lets you change
    the lines height and the columns width</b>. It opens the '</a><a HREF="Box_ColumnRowSize.html">Column and Row Size</a>' dialog box.</li>
</ul>
