<p>XQuad offers two kinds of help. </p>

<p>First, the <a HREF="Main_Interface.html#hint_line">status bar</a> briefly <b>describes
the functions of selected toolbar buttons</b>. </p>

<p><b>On-line documentation</b> is also available for more detailed information on
XQuad's functions. The on-line help is written in HTML code and can be viewed with
any HTML browser (an application used to display HTML pages, such as Netscape, Mosaic,
Lynx...). Axene offers an HTML browser application of it's own called &quot;Xmayday&quot;,
which is perfect for displaying on-line help for XQuad and other Axene products. The HTML
browser application is selected through <a HREF="Config.html">configuration files</a> in <a HREF="ConfigHelp.html">\HELP_CONFIG</a> section. </p>

<p>There are several ways to access on-line help: 

<ul>
  <li>From the <a HREF="Menu_Help.html">Help menu</a> click on either <a HREF="Menu_Help.html#overview_menu_entry"><i>&quot;Overview...&quot;</i></a>, <a HREF="Menu_Help.html#table_of_contents_menu_entry"><i>&quot;Table of Contents...&quot;</i></a>,
    <a HREF="Menu_Help.html#keyboard_menu_entry"><i>&quot;Keyboard...&quot;</i></a>, <a HREF="Menu_Help.html#mouse_menu_entry"><i>&quot;Mouse...&quot;</i></a> or <a HREF="Menu_Help.html#using_help_menu_entry"><i>&quot;Using Help...&quot;</i></a>. <br>
    &nbsp;</li>
  <li>Select the <a HREF="Menu_Help.html#help_on_item_menu_entry"><i>&quot;Help on
    item...&quot;</i></a> option in the <a HREF="Menu_Help.html">Help menu</a>. After choosing
    this option the mouse's cursor changes shape; to obtain specific information on an item,
    click on the corresponding XQuad interface zone. For example, to learn the function of a
    particular button on the current horizontal toolbar, choose &quot;Help/Help on
    item...&quot;, then click on the button in question.<br>
    This type of help is also available by simultaneously pressing the <tt>Control</tt> and <tt>F1</tt>
    keys. This second method can be used to display information on interface elements in the
    dialog boxes. <br>
    &nbsp;</li>
  <li>Select an interface element and press the <tt>F1</tt> key. An interface element is
    selected when a thin black line is visible surrounding the element. <p>The selection
    method 'Help on item' is simpler and more efficient than other methods. </p>
    <p><br>
    &nbsp;</p>
  </li>
</ul>
