  <p>
  <br>
  <br>
<li><b><a HREF="Functions_trigo.html#acos">acos</a></b>
<i>Renvoie l'arccosinus d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#acosh">acosh</a></b>
<i>Renvoie l'arccosinus hyperbolique d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#asin">asin</a></b>
<i>Renvoie l'arcsinus d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#asinh">asinh</a></b>
<i>Renvoie l'arcsinus hyperbolique d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#atan">atan</a></b>
<i>Renvoie l'arctangente d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#atan2">atan2</a></b>
<i>Renvoie l'arctangente issu de coordonnées.</i>
<li><b><a HREF="Functions_trigo.html#atanh">atanh</a></b>
<i>Renvoie l'arctangente hyperbolique d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#cos">cos</a></b>
<i>Renvoie le cosinus d'un angle.</i>
<li><b><a HREF="Functions_trigo.html#cosh">cosh</a></b>
<i>Renvoie le cosinus hyperbolique d'un <i>nombre</i>.</i>
<li><b><a HREF="Functions_trigo.html#sin">sin</a></b>
<i>Renvoie le sinus d'un angle.</i>
<li><b><a HREF="Functions_trigo.html#sinh">sinh</a></b>
<i>Renvoie le sinus hyperbolique d'un nombre.</i>
<li><b><a HREF="Functions_trigo.html#tan">tan</a></b>
<i>Renvoie la tangente d'un angle.</i>
<li><b><a HREF="Functions_trigo.html#tanh">tanh</a></b>
<i>Renvoie la tangente hyperbolique d'un nombre.</i>
  <p>
  </ul>
