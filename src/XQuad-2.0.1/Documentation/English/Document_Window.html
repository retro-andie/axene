<p><br>
<br>
Each document opened using XQuad is displayed in a window on the desktop. A document
window is similar to an &quot;application window&quot; in UNIX; that is, it can be moved,
horizontally or vertically re-sized, made into an icon, maximized for size, or closed.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Document_Window.gif" ALT="Picture: Document window" WIDTH="387" HEIGHT="240"> <br>
<small><i>Screen shot: Document window.</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<p>All document windows in XQuad are set up in the following manner (vertically and
horizontally):&nbsp; 

<ol>
  <li><b>The Window Management Interface</b> is all the area around the window, dressing it.
    The interface operates in a standard manner, like all multi-window systems. The outline of
    an active document is mauve; that of an inactive document is gray. All functions effected
    through menubars and icons act only upon the active document. Clicking on the window of an
    inactive document activates it. The upper horizontal toolbar is made up of: <br>
    &nbsp; <ul>
      <li><img SRC="Icons/WM_Close.gif" WIDTH="17" HEIGHT="17"> The <b>Closing a Document</b> button. This button
        performs the same function as &quot;<a HREF="Menu_File.html"><i>File</i></a> / <a HREF="Menu_File.html#close_menu_entry"><i>Close</i></a>&quot;.<br>
        &nbsp; </li>
      <li><img SRC="Icons/WM_Title.gif" WIDTH="112" HEIGHT="17"> The <b>Title Bar</b>, which displays the document's name.
        Clicking on the title bar of a document shifts its window to the foreground and activates
        the document. The document <b>window may be moved</b> by clicking and holding on the title
        bar with the left mouse button and releasing it elsewhere on the desktop.<br>
        &nbsp; </li>
      <li><img SRC="Icons/WM_Iconify.gif" WIDTH="17" HEIGHT="17"> The <b>create icon</b> button shifts the document
        window to <a HREF="Main_Interface.html#document_icon">icon representation</a>.<br>
        &nbsp; </li>
      <li><img SRC="Icons/WM_Maximize.gif" WIDTH="17" HEIGHT="17"> The <b>maximize</b> button enlarges the document
        window to the size of the desktop, thus shifting the document to <a HREF="Main_Interface.html#document_maximized">maximum window</a> form.. </li>
    </ul>
    <p>The left, right, and bottom sides as well as the lower left and lower right corners are
    used to <b>re-size the window</b> on the desktop by taking one of these sides or one of
    the two corners and stretching the window horizontally, vertically, or diagonally, then
    releasing.</p>
  </li>
  <li>The <strong>header origin</strong>, the <strong>columns headers</strong> and the <strong>rows
    headers</strong>. In <a HREF="Sheet_Headers.html">this area</a>, it is possible to select
    one or several whole columns or rows and to change the rows heights or the columns widths.<br>
    &nbsp; </li>
  <li><strong>The cell sheet</strong>. The entered data is viewable in the <a HREF="Sheet_Cells.html">cell sheet</a>. Graphic frames, which can be altered, are
    displayed over it.<br>
    &nbsp; </li>
  <li><strong>The Scrollbars</strong>. Two sliders provide for horizontal and vertical
    movement of <strong>the visible part of the cell sheet</strong>. The slider size is
    proportional to the visible part of the used area of the cell sheet. To go beyond the used
    area, you have to locate the cursor to his home position (column A for the horizontal
    slider or the line 1 for the vertical slider) and then click on the arrow without
    releasing the mouse button immediately. </li>
</ol>
