<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleHBar.gif" ALT="Horizontal Toolbar" WIDTH="146" HEIGHT="23"> <img ALIGN="middle" SRC="Images/TitleHBarZoom.gif" ALT="Zoom adjust" WIDTH="154" HEIGHT="40"> </p>

<p><br>
<br>
The Zoom toolbar provides tools to modify the enlargement factor of the current active
worksheet. An enlargement factor is kept for each individual open worksheet.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/HBar_Zoom.gif" ALT="Image : Zoom toolbar." WIDTH="340" HEIGHT="60"> <br>
<small><i>Screen shot: Zoom toolbar. </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>First section of the toolbar:</h3>

<ul>
  <li><a NAME="zoom_plus_icon"><img SRC="Icons/HBarZ_Zoom_Plus.gif" WIDTH="30" HEIGHT="30"> The first button <strong>increases
    the zoom factor by 25%</strong>. The zoom factor is limited to a maximum enlargement of
    400%. If this limit is reached, the button has no effect.</a><br>
    &nbsp; </li>
  <li><img SRC="Icons/HBarZ_Zoom_Minus.gif" WIDTH="30" HEIGHT="30">&nbsp; <a NAME="zoom_minus_icon">The second button
    <strong>reduces the zoom factor by 25%</strong>. The zoom factor is limited to a minimum
    reduction of 50%. Once this limit is reached, the button has no effect.</a></li>
</ul>

<p><br>
</p>

<h3>Second Section of the toolbar:</h3>

<ul>
  <li><a NAME="predefined_scale_icons"><img SRC="Icons/HBarZ_Predefined.gif" WIDTH="162" HEIGHT="30"> The five buttons
    <strong>set the enlargement factor</strong> at 50%, 75%, 100%, 200%, and 400%.</a></li>
</ul>

<p><br>
</p>
