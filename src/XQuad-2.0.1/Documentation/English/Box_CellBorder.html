<p><br>
<br>
The <i>Cell Borders</i> Dialog box changes the borders of selected cells on the worksheet.
The user may define border styles and apply them to the top, left, right or bottom border
of each cell, or on the outlining border of an entire selection.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_CellBorder.gif" ALT="Image: Cell Borders Dialog Box" WIDTH="297"
HEIGHT="160"> <br>
<small><i>Screen shot: Cell Borders Dialog Box.</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Left Portion of the Dialog Box:</h3>

<p><a NAME="section_apply_on">The <i>Apply to</i> section selects the border on which to
apply selected designs. To this end, next to each border type is a clickable preview zone
with three different states:</a> 

<ul>
  <li><img SRC="Icons/Border_NoChange.gif" WIDTH="80" HEIGHT="26"> grey : no modification
    (state 0)<br>
    &nbsp;</li>
  <li><img SRC="Icons/Border_Apply.gif" WIDTH="80" HEIGHT="26"> border: border applied (state
    1)<br>
    &nbsp;</li>
  <li><img SRC="Icons/Border_None.gif" WIDTH="80" HEIGHT="26"> empty: border eliminated (state
    2)</li>
</ul>

<p>To shift between states 0, 1, and 2, the user must click on the correct button: top,
bottom, left or right. A click with the left mouse button will change the display from
state 0 to state 1, from 1 to state 2, and from 2 to state 1. A click with the right mouse
button will change the display from state 1 to state 0, and state 2 to state 0.</p>

<p>There are five different displays, each with three different states: 

<ul>
  <li><a NAME="area_outline"><i>Outline</i> applies a border to the exterior outline of the
    cell selection on the worksheet. If a single cell is selected on the worksheet, selecting
    this button is identical to selecting top, bottom, left and right borders. When more than
    one cell is selected the effect is different.</a><br>
    &nbsp;</li>
  <li><a NAME="area_top"><i>Top</i> applies a border to the top of all cells in the selection.</a><br>
    &nbsp;</li>
  <li><a NAME="area_bottom"><i>Bottom</i> applies a border to the bottom of all cells in the
    selection.</a><br>
    &nbsp;</li>
  <li><a NAME="area_left"><i>Left</i> applies a border to the left of all cells in the
    selection.</a><br>
    &nbsp;</li>
  <li><a NAME="area_right"><i>Right</i> applies a border to the right of all cells in the
    selection.</a></li>
</ul>

<p><br>
</p>

<h3>Right Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="list_thickness_pattern">The pulldown <i>Line Features</i> menu selects the
    width and design of the border to be applied.</a><br>
    &nbsp;</li>
  <li><a NAME="list_dash_pattern">The pulldown <i>Dotted-line</i> menu displays several dotted
    designs to be applied to the Line Features list.</a><br>
    &nbsp;</li>
  <li><a NAME="list_foreground_color">The <i>Foreground Color</i> menu selects a border's
    foreground color. The color list is defined in the </a><a HREF="Box_Color.html">Color
    Preparation</a> dialog box.<br>
    &nbsp;</li>
  <li><a NAME="list_background_color">The <i>Background Color</i> menu selects a border's
    background color.</a></li>
</ul>

<p><br>
</p>

<h3>Lower Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="button_ok"><i>&quot;Ok&quot;</i> applies the defined borders to selected
    worksheet cells and closes the box.</a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel"><i>&quot;Cancel&quot;</i> closes the box without changing any
    cell borders.</a></li>
</ul>

<p><br>
</p>
