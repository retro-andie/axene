<b>

<p>&nbsp;</p>

<p>Dialog Box: Print Setup</p>

<p>&nbsp;</p>
</b>

<p>The <i>Print Setup</i> dialog box selects the printed features of a worksheet&#146;s
page layout.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Print Left to Right</i> button selects the printing order for a table covering
  several pages. A two-by-two page table will be printed in the following order. [insert
  diagram]</p>
  <p>The <i>Print Top to Bottom</i> button selects the printing order for a table covering
  several pages. A two-by-two page table will be printed in the following order: [insert
  diagram]</p>
  <p>The <i>Portrait </i>button selects the page orientation for printing. The larger side
  of the paper corresponds to document height and the smaller side to document width.</p>
  <p>The <i>Landscape</i> button selects the page orientation for printing. The smaller side
  of the paper corresponds to document height and the larger side to document width.</p>
  <p>The <i>Reduction</i> button reduces a table before printing. This value is expressed as
  a percentage and must be set between .1% and 1000%. A 10% value corresponds to reduction
  by a factor of 10, while 1000% corresponds to enlargement by a factor of 10.</p>
  <p>The <i>Coverage</i> button selects the number of pages over which the table will be
  printed. When this button is engaged the user may specify the number of pages over which
  the table will be printed both horizontally (left text field) and vertically (right text
  field). The two values are expressed in page numbers and must be set between one and 100.
  In doing so, this function automatically calculates reduction and enlargement factors both
  horizontally and vertically.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Right Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Format </i>section determines the width and length of pages to be printed. These
  two values are expressed in centimeters and must be set between 1 and 300 cm.</p>
  <p>The <i>Top</i>, <i>Bottom</i>, <i>Left</i> and <i>Right</i> text fields of the <i>Margins</i>
  section determines respective margin dimensions for the top, bottom, left and right of the
  page. Margins are the non-printable space at the edge of a page. These values are
  expressed in centimeters and must be set between 0 and 150 cm. </p>
  <p>The <i>Center Vertically</i> button vertically centers the table printed on each page
  in the space between the top and bottom margins. </p>
  <p>The <i>Center Horizontally</i> button horizontally centers the table printed on each
  page in the space between the left and right margins. </p>
  <p>The <i>Print Grid</i> button determines whether or not the grid will be printed on each
  page. The grid uses fine lines to distinguish column and row separations.</p>
  <p>The <i>Print Row and Column Headers</i> button determines whether or not row and column
  headers will appear upon printing. Column headers are cells at the top of a page
  containing a series of letters as coordinates . Row headers are cells at the left of the
  page containing a series of numbers as coordinates.</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Part of the Dialog Box</p>

<blockquote>
  <i><p>OK</i> closes the box, confirming all changes made to the worksheet&#146;s print
  setup. Making changes to print setup automatically causes page separators to be displayed.
  [add link here]</p>
  <i><p>Cancel</i> closes the box and cancels all changes to the print setup.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Print<i> </i>Dialog Box</p>
</b>

<p>The <i>Print </i>dialog box selects print parameters before launching a printing.
Printing the active document is only done in Postscript.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>Top Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Print To..</i> pulldown list selects a printer to be used from those defined in
  the configuration files. The list contains one particular entry,<i> File</i>, which prints
  the active document to a file. The destination filename will be subsequently selected from
  the <i>Print to file</i> file selector upon closing this box.</p>
  <p>The <i>Print Selection Only </i>button allows the user to print only selected items.
  The selection can contain cells or graphics.</p>
  <p>The <i>Print Entire Document</i> button prints the whole worksheet. When this button is
  selected, the user chooses the page interval to be printed. The two text fields contain
  the page numbers required to print the entire worksheet.</p>
  <p>The two text fields <i>Page</i> and <i>To</i> allow the user to select the page
  interval to be printed. The value in the first field must be between 1 and the value of
  the second field. The value of the second field must be between the value of the first
  field and the document&#146;s last page. </p>
  <p>The <i>Number of copies</i> text field specifies the number of documents or partial
  documents to be printed.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Part of the Dialog Box:</p>

<blockquote>
  <i><p>OK </i>confirms print parameters, closes the box, and launches the print command. If
  the selected printer is <i>File</i>, the <i>Printing to file</i> file selector will open
  to select the target filename; printing will follow.</p>
  <i><p>Cancel</i> closes the box without printing.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Color Preparation Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>This dialog box defines colors to be used in XQuad--for example, when attributing a
color to a frame or font. This box links color components to color names.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box:</p>

<blockquote>
  <font FACE="Symbol"><p>_ </font>The <i>Colors List</i> displays pre-defined colors. When a
  color from the list is selected, its elements appear on the right. The selection of
  several colors is possible by using the CNTRL key. All pre-defined colors are stored in
  the configuration files.</p>
  <font FACE="Symbol"><p>_ </font>The text field beneath the list modifies the name of a
  selected color. </p>
  <font FACE="Symbol"><p>_ </font>The<i> Add Color</i> button creates a new color. By
  default this color will have the same characteristics as the selected color, as well as
  the same name followed by a number. </p>
  <font FACE="Symbol"><p>_ </font>The <i>Delete Color</i> button deletes a color. A color
  used in the application or defined in the configuration files with the <i>/Lock</i>
  command may not be deleted</p>
  <p>&nbsp;</p>
  <p>Right Portion of the Dialog Box:</p>
  <p>The four buttons <i>CMYB</i>, <i>RGB</i>, <i>HDB</i>, and <i>Greytones</i> allow the
  user to alter contents of the Color Configuration section. Each of these modes contributes
  to defining the selected color. If the <i>Greytones</i> button is engaged the color is
  displayed with corresponding grey tones.</p>
  <p>The <i>Configuration Section</i> contains the components of the selected chromatic
  mode:</p>
</blockquote>

<p>Cyan, Magenta, Yellow and Black mode</p>

<p>Red, Green, and Blue mode</p>

<p>Hue, Density, and Brightness mode</p>

<p>Greytones mode</p>

<p>&nbsp;</p>

<blockquote>
  <p>A <i>Color Preview</i> displays the color as defined by its components. This color
  preview is executed under ideal display conditions and may not exactly match the color
  obtained upon printing. </p>
  <p>&nbsp;</p>
</blockquote>

<p>Note: If the level of black in the color is 100%, the color will be black. To make
white, set all color elements to 0%.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>OK</i> confirms all modifications to the Color List and closes the box.</p>
  <i><p>Cancel </i>cancels all operations to the color list and closes the box.</p>
  <p>&nbsp;</p>
</blockquote>

<p>____________________________________________________________________</p>
<b>

<p ALIGN="CENTER">CMYB Chromatic Mode</p>
</b>

<p>&nbsp;</p>

<p>Click on the <i>CMYB</i> button to activate this mode. The color is then created using
the elements Cyan, Magenta, Yellow and Black.</p>

<p>&nbsp;</p>

<p>Description:</p>

<p>Primary colors :</p>

<blockquote>
  <p>Cyan (green + blue): complementary color to Red</p>
  <p>Magenta (red + blue): complementary color to Green</p>
  <p>Yellow (red + green): complementary color to Blue</p>
</blockquote>

<p>These primary colors are called <i>subtractive</i> because they must be removed in
order to create white. </p>

<p>&nbsp;</p>

<p>CMYB chromatic mode is used by most printers.</p>

<p>&nbsp;</p>
<b>

<p>To create color</p>
</b>

<p>Text fields and horizontal risers set the level of a color component. These values
indicate the percentage of a component in a color in a linear fashion. A 0% value
indicates an absence of the component in the color. 100% indicates a maximum incidence of
the component in the color.</p>

<p>&nbsp;</p>

<p>When Cyan, Magenta, and Yellow are combined, the theoretical result is black. However,
when printing, these inks mix to produce a brown color. To compensate for this problem
when printing in quadra-chromatic mode, add the component Black. Adding 30% black is
equivalent to a combination of 30% Magenta, 30% Cyan, and 30% Yellow. </p>

<p>&nbsp;</p>

<p>Note: XQuad optimizes the color in order to use a maximum of pure Black. It&#146;s
therefore possible that values entered manually may be automatically adjusted the next
time this dialog box is viewed.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>&nbsp;</p>

<p>_______________________________________________________________</p>
<b>

<p ALIGN="CENTER">RGB Chromatic Mode</p>
</b>

<p>&nbsp;</p>

<p>Click on<i> RGB</i> to activate this mode. The color is then created using Red, Green,
and Blue components.</p>
<b>

<p>&nbsp;</p>

<p>Description</p>
</b>

<p>primary colors :</p>

<blockquote>
  <p>Red (magenta + yellow): complementary color to Cyan</p>
  <p>Green (cyan + yellow): complementary color to Magenta</p>
  <p>Blue (cyan + magenta): complementary color to Yellow</p>
  <p>&nbsp;</p>
</blockquote>

<p>These primary colors are called <i>additive</i> because they must be combined to
produce white.</p>

<p>&nbsp;</p>

<p>RGB chromatic mode is used by most monitors.</p>

<p>&nbsp;</p>
<b>

<p>To create color</p>
</b>

<p>Text fields and horizontal risers set the incidence of a color component. The values
indicate the level of a color component in a linear fashion. A 0% value indicates an
absence of the component in a color, while 100% indicates a maximum amount of the
component in the color.</p>

<p>&nbsp;</p>

<p>When Red, Green, and Blue are combined the resulting color is White. The absence of
these colors produces Black.</p>

<p>&nbsp;</p>

<p>_____________________________________________________________</p>
<b>

<p ALIGN="CENTER">HDB Chromatic Mode</p>
</b>

<p>&nbsp;</p>

<p>Click on the <i>HDB</i> button to activate this mode. The color is then specified by
its <i>Hue</i>, <i>Density</i>, and <i>Brightness</i>. </p>

<p>&nbsp;</p>
<b>

<p>Description</p>
</b>

<p>CMYB and RGB modes have a common problem: they are difficult to comprehend intuitively.
HDB mode is a more natural, human way of viewing color.</p>

<p>&nbsp;</p>
<b>

<p>To Create Color</p>

<p>Hue</p>
</b><i>

<p>Hue </i>values are set between 0 degrees and 360 degrees. They are equivalent to color
wheel values where 0 degrees is equivalent to 360 degrees. </p>

<p>The primary color values are: </p>

<p ALIGN="CENTER">primary colors</p>

<p>&nbsp;</p>
<b>

<p>Density</p>
</b><i>

<p>Density</i> is associated with the intensity of a color. This value is given in
percentage form, from 0% (no hue present) to 100% (hue is pure). The higher this value,
the greater the hue incidence in the color being created.</p>

<p>&nbsp;</p>
<b>

<p>Brightness</p>
</b><i>

<p>Brightness</i> refers to the quantity of Black added to the color. This value is given
in percentage form, from 0% (pure black) to 100% (pure white). The higher the level of
brightness, the lighter the color. The more Black present in a color (low brightness), the
darker it is.</p>

<p>&nbsp;</p>

<p>___________________________________________________________</p>
<b>

<p ALIGN="CENTER">Grey-Tones</p>
</b>

<p>&nbsp;</p>

<p>Click on the <i>Greytones</i> button to activate this mode. The color is then defined
by its percentage of white (from 0% [black] to 100% [white]); upon entering this mode the
selected color is transformed to grey and loses all trace of former hues.</p>

<p>&nbsp;</p>

<p>&nbsp;</p>
<b>

<p>Paste Function Dialog Box</p>

<blockquote>
</blockquote>

<p>The <i>Paste function</i> dialog box inserts a function (by its keyword) into a cell.
Functions are classed by type.</p>

<p>&nbsp;</p>

<p>Upper Portion of the Dialog Box:</p>

<blockquote>
  <p>The Function list selects a function to be inserted at the insertion bar. All listed
  functions are available in the areas defined in the <i>type</i> section. Functions are
  displayed in alphabetical order.</p>
  <p>The <i>Type </i>section organizes displayed functions from the list according to areas
  of application. By default the button <i>All Types</i> is selected and all existing
  functions are displayed in the list. Other buttons only display functions of a certain
  type. More than one type may be selected at a time by clicking on a button while holding
  the CNTRL key.</p>
  <p>The non-editable text field displays the currently selected function. </p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>OK</i> inserts the selected function at the cursor in the insertion bar and closes
  the box. If the cursor is at the beginning of the insertion bar, an equals sign (=) is
  automatically added in front of the function.</p>
  <i><p>Cancel</i> closes the box without changing anything.</p>
  <p>&nbsp;</p>
  <p ALIGN="CENTER">&nbsp;</p>
</blockquote>
<b>

<p>Go to Cell Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Go to Cell </i>dialog box moves the active cell and worksheet display area to
the cell designated by indicated coordinates.</p>

<p>&nbsp;</p>

<p>Upper Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Go to Cell</i> text field specifies the destination cell coordinates.
  Coordinates consist of letters between A and ZZ to designate the column and a number
  between 1 and 30,000 to designate a row. This text field accepts both complete coordinates
  (column AND row) or simple coordinates (column OR row). Example : 12, AG456, 3151........</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>OK</i> closes the box and moves the displayed area of the worksheet and the active
  cell to the specified location.</p>
  <i><p>Cancel</i> closes the box without any changes.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Numeric Setup dialog box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Numeric Setup</i> dialog<i> </i>box defines numeric display parameters for
worksheet cells. These formats apply to both numeric quantities inserted manually and to
formulas resulting in numeric values. There are five different types of cell content:
empty, text-filled, containing a formula resulting in text, number-filled, or containing a
formula resulting in a numeric value. Dates, time, Boolean values, days of the week and
months of the year are included as numeric values.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box:</p>

<blockquote>
  <p>The pulldown list of <i>Format Types</i> allows the user to choose only selected number
  formats from the list. The elements from this list are:</p>
  <i><p>All types</i>: displays all available number formats on the list.</p>
  <i><p>Numbers</i>: displays all available number formats for simple numeric values.</p>
  <blockquote>
    <blockquote>
      <i><p>Units</i>: displays all number formats requiring an identifying unit (monetary
      formats, for example).</p>
      <i><p>Scientific</i>: displays all number formats displaying numeric values in an
      exponential form (for example: 1,123<sup>15</sup>). </p>
      <i><p>Percentage</i>: displays all number formats displaying percentage values (numbers
      followed by % sign). Numeric values displayed in this mode are automatically multiplied by
      100 (0,15 will be displayed: 15%).</p>
      <i><p>Fractions</i>: displays all number formats with numeric fractions. (0,125 will be
      displayed as <i>1/8</i>).</p>
      <i><p>Boolean Values</i>: display all number formats using Boolean values. Boolean numbers
      may consist only of two options: <i>False</i> if the number is 0 or <i>True</i> if it is
      not 0.</p>
      <i><p>Days of the Week</i>: Displays all number formats displaying the names of days of
      the week. (&quot;Monday&quot; for example). A 0 (zero) value corresponds to Sunday, a one
      (1) to Monday, etc.</p>
      <i><p>Months of the Year</i>: Displays all number formats displaying the names of months
      of the year. (&quot;January&quot; for example). A 1 (one) value represents January, 2
      (two) February, etc.</p>
      <i><p>Time:</i> Displays all number formats displaying time (14:21:12PM for example) Time
      is kept on the fractional portion of a number: a thousandth of one second equals:
      1/(24*60*60*1000); a minute equals 1/(24*60) and an hour is 1/24.</p>
      <i><p>Dates</i>: Display all number formats displaying dates (25/12/1995 for example).
      Dates are kept as a fractional portion of a number and reflect the number of days since
      January 1, 2000 (dates prior to 2000 are displayed as negative.)</p>
      <i><p>Dates and Times</i>: Displays all number formats showing dates followed by time
      (25/12/1995 14:21 PM for example).</p>
      <p>&nbsp;</p>
    </blockquote>
  </blockquote>
  <p>The list indicates pre-defined numeric formats. When selecting an item from the list,
  its characteristics appear on the right. Several formats may be selected by using the
  CNTRL key, as long as the chosen format filter is not <i>All Types</i>.</p>
  <p>The text field at the bottom of the list permits the user to change the name of the
  numeric format selected.</p>
  <p>The <i>Add Format</i> button creates a new numeric format. By default this new format
  will have the same characteristics as the selected format and the same name followed by a
  number.</p>
  <p>The <i>Delete Format</i> button deletes a numeric format. All formats are not available
  for deletion (there must remain at least one of each format type) and the user may not
  delete a format in current use.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Right Portion of the Dialog Box:</p>

<p>&nbsp;</p>

<p>The right portion of the dialog box allows the user to see and change number format
characteristics selected from the format list. Because each numeric format has individual
characteristics, the right portion of this dialog box differs depending on the case. It
always contains, from top to bottom:</p>

<blockquote>
  <p>A horizontal toolbar to alter the contents of the <i>Configuration</i> section. The
  number and types of buttons on this bar differ according to the type of numeric format
  selected.</p>
  <p>The <i>Configuration</i> section allows the user to see and change certain
  characteristics of the selected numeric format. The contents of this section differ
  according to the button selected from the horizontal bar described above.</p>
  <p>The <i>Preview</i> section contains a non-editable text field. This gives the user a
  preview of the selected numeric format. The preview number is either a predefined,
  constant number, or the value of the active cell from the worksheet.</p>
  <p>&nbsp;</p>
</blockquote>

<p>When the selected number format is:</p>

<blockquote>
  <i><p>Numbers,</i> the toolbar&#146;s buttons are <i>Display</i> and <i>Colors</p>
  <p>Units</i>, the toolbar&#146;s buttons are <i>Colors</i>,<i> Display</i> and <i>Units</p>
  <p>Scientific</i>, the toolbar&#146;s buttons are <i>Display</i>, <i>Colors</i> and <i>Units</p>
  <p>Percentage</i>, the toolbar&#146;s buttons are <i>Display</i> and <i>Colors.</p>
  <p>Fractions</i>, the toolbar&#146;s buttons are <i>Display</i> and <i>Colors</p>
  <p>Boolean Values,</i> the toolbar&#146;s buttons are <i>Text</i> and <i>Colors</p>
  <p>Days of the Week</i>, the toolbar&#146;s button is <i>Style</p>
  <p>Months of the year,</i> the toolbar&#146;s button is <i>Style</p>
  <p>Time,</i> the toolbar&#146;s button is <i>Time</p>
  <p>Dates,</i> the toolbar&#146;s button is <i>Date</p>
  <p>Dates and Times,</i> the toolbar&#146;s buttons are <i>Date</i> and <i>Time</p>
  </i><p>&nbsp;</p>
</blockquote>

<p>Note: When either the <i>Date</i> or <i>Time</i> button is selected, the text field in
the preview section can be modified manually.</p>

<p>&nbsp;</p>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>Apply</i> accepts all modifications carried out on the format list and applies the
  last selected numeric format to the selected cell regions. The box is then closed.</p>
  <i><p>OK</i> accepts all the modifications carried out on the numeric format list and
  closes the box. All numeric values using modified formats will be updated automatically.</p>
  <i><p>Cancel</i> cancels all operations to the numeric format list and closes the box.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Cell Backgrounds Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Cell Backgrounds</i> dialog box selects colors and designs for cell backgrounds
in selected regions.</p>

<p>&nbsp;</p>

<p>Upper Portion of the Dialog Box:</p>

<blockquote>
  <p>The pulldown <i>Foreground</i> menu selects the foreground design to be applied to
  selected cells. The color list is defined in the <i>Color Preparation</i> dialog box.</p>
  <p>The pulldown <i>Background</i> menu selects the background color and design to be
  applied to selected cells.</p>
  <p>The <i>Design Catalog</i> section previews available designs. Simply click on one of
  the displayed designs to change the background design in a specific region. The design
  selected will be surrounded by a thick frame. The display on the top left is the default
  worksheet design, which is transparent upon printing.</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>OK</i> changes the background design of selected cells to a design selected here.</p>
  <i><p>Cancel</i> closes the box without making changes.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Cell Borders Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Cell Borders</i> Dialog box changes the borders of selected cells on the
worksheet. The user may define border styles and apply them to the top, left, right or
bottom border of each cell, or on the outlining border of an entire selection.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box:</p>

<p>The <i>Apply to</i> section selects the border on which to apply selected designs. To
this end, next to each border type is a clickable preview zone with three different
states:</p>

<blockquote>
  <p>grey : no modification (state 0)</p>
  <p>border: border applied (state 1)</p>
  <p>empty: border eliminated (state 2)</p>
  <p>&nbsp;</p>
</blockquote>

<p>To shift between states 0, 1, and 2, the user must click on the correct button: top,
bottom, left or right. A click with the left mouse button will change the display from
state 0 to state 1, from 1 to state 2, and from 2 to state 1. A click with the right mouse
button will change the display from state 1 to state 0, and state 2 to state 0.</p>

<p>&nbsp;</p>

<p>There are five different displays, each with three different states:</p>

<blockquote>
  <i><p>Outline</i> applies a border to the exterior outline of the cell selection on the
  worksheet. If a single cell is selected on the worksheet, selecting this button is
  identical to selecting top, bottom, left and right borders. When more than one cell is
  selected the effect is different.</p>
  <i><p>Top</i> applies a border to the top of all cells in the selection.</p>
  <i><p>Bottom</i> applies a border to the bottom of all cells in the selection.</p>
  <i><p>Left</i> applies a border to the left of all cells in the selection.</p>
  <i><p>Right</i> applies a border to the right of all cells in the selection.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Right Portion of the Dialog Box:</p>

<blockquote>
  <p>The pulldown <i>Line Features</i> menu selects the width and design of the border to be
  applied.</p>
  <p>The pulldown <i>Dotted-line</i> menu displays several dotted designs to be applied to
  the Line Features list.</p>
  <p>The <i>Foreground Color</i> menu selects a border&#146;s foreground color. The color
  list is defined in the <i>Color Preparation</i> dialog box.</p>
  <p>The <i>Background Color</i> menu selects a border&#146;s background color.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>OK</i> applies the defined borders to selected worksheet cells and closes the box.</p>
  <i><p>Cancel</i> closes the box without changing any cell borders.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Font Composition Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>This dialog box defines font styles used in text display. It associates a name with a
text-style as defined by specific parameters.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box</p>

<blockquote>
  <p>The font list displays pre-defined styles. When a font is selected from the list, its
  characteristics appear on the right. Several fonts may be selected at once by using the
  CNTRL key. Pre-defined styles are stored in the Configuration Files.</p>
  <p>The text field beneath the list modifies the name of a selected style.</p>
  <p>The <i>New Font </i>button creates a new font. By default it will have the same
  characteristics as the selected font, as well as the same name followed by a number.</p>
  <p>The <i>Delete Font</i> button deletes a font. A font used in the application or defined
  with the \LOCK command in the Configuration Files cannot be deleted. </p>
  <p>&nbsp;</p>
</blockquote>

<p>Right Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Features</i> and <i>Configuration</i> buttons change the contents of the <i>Configuration</i>
  section. If the <i>Features</i> button is selected, basic stylistic features may be
  chosen, such as underlining, shadowing, etc. The <i>Configuration</i> button changes font
  parameters in detail.</p>
  <p>The <i>Configuration</i> section may take on two forms:</p>
  <p>General font features, if the <i>Features</i> button is engaged</p>
  <p>Detailed feature configuration, if the <i>Configuration</i> button is engaged.</p>
  <p>The preview area instantly displays the appearance of a font in its current
  configuration. </p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>Apply</i> accepts all modifications carried out upon the list and closes the dialog
  box. Text using modified styles will be automatically updated. The selected style will be
  applied to all currently selected cells.</p>
  <i><p>OK</i> accepts all modifications carried out upon the list and closes the box. Texts
  utilizing modified styles will be updated automatically.</p>
  <i><p>Cancel</i> cancels all operations to the list and closes the box.</p>
  <p>&nbsp;</p>
</blockquote>

<p>________________________________________________________________</p>

<p>&nbsp;</p>
<b>

<p ALIGN="CENTER">Configuration Section : General features</p>
</b>

<p>&nbsp;</p>
<b>

<p>In this format the Configuration Section is composed, from top to bottom, by:</p>

<blockquote>
  </b><p>The pulldown <i>Font Family</i> menu selects font type. This list is kept in the
  Configuration files.</p>
  <p>The Color List selects the font color. The Color list is defined in the <i>Color
  Preparation</i> dialog box.</p>
  <p>The <i>Size</i> text field defines font size. This measure corresponds to the
  font&#146;s height and is expressed in typographic points between 1 and 1000 pts.</p>
  <p>The horizontal toolbar changes font features. Toolbar buttons are as follows:</p>
  <blockquote>
    <blockquote>
      <p>The first button produces bold features. If the selected font family does not support
      bold print, this button is grey.</p>
      <p>The second button produces italic features. If the selected font family does not
      support italic print, this button is grey. </p>
      <p>The third button produces a shadow feature. The user may extensively modify the
      shadow&#146;s configuration from the <i>Detailed Configuration</i> section.</p>
      <p>The fourth button produces an underline feature. The user may extensively modify the
      underline&#146;s configuration from the <i>Detailed Configuration</i> section.</p>
      <p>The last button produces a strike-through feature. The user may extensively modify the
      strike-through&#146;s configuration from the <i>Detailed Configuration</i> section.</p>
      <p>&nbsp;</p>
    </blockquote>
  </blockquote>
  <p>The <i>Exponent</i> button produces superscript features. The <i>Exponent</i> and <i>Index</i>
  features are mutually exclusive. The user may extensively modify exponent configuration
  from the <i>Detailed Configuration</i> section. </p>
  <p>The <i>Index</i> button produces subscript features. The <i>Exponent</i> and <i>Index</i>
  features are mutually exclusive. The user may extensively modify the index configuration
  from the <i>Detailed Configuration</i> section.</p>
  <p>The <i>Small Caps</i> button changes lowercase letters to small caps. The small caps
  appear like regular capital letters except they retain their original small size. The <i>Small
  caps</i> and <i>uppercase</i> features are mutually exclusive.</p>
  <p>The<i> Uppercase</i> button changes lower case letters to uppercase letters. The <i>Small
  caps</i> and <i>uppercase</i> features are mutually exclusive. </p>
  <p>The <i>Width</i> button enlarges or narrows font width. The horizontal expansion factor
  may be selected from the <i>Detailed Configuration</i> section.</p>
  <p>The <i>Summary of Parameters</i> section displays a synthesis of the selected
  font&#146;s characteristics and features.</p>
  <p>&nbsp;</p>
</blockquote>

<p>__________________________________________________________</p>
<b>

<p ALIGN="CENTER">Configuration Section: Detailed Configuration</p>
</b>

<p>&nbsp;</p>

<p>The <i>Configuration</i> section in this format allows the user to fine-tune the
configuration of various selected features. This section is divided into six sub-sections,
one for each feature. Each of these sub-sections contains a button in front of the
feature&#146;s name. When modifying a value in one of these sub-sections, its button
selects itself automatically in order that the user be able to view changes in the preview
area. </p>

<p>&nbsp;</p>

<p>Several of these parameters relate to a particular fraction of font height. (the space
between the baseline and the top line of a font.)</p>

<p>&nbsp;</p>

<p>&nbsp;</p>
<b>

<p>The Configuration section is composed of:</p>
</b>

<p>&nbsp;</p>

<blockquote>
  <p>The <i>Underline</i> section is made up of:</p>
  <blockquote>
    <blockquote>
      <p>A text field <i>dY</i> selects the position of the underline bar. This value is
      expressed as a percentage of the font height and will be between 0 and 100%. A 0% value
      corresponds to an underline bar at the baseline.</p>
      <p>A<i> Color List</i> selects the color of the underline.</p>
      <p>The <i>Ep</i> text field selects the thickness of the bar. This value is expressed as a
      percentage of the font height and must be between 1% and 20%.</p>
      <p>The list of line styles selects the underline bar&#146;s design. It contains a
      combination of simple, double or triple underlines or spaces.</p>
      <p>&nbsp;</p>
    </blockquote>
  </blockquote>
  <p>The <i>Strike-through</i> section is made up of:</p>
  <blockquote>
    <blockquote>
      <p>The <i>dY</i> text field selects the position of the bar. This value is expressed as a
      percentage of the font height and must be between 0% and 100%. A 0% value corresponds to a
      strike-through at the baseline, a 100% corresponds to a strike-through at the top-line.</p>
    </blockquote>
  </blockquote>
  <p>The <i>Color List</i> selects the color of the bar.</p>
  <blockquote>
    <blockquote>
      <p>The <i>Ep</i> text field selects the thickness of the bar. The value is expressed as a
      percentage of the font height and must be set between 1% and 20%. </p>
      <p>The list of line styles selects the strikethrough bar&#146;s design. It contains a
      combination of simple, double, or triple bars or spaces.</p>
      <p>&nbsp;</p>
    </blockquote>
  </blockquote>
  <p>The <i>Shadowed</i> section is made up of:</p>
  <p>--The <i>dX</i> text field selects the horizontal differential from the shadow. This
  value is expressed as a fraction of the font height, in percentage form between -50% and
  50%. A 0% value corresponds to no differential. A negative value corresponds to a shadow
  leaning towards the height, and a positive value corresponds to a shadow leaning towards
  the bottom.</p>
  <p>--The <i>dY</i> text field selects the shadow&#146;s vertical differential. This value
  is expressed as a fraction of the font height, in percentage form between -50% and 50%. A
  0% value corresponds to no differential. A negative value corresponds to a shadow leaning
  towards the top and a positive value corresponds to a shadow leaning towards the bottom.</p>
  <p>--The color list selects the shadow color for the font.</p>
  <p>&nbsp;</p>
  <p>The <i>Width </i>section is made up of:</p>
  <p>--The <i>Width</i> text field defines the horizontal expansion factor. This factor is
  expressed as a percentage and must be between 1% and 1000%. If the value is 100%, the font
  is normal size. If the value is 50%, the font is half as wide as normal, and if the value
  is 200% the font is twice normal size.</p>
  <p>&nbsp;</p>
  <p>The <i>Index</i> section is made up of:</p>
  <p>--The <i>Y-pos</i> text field selects the differential towards the bottom of the font.
  This value is expressed as a fraction of font height, in percentage form between 0% and
  100%. A 0% value corresponds to no differential, and a 50% value corresponds to a
  differential towards the bottom of the baseline from halfway up the height of the font.</p>
  <p>--The <i>Size</i> text field selects the reduction factor of the font. This value
  corresponds to a fraction of the normal font size, expressed as a percentage between 10%
  and 100%. A 100% value corresponds to no reduction and a 50% value for a 12 pt font
  corresponds to a 6 pt font size for the index feature.</p>
  <p>&nbsp;</p>
  <p>The <i>Exponent</i> section is made up of:</p>
  <p>--The <i>Y-pos</i> text field selects the differential towards the top of the font.
  This value is expressed as a fraction of font height, in percentage form between 0% and
  100%. A 0% value corresponds to no differential, and a 50% value corresponds to a
  differential towards the top of the baseline from halfway up the font height. </p>
  <p>--The <i>Size</i> text field selects the font reduction factor. This value corresponds
  to a fraction of the normal font size, expressed in percentage form between 10% and 100%.
  A 100% value corresponds to no font reduction, and a 50% value for a 12 pt. font
  corresponds to a 6 pt. font size for the exponent features.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Frame Features Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>This dialog box modifies certain frame features. This box may not be opened unless one
or more frames are selected. To call up this box, use the <i>Frame features</i> entry in
the pulldown menu or double click on a frame.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box:</p>

<blockquote>
  <p>The frame list displays the currently selected frames. Each frame is associated with a
  title which is, by default, <i>Frame X</i> where X is a number or a sequence of numbers.
  When selecting one of these elements from the list, the corresponding frame&#146;s
  characteristics appear at the right. Several frames may be selected at once from the list
  by holding the CNTRL key.</p>
  <p>The text field just below the list modifies the frame title selected in the list.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Right Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Background Color</i> pulldown menu selects a background color for the frame
  selected in the list. This color list is modified from the <i>Color Preparation</i> dialog
  box.</p>
  <p>The <i>Border color</i> pulldown menu selects border colors for the frame selected in
  the list. This color list is modified from the <i>Color Preparation</i> dialog box.</p>
  <p>The <i>Border Thickness</i> text field defines border thickness in typographic points.
  This value must be between 0 and 99 pt. Frame thickness does not appear on the XQuad
  display screen, however this parameter is taken into account upon printing.</p>
  <p>The <i>Preview</i> area previews different features of the rectangular frame.</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower portion of the dialog box:</p>

<blockquote>
  <i><p>OK</i> accepts all the modifications carried out upon the selected frames and closes
  the box.</p>
  <i><p>Cancel</i> cancels all modifications and closes the box.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Row and Column Size Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Row and Column Size</i> dialog box selects dimensions for rows and/or columns in
the selected cell region.</p>

<p>&nbsp;</p>

<p>Upper Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Column Width</i> text field selects the width of columns in the selected cell
  region. The value is expressed in centimeters and must be set between 0 and 100 cm. When
  this value is changed, the <i>Apply</i> button in the columns section selects itself
  automatically.</p>
  <p>The <i>Apply</i> button in the column section determines whether or not a column width
  value will be applied or not. The user may change column widths and row heights
  independently.</p>
  <p>The <i>Row Height</i> text field selects the height of rows in the selected cell
  region. This value is expressed in centimeters and must be set between 0 and 100 cm. When
  this value is changed, the <i>Apply</i> button in the rows section selects itself
  automatically.</p>
  <p>The <i>Apply</i> button in the row section determines whether or not a row height value
  will be applied or not. The user may change row height and column widths independently. </p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower Portion of the Dialog Box:</p>

<blockquote>
  <i><p>OK</i> changes the width of columns and/or the height of rows in the selected cell
  regions according to the given indications.</p>
  <i><p>Cancel</i> closes the box without changes to the worksheet.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Graphic Configuration Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Graphic Configuration</i> dialog box selects the area of the cell region to act
as a data source in the calculation of a graph. The geometry of the cell region will
correspond to series divisions within that region and the presence of titles, series
names, and/or x-axis labels. To access this dialog box, at least one graphic frame must be
selected in the worksheet, then click on the last button in the fourth section of the
horizontal <i>Graphic Manipulation</i> toolbar, or select the <i>Graphing tool
Configuration</i> entry in the menu bar.</p>

<p>&nbsp;</p>
<b>

<p>Terminology:</b> </p>

<p>Given the following portion of a worksheet:</p>

<p>[insert excel table]</p>

<p>&nbsp;</p>

<p>To create a graph from this portion of a table, select the cell region B2:D14 as data
source for the graph. In this table , the zone of values to be reported in the graph is
the region C3:D14. This region must be cut into two series of 12 values: the regions
C3:C14 and D3:D14. The series break is done by columns. C2 and C3 cells are series names.
The B2 cell is the title or name of the graph. The cell region B3:B14 are X-axis names or
titles.</p>

<p>&nbsp;</p>

<p>Left Portion of the Dialog Box:</p>

<blockquote>
  <p>The <i>Columns</i> button indicates that the values of a data set are taken from one
  column. In the example, the series must be read from one column in order to obtain a
  relevant graph.</p>
  <p>The <i>Rows</i> button indicates that the values of a data set are taken from one row.
  In the example, the series must be read from one row in order to obtain a relevant graph.</p>
  <p>The X<i>-axis labels</i> button indicates that the first column of the cell region
  contains x-axis labels. If the series are read as rows, this button indicates that the
  first row contains x-axis lablels. In the example this button would be selected. To create
  this graph XQuad will consider the first column to be read as the first data set, because
  this column contains numbers. (Region B3:B14)</p>
  <p>The <i>First Data Set</i> button indicates that the first column of the selected cell
  region contains the values for the first data set. If the series are read as rows, this
  button indicates that the first row contains the values of the first data set. When this
  button is selected, neither the X-axis nor the graph itself have a label.</p>
  <p>The <i>Legend text</i> button indicates that the first row of the cell region contains
  series names. If the series is read in rows, this button indicates that the first column
  contains series names. In the example, the first line (region C2:D2) contains the titles
  of two series, therefore this button would be selected.</p>
  <p>The <i>First Data Set</i> button indicates that the first row of the cell region
  contains the first values of the data-set. If the series are read in rows, this button
  indicates that the first column will contain the first values of the data-set. When this
  button is selected, neither the series nor the graph itself have labels.</p>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</blockquote>

<p>Right Portion of the Dialog Box:</p>

<p>This portion contains a graphic preview with current parameters as selected in the left
portion of the dialog box.</p>

<p>&nbsp;</p>

<p>Lower Portion of the dialog box:</p>

<blockquote>
  <i><p>OK</i> accepts changes to graph configuration parameters and closes the box.</p>
  <i><p>Cancel</i> closes the box without modification to the graph configuration.</p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>File Selectors</p>
</b>

<p>&nbsp;</p>

<p>A file selector chooses a file to read or upon which to make alterations. All file
selectors function identically, however some offer additional features.</p>

<p>&nbsp;</p>

<p>Common elements of a file selector:</p>

<blockquote>
  <p>A title indicates the selector name</p>
  <p>A pulldown list allowing the user to rapidly search a branch of the current directory.
  It contains all the sub-directories of the current directory&#146;s branch, up to the root
  directory.</p>
  <p>The next list shows all sub-directories and files from the current directory. Directory
  names appear in alphabetical order at the beginning of the list with the &quot;/&quot;
  character at the end of each name. Filenames receiving an eventual filter are displyed
  next. Double clicking on a directory name allows the user to access that file; the current
  directory is returned to the pulldown list and the selected directory becomes the new
  active directory with its contents displayed in the list. A simple click on a file name
  causes that filename to appear in the text field below. Double clicking on a filename
  selects the file without other confirmation. </p>
  <p>The text field displays the file name selected from the list and allows the user to
  change that name. The user may enter a filename complete with routing. If the entry is
  affixed with the &quot;~&quot; character, this directory becomes the new current
  directory. If the name is entered and affixed with the &quot;/&quot; character, the
  current directory will point to the new destination. In some file selectors an extension
  is automatically added to the file name upon validation.</p>
  <p>The left button of the lower portion of the file selector accepts the filename for the
  action indicated on the button and closes the box.</p>
  <p>The <i>Cancel</i> button on the right cancels all actions and closes the box.</p>
</blockquote>

<p>___________________________________________________</p>
<b>

<p>Opening a document:</p>
</b>

<p>&nbsp;</p>

<p>The <i>Opening a Document</i> file selector opens a previously saved XQuad document.
The XqQad filename will usually posess an &quot;.xq&quot; extension; only files with this
extension will be displayed. This file selector is no different than other file selectors;
for further details about its use, see the instructions in<i> Standard File Selectors</i>
.</p>

<p>&nbsp;</p>
<b><u><i>

<p>_____________________________________________________</p>
</i></u>

<p>Saving a document as:</p>
</b>

<p>&nbsp;</p>

<p>The <i>Saving a Document as..</i> file selector selects the filename under which the
active worksheet will be saved on disk. The <i>.xq</i> extension will be added
automatically to the filename. The file selector is no different than other file
selectors; for further details about its use, see the instructions in <i>Standard File
Selectors</p>
</i>

<p>&nbsp;</p>

<p>______________________________________________________</p>
<b>

<p>Printing to a file</p>
</b>

<p>&nbsp;</p>

<p>The <i>Printing to a File</i> file selector selects the filename to which print data
from the active worksheet will be saved. This file selector is called up from the <i>Print</i>
dialog box when <i>File</i> is selected<i> </i>as the destination printer. This file
selector is exactly like the Standard File Selector. The <i>.ps</i> extension is added to
the filename.</p>

<p>&nbsp;</p>
<b>

<p>Importing a Document File Selector</p>
</b>

<p>&nbsp;</p>

<p>The <i>Importing a Document</i> file selector selects a filename to be imported and the
type of data contained in this file. There are two types of import formats: text and Excel
formats.</p>

<p>&nbsp;</p>

<p>At the top, right portion of the selector, a pulldown list allows the user to select
the type of data imported. Depending upon what is selected from this list, the <i>Configuration</i>
section on the right side of this file selector may have two forms:</p>

<p>&nbsp;</p>

<blockquote>
  <p>Importing text files: (elements &quot;Text [Unis/Dos/Mac] [space/tab/csv]&quot;) The <i>Configuration</i>
  section will appear like the screen photo above.</p>
  <p>Importing Excel files: (elements &quot;Excel [2/3/4]&quot;). The <i>Configuration</i>
  section is empty. Importing an Excel file creates a new worksheet. Attention: the user
  must select the correct Excel file version.</p>
  <p>&nbsp;</p>
</blockquote>

<p>In the case of importing text files, the <i>Configuration s</i>ection is composed from
top to bottom by:</p>

<blockquote>
  <p>The <i>In the Active Document</i> button allows the imported text file contents to be
  inserted in the active worksheet. This insertion into the active cell may erase the
  contents of cells underneath and to the right. The design elements of erased cells will
  not be affected. When this button is not engaged, a new worksheet is created to receive
  the imported file&#146;s contents.</p>
  <p>The <i>Cut Spaces Before</i> button suppresses space characters at the beginning of
  each cell&#146;s contents. If the file to be imported contains data formatted with spaces,
  it is preferable to keep this button engaged.</p>
  <p>The <i>Cut Spaces After</i> button suppresses space characters at the end of each
  cell&#146;s contents. If the file to be imported contains data formatted with spaces, it
  is preferable to keep this button engaged.</p>
  <p>The columns text field: shows how cells will be separated into columns from the
  imported file. The contents of this text field are regulated by administered by a specific
  syntax.</p>
  <p>The three buttons <i>Accent types</i> (&quot;UNIX,Windows&quot;, &quot;DOS-OS/2&quot;
  and &quot;Macintosh&quot;) allow the user to specify which accent table will be used in
  order to obtain a satisfactory conversion from the system where XQuad imports files. </p>
  <p>&nbsp;</p>
</blockquote>
<b>

<p>Exporting Documents File Selector</p>
</b>

<p>&nbsp;</p>

<p>The <i>Exporting Documents</i> file selector selects a file name to which a portion of
the active worksheet will be exported. This file selector can take on three forms,
depending upon the element used from the <i>file/export</i> sub-menu.</p>

<p>&nbsp;</p>

<p>________________________________________________________________</p>
<b>

<p ALIGN="CENTER">Export in the Form of Line Art</p>
</b>

<p>&nbsp;</p>

<p>To access this file selector, go through the menu <i>File/Export/Line art</i>.
Exportation in the form of line art can be carried out on a single cell selection from the
worksheet or on a frame selection containing a graph. In the first case, the <i>Print Grid</i>
and <i>Print Row and Column Headers</i> parameters from the <i>Print configuration</i>
dialog box will be taken into account. Exportation of line art is done in Adobe
Illustrator format. This file format can be imported in Xclamation, Axene&#146;s desktop
publishing software. The<i> .ai</i> extension will be automatically added to the filename.
This selector is identical to the standard file selector.</p>

<p>&nbsp;</p>

<p>_____________________________________________________________________</p>
<b>

<p ALIGN="CENTER">Export Text</p>
</b>

<p>&nbsp;</p>

<p>To access this file selector, go through the <i>File/Export/Text</i> menus<i>.</i> In
this particular file selector a pulldown list at the top right portion of the dialog box
selects the text format to be exported. Depending upon the format chosen, the <i>Configuration
Section</i> at the right side of the box can take on two forms:</p>

<blockquote>
  <blockquote>
    <blockquote>
      <p>For formats: &quot;Text UNIX Tab&quot;, &quot;Text UNIX CSV&quot;, &quot;Text DOS
      Tab&quot;, &quot;Text DOS CSV&quot;, &quot;Text Mac Tab&quot;, and &quot;Text Mac
      CSV&quot; the selector takes on the following form: [insert screen photo]</p>
      <p>&nbsp;</p>
    </blockquote>
  </blockquote>
</blockquote>

<p>The configuration section is composed from top to bottom:</p>

<blockquote>
  <p>The <i>Export Selection</i> button allows the user to select whether or not one wants
  to export only the selected cell or the entire utilized area of the worksheet. If this
  button is engaged, only selected cells will be exported.</p>
  <p>The <i>Export formulas</i> button allows the user to select whether one wants to export
  formulas or formula results. If this button is engaged and a cell to be exported contains
  a formula, (&quot; =pi * 12 squared&quot; for example), the formula will be exported to
  the new file as a character string. If this button is not engaged, the result of this
  formula would be exported (&quot;452,38934211693022633&quot; in the example) .</p>
  <p>&nbsp;</p>
</blockquote>

<p>The <i>Configuration </i>section is composed from top to bottom by:</p>

<blockquote>
  <p>The <i>Export Selection</i> button determines whether the cell selection only will be
  exported or the entire used area of the worksheet. If this button is engaged only the
  selected cells will be exported.</p>
  <p>The <i>Add Grid</i> button enhances cell outlines. When this button is engaged, each
  cell will be outlined by characters available in the specified character suite. </p>
  <p>The <i>Add Headers</i> button adds row and column headers upon exportation. When this
  button is engaged the worksheet&#146;s coordinate system appears transparently in the
  export file.</p>
  <p>The three Accent Types buttons (&quot;UNIX,Windows&quot;, &quot;DOS,OS/2&quot; and
  &quot;Macintosh&quot;) specify the accent table to be used to obtain a good conversion
  between two systems and environments.</p>
  <p>&nbsp;</p>
</blockquote>

<p>When exporting in text format the cells of a column will be exported with the same
number of characters. In this case, a file displayed with non-proportional fonts will
appear to have aligned cells.</p>

<p>&nbsp;</p>

<p>The lower left and lower portion of the file selector are used like a standard file
selector.</p>

<p>&nbsp;</p>

<p>To access this file selector, pass through the <i>File/Export/HTML</i> menu. The
ensemble of cells from the utilized worksheet area will be exported. HTML rendering is
done with the help of a table (marked &lt;table&gt;...., &lt;/table&gt;) in HTML 3.0
style. The .<i>html</i> extension will be automatically added to the filename. This file
selector is like that of the standard file selector. </p>

<p>&nbsp;</p>
<b>

<p>Font Replacement Dialog Box</p>
</b>

<p>&nbsp;</p>

<p>The <i>Font Replacement</i> dialog box can appear when downloading a XQuad document.
The downloading file may contain specific fonts. If one of these fonts does not have an
XQuad equivalent, this box will open automatically to establish an equivalent.</p>

<p>&nbsp;</p>

<p>Upper Portion of the Dialog Box:</p>

<blockquote>
  <i><p>Unavailable font</i> label. This label gives the name of the font to be replaced, as
  indicated in the file being read and for which there is no XQuad equivalent font.</p>
  <p>The XQuad <i>Available Font List</i>. The user must select an item from the list; this
  font will become the substitute for the previous font with no XQuad equivalent. By
  default, the XQuad font with a name most similar to the unavailable font will be selected.</p>
  <p>The <i>Keep Association</i> button allows the user to store the substitution of one
  font by a particular XQuad font for the remainder of the execution. To this end each time
  the unavailable font is encountered, the XQuad font will be substituted automatically.</p>
  <p>&nbsp;</p>
</blockquote>

<p>Lower portion of the dialog box:</p>

<p>&nbsp;</p>

<blockquote>
  <i><p>OK</i> accepts the replacement font for the unavailable font and continues to
  download the file.</p>
  <i><p>Cancel</i> cancels the font substitution and stops downloading the file.</p>
  <p>&nbsp;</p>
</blockquote>
