<br>
XQuad&nbsp; is a spreadsheet application designed for the numerical data processing. It
allows users to arrange data and charts according to their preference. </p>

<p><br>
</p>

<h2>Introduction</h2>

<p>XQuad permit import and manual entry of numerical and alphanumerical data into
spreadsheets.</p>

<p>A spreadsheet is an array containing boxes that are named <a href="Sheet_Cells.html">cells</a>
and are organised by coordinates. Each cell is an intersection of a row and a column.
Lines are numbered from 1 to 100,000. Columns are &quot;numbered&quot; by letters series
from A to ZZ (702 columns). When you put together the row coordinate and the column
coordinate, you have the cell coordinates.</p>

<p>Besides numerical and alphanumerical data, cells can also contains formulas. There is
one of the great advantages of spreadsheet applications: you can reference several cells
and combine theirs values thanks to theirs coordinates. These links are dynamics, so any
value modification of a referenced cell cause the automatic update of the referring cells.
</p>

<p>XQuad can also make charts and graphs from the values of a spreadsheet area. Graphs are
also dynamically linked to the values of this spreadsheet area. </p>

<p><br>
</p>

<h2>The Launch</h2>
<b>

<p>usage:</b> <tt>XQuad [-help] [-version] [-fg&nbsp;&lt;color&gt;]
[-bg&nbsp;&lt;color&gt;] [-display&nbsp;&lt;displayname&gt;] [-geometry&nbsp;&lt;geom&gt;]
[-/+opaqueResize] [-opaqueMove&nbsp;&lt;percentage&gt;]
[-keepFreeColor&nbsp;&lt;number&gt;] [files ...] </tt></p>

<p><b>detail:</b> <tt><b>-help, --help, -h</b></tt><br>
displays a summary of command line parameters. </p>

<p><tt><b>-version, -v</b></tt><br>
displays XQuad version number. </p>

<p><tt><b>-fg color</b></tt><br>
defines foreground color. </p>

<p><tt><b>-bg color</b></tt><br>
defines background color. </p>

<p><tt><b>-display host:dpy</b></tt><br>
specifies X server to be used. </p>

<p><tt><b>-geometry geom</b></tt><br>
determines size of main window. </p>

<p><tt><b>-opaqueResize</b></tt><br>
annuls opaque mode's re-sizing of the internal <a HREF="../xclamation/Document_Window.html">window manager</a>. </p>

<p><tt><b>+opaqueResize</b></tt><br>
activates opaque mode's re-sizing of the internal <a HREF="../xclamation/Document_Window.html">window manager</a>. </p>

<p><tt><b>-opaqueMove percentage</b></tt><br>
Sets the percentage of <a HREF="../xclamation/Main_Interface.html#worktop">desktop area</a>
in which the document window must fit in opaque mode. </p>

<p><tt><b>-keepFreeColor number</b></tt><br>
Sets number of colors to be available for use in other X applications. For a palette of
256 colors this value is 10 by default. This option may only be useful when your X server
works with Pseudo-color. </p>

<p><tt><b>--xbugline, -xbugline, -xbl</b></tt><br>
Correct a bug with some video driver. You'll have to use this parameter only if lines in
vector based drawings are misplaced. </p>

<p><tt><b>--xbugpoint, -xbugpoint, -xbp</b></tt><br>
Correct a bug with some video driver. You'll have to use this parameter only if screen
fonts are not displayed fine. </p>
