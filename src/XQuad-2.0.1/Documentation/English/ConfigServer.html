This <a HREF="Config.html">configuration files</a> section configures the necessary
license server to operate under floating licenses. </p>

<h3>License Server configuration section: <i>\KEYSERVER{...}</i></h3>

<p>This section sets the configuration of XQuad's license server. The definition of the
license server begins after the opening bracket <i>&quot;{&quot;</i> and before the
corresponding closing bracket <i>&quot;}&quot;</i>. The configuration parameters are: 

<ol>
  <li><b>\SERVER{host}</b> where <i>host</i> represents the machine holding the license
    server. <br>
    &nbsp;</li>
  <li><b>\PORTX</b>: port number holding the license server. <br>
    &nbsp;</li>
</ol>

<h3>Example:</h3>
<tt>

<p>\KEYSERVER{ \SERVER{foobar} \PORT8510 }<br>
</tt></p>
