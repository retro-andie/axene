<h3><a NAME="max"><font COLOR="#2244AA">max</font></a></h3>

<ul>
  <p><b>Renvoie le plus grand des nombres passés en paramètre.</b> </p>
  <p><b>max(<i>nombre1</i><font COLOR="#333333">; <i>nombre2</i>; <i>...</i></font>)</b> <ul>
    <li><i>nombreN&nbsp;:</i> nombre à traiter. </li>
  </ul>
  <p><b><u>Exemple</u>&nbsp;:</b><br>
  <ul>
    <tt><p>=max(12;45;3;2;57)</tt><br>
    <b>Valeur&nbsp;: </b>57 </p>
  </ul>
</ul>

<hr>

<h3><a NAME="min"><font COLOR="#2244AA">min</font></a></h3>

<ul>
  <p><b>Renvoie le plus petit des nombres passés en paramètre.</b> </p>
  <p><b>min(<i>nombre1</i><font COLOR="#333333">; <i>nombre2</i>; <i>...</i></font>)</b> <ul>
    <li><i>nombreN&nbsp;:</i> nombre à traiter. </li>
  </ul>
  <p><b><u>Exemple</u>&nbsp;:</b><br>
  <ul>
    <tt><p>=min(12;45;23;11;57)</tt><br>
    <b>Valeur&nbsp;: </b>11 </p>
  </ul>
</ul>

<hr>

<h3><a NAME="moyenne"><font COLOR="#2244AA">moyenne</font></a></h3>

<ul>
  <p><b>Renvoie la moyenne des nombres passés en paramètre.</b> </p>
  <p><b>moyenne(<i>nombre1</i><font COLOR="#333333">; <i>nombre2</i>; <i>...</i></font>)</b>
  <ul>
    <li><i>nombreN&nbsp;:</i> nombre à traiter. </li>
  </ul>
  <p>Renvoie la moyenne des nombres passés en paramètre. Cette commande admet aussi des
  paramètres au format zones (ex: A3:B7). </p>
  <p><b><u>Exemple</u>&nbsp;:</b><br>
  <ul>
    <tt><p>=moyenne(12;45;23;17;57)</tt><br>
    <b>Valeur&nbsp;: </b>30.8 </p>
  </ul>
</ul>

<hr>

<h3><a NAME="nb"><font COLOR="#2244AA">nb</font></a></h3>

<ul>
  <p><b>Renvoie le nombre d'arguments passés en paramètre.</b> </p>
  <p><b>nb(<i>nombre1</i><font COLOR="#333333">; <i>nombre2</i>; <i>...</i></font>)</b> <ul>
    <li><i>nombreN&nbsp;:</i> nombre à traiter. </li>
  </ul>
  <p>Renvoie le nombre d'arguments non vides passés en paramètre. Cette commande admet
  aussi des paramètres au format zones (ex: A3:B7). </p>
  <p><b><u>Exemple</u>&nbsp;:</b><br>
  <ul>
    <tt><p>=nb(12;45;23;&quot;gato&quot;;57)</tt><br>
    <b>Valeur&nbsp;: </b>5 </p>
  </ul>
</ul>

<hr>

<h3><a NAME="nbval"><font COLOR="#2244AA">nbval</font></a></h3>

<ul>
  <p><b>Renvoie le nombre d'arguments passés en paramètre.</b> </p>
  <p><b>nbval(<i>nombre1</i><font COLOR="#333333">; <i>nombre2</i>; <i>...</i></font>)</b> <ul>
    <li><i>nombreN&nbsp;:</i> nombre à traiter. </li>
  </ul>
  <p>Renvoie le nombre d'arguments non textuels non vides passés en paramètre. Cette
  commande admet aussi des paramètres au format zones (ex: A3:B7). </p>
  <p><b><u>Exemple</u>&nbsp;:</b><br>
  <ul>
    <tt><p>=nbval(12;45;23;&quot;gato&quot;;57)</tt><br>
    <b>Valeur&nbsp;: </b>4 </p>
  </ul>
</ul>

<p><br>
</p>
