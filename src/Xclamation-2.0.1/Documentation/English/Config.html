<p>Xclamation permits the user to define certain configuration parameters by default: 

<ul>
  <li><a HREF="ConfigFont.html">Font configuration</a> </li>
  <li><a HREF="ConfigColor.html">Color configuration</a> </li>
  <li><a HREF="ConfigStyle.html">Style configuration</a> </li>
  <li><a HREF="ConfigParagraph.html">Paragraphs configuration</a> </li>
  <li><a HREF="ConfigHelp.html">Help configuration</a> </li>
  <li><a HREF="ConfigImageCache.html">Image Cache configuration</a> </li>
  <li><a HREF="ConfigPrinter.html">Printer configuration</a> </li>
  <li><a HREF="ConfigServer.html">License Server configuration</a> <br>
    &nbsp;</li>
</ul>

<p>These parameters are described in the &quot;xclamationrc&quot; file. Each user may also
add his or her own default parameter definitions by creating an &quot;.xclamationrc&quot;
file in the home directory. </p>

<p>Xclamation reads configuration files sequentially in this order: 

<ol>
  <li>&quot;<b>xclamationrc</b>&quot; </li>
  <li>&quot;<b>.xclamationrc</b>&quot; </li>
</ol>

<p>&nbsp;</p>

<h3>Configuration file syntax:</h3>

<p>Xclamation's configuration files are stored in several overlapping sections. Each
section begins with &quot;\TYPESECTION {&quot;, where <i>TYPESECTION</i> is the specified
word indicating the section type. Sections end with a closing bracket <i>&quot;}&quot;</i>.
The structure of an Xclamation configuration file takes on the following form: </p>
<tt>

<p><a HREF="Config.html#config">\CONFIG</a>{ <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigFont.html">\FONTLIST</a>{ <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigFont.html#font">\FONT</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigFont.html#font">\FONT</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;} <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigColor.html">\COLORLIST</a>{ <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigColor.html#color">\COLOR0</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigColor.html#color">\COLORN</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;} <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigStyle.html">\STYLELIST</a>{ <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigStyle.html#style">\STYLE0</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigStyle.html#style">\STYLEN</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;} <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigParagraph.html">\RULERLIST</a>{ <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigParagraph.html#ruler">\RULER0</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;... <br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigParagraph.html#ruler">\RULERN</a>{...}
<br>
&nbsp;&nbsp;&nbsp;&nbsp;} <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigHelp.html">\HELP_CONFIG</a>{ <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigImageCache.html">\CACHE_CONFIG</a>{...} <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigPrinter.html">\PRINTER</a>{...} <br>
&nbsp;&nbsp;&nbsp;&nbsp;<a HREF="ConfigServer.html">\KEYSERVER</a>{...} <br>
} </tt><a NAME="config"></p>

<h3>Main section of the Configuration file: <i>\CONFIG {...}</i></h3>

<p>Main section of the configuration file. A configuration file must begin with: <i>&quot;\CONFIG
{&quot;</i> and end with the corresponding closing bracket &quot;}&quot;. Each element's
configuration section appears between two brackets. </a></p>
