<p><br>
<br>
Xclamation is a desktop publishing application designed for the personal publication of
documents with layouts too complex for simple word-processing software. It allows users to
arrange text, graphics, tables and other items according to their preference. </p>

<p><br>
</p>

<h2>Creating a Document</h2>

<p>Page layouts are made up of frames. A frame is a pregnant geometric shape whose outline
delimits the visible portion of the object inside the frame part of a document, for
example. <br>
</p>

<p>There are two steps to creating an Xclamation document: 

<ol>
  <li><b>Frame placement</b> on the page. Placement is effected via frame creation,
    adjustments of frame size and shape, and by the frame's positioning on the page in
    relation to other frames. <br>&nbsp;</li>
  <li><b>Object placement</b> inside frame. To place an object, import it to a frame and
    adjust the object to fit your specific needs using the corresponding horizontal toolbar
    tools for that object type (text, image, or line art). <p>The user may still modify frame
    attributes after having placed an object inside the frame. </p>
  </li>
</ol>

<p>Xclamation has multi-document capabilities. It's possible to open more than one
document at a time, for example, in order to make exchanges between documents. <br>
</p>

<p>Xclamation also offers a <a HREF="Box_Editor.html">text editor</a> to help perfect its
own texts and enhance imported ones. The editor can insert <a HREF="Keyboard.html#special_car">special characters</a> like accent marks or symbols using
various key-combinations. Il est également possible de rentrer des caractères spéciaux
grâce à la boîte de dialogue 'Table des caractères'. </p>

<p><br>
</p>

<h2>The Launch</h2>
<b>

<p>usage:</b> <tt>Xcl [-help] [-version] [-fg&nbsp;&lt;color&gt;] [-bg&nbsp;&lt;color&gt;]
[-display&nbsp;&lt;displayname&gt;] [-geometry&nbsp;&lt;geom&gt;] [-/+opaqueResize]
[-opaqueMove&nbsp;&lt;percentage&gt;] [-keepFreeColor&nbsp;&lt;number&gt;] [files ...] </tt></p>

<p><b>detail:</b> <tt><b>-help, --help, -h</b></tt><br>
displays a summary of command line parameters. </p>

<p><tt><b>-version, -v</b></tt><br>
displays Xclamation's version number. </p>

<p><tt><b>-fg color</b></tt><br>
defines foreground color. </p>

<p><tt><b>-bg color</b></tt><br>
defines background color. </p>

<p><tt><b>-display host:dpy</b></tt><br>
specifies X server to be used. </p>

<p><tt><b>-geometry geom</b></tt><br>
determines size of main window. </p>

<p><tt><b>-opaqueResize</b></tt><br>
annuls opaque mode's re-sizing of the internal <a HREF="Document_Window.html">window
manager</a>. </p>

<p><tt><b>+opaqueResize</b></tt><br>
activates opaque mode's re-sizing of the internal <a HREF="Document_Window.html">window
manager</a>. </p>

<p><tt><b>-opaqueMove percentage</b></tt><br>
Sets the percentage of <a HREF="Main_Interface.html#worktop">desktop area</a> in which the
document window must fit in opaque mode. </p>

<p><tt><b>-keepFreeColor number</b></tt><br>
Sets number of colors to be available for use in other X applications. For a palette of
256 colors this value is 10 by default. This option may only be useful when your X server
works with Pseudo-color. </p>

<p><tt><b>--xbugline, -xbugline, -xbl</b></tt><br>
Correct a bug with some video driver. You'll have to use this parameter only
if lines in vector based drawings are misplaced.
</p>

<p><tt><b>--xbugpoint, -xbugpoint, -xbp</b></tt><br>
Correct a bug with some video driver. You'll have to use this parameter only
if screen fonts are not displayed fine.
</p>
