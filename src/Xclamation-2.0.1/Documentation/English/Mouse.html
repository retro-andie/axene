<p><br>
<br>
</p>

<p>A mouse or any similar point placement tool is absolutely necessary to fully utilize
Xclamation. The norm on X terminals and Unix workstations is a mouse with three buttons.
However, some Unix systems or X servers running on PC compatibles more frequently use a
mouse with two buttons. Macintosh, for the most part, uses a mouse with only one button. </p>

<p>Xclamation uses the three buttons to manipulate different functions; however, the
middle and right buttons are only used to shortcut other manipulations. These buttons are
therefore not indispensable; full utilization of the application can be achieved with a
single mouse button. </p>

<p><br>
</p>

<h3>Using the three buttons in Xclamation:</h3>

<ol>
  <li>The <b>left button</b> is used to execute all point placement operations, selection from
    lists, selection of a button or an icon, and drag and drop functions. It is possible to
    fully utilize Xclamation using only this button. The only two keys which might be used in
    conjunction with the left mouse button are: <br>
    &nbsp; <ul>
      <li>the <i>Shift</i> key at the time of frame creation and manipulation is used to <a
        HREF="HBar_Frame.html#rectangle_icon">create a square</a> or <a
        HREF="HBar_Frame.html#ellipse_icon">circular frame</a>, to <a
        HREF="Frame_Selection_Modes.html#select_frame">select multiple frames</a>, and to <a
        HREF="Frame_Selection_Modes.html#dup_frame">copy a frame</a>. <br>
        &nbsp;</li>
      <li>The <i>Ctrl</i> key in certain dialog boxes listing elements. Using this key
        simultaneously with the left mouse button allows the user to select several elements from
        a list. <br>
      </li>
    </ul>
    <p>A <b>double click with the left mouse button</b> is used in the following situations: <ul>
      <li>double-clicking on a frame opens the '<a HREF="Box_Frame_Attributes.html">Frame
        Attributes</a>' dialog box. <br>
        &nbsp;</li>
      <li>double-clicking on a filename in a <a HREF="Box_File_Selectors.html#file_list">file
        selector</a>. <br>
        &nbsp;</li>
      <li>double-clicking in a text field selects an entire word. Triple clicking selects the
        entire line of text. <br>
        &nbsp;</li>
    </ul>
  </li>
  <li>The <b>right button</b> is used in the following cases: <br>
    &nbsp; <ul>
      <li>to return to <a HREF="Frame_Selection_Modes.html">frame selection mode</a>. When
        Xclamation is in <a HREF="HBar_Frame.html#rectangle_icon">frame creation</a>, <a
        HREF="HBar_Frame.html#rotation_icon">rotation</a>, <a HREF="HBar_Frame.html#scaling_icon">scale</a>,
        <a HREF="HBar_Text.html#link_end_icon">text sequencing</a> mode or <a
        HREF="HBar_Zoom.html#zoom_area_icon">new zoom</a> choice... </li>
      <li>pour abandonner une opération en cours. Dans les modes d'action cités ci-dessus, il
        faut souvent désigner un emplacement source et un emplacement destination grâce au
        bouton gauche de la souris. Après avoir désigné l'emplacement source, il est possible
        de cliquer sur le bouton droit afin d'annuler l'opération. </li>
      <li>to open <a HREF="Menu_Context.html">contextual menu. <br>
        &nbsp;</li>
    </ul>
  </li>
  <li>The <b>center mouse button</b> is rarely used. However, it may be useful in the
    following situations: <br>
    &nbsp; <ul>
      <li>to shift from </a><a HREF="Frame_Selection_Modes.html#handles_mode">frame selection
        handle mode</a> to <a HREF="Frame_Selection_Modes.html#vertices_mode">peaked mode</a> and
        vice versa. <br>
        &nbsp;</li>
      <li>to reset the origin on <a HREF="Rulers.html">rulers</a>. <br>
        &nbsp;</li>
      <li>to perform a paste command in a text field in order to insert a piece of copied text
        from an xterm or any other X11 application using memory stamps. In the text editor the
        user chooses the memory stamp to be pasted by simultaneously pressing the <i>shift</i> key
        and the center mouse button. <br>
        &nbsp;</li>
    </ul>
  </li>
</ol>

<p>To know what operation mode Xclamation is in the user must observe the shape of the
mouse cursor. Each operation mode corresponds to a specific type of mouse cursor. <br>
<br>
</p>
