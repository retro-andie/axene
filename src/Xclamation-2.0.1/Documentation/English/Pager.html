<p><br>
<br>
The page manager displays a symbol of each document page, giving direct access to all
pages. In addition it give access to the page manager <a HREF="Menu_Context.html#cm_pager">contextual
menu</a>. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Pager.gif" ALT="Picture: Page manager." WIDTH="342" HEIGHT="13"> <br>
<small><i>Screen shot: Page manager </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Left Side of the Page Manager:</h3>

<ul>
  <li><img SRC="Icons/Pager_beginning.gif" WIDTH="16" HEIGHT="13"> The first button <b>selects the first page</b> of
    the document. <br>&nbsp;</li>
  <li><img SRC="Icons/Pager_before.gif" WIDTH="15" HEIGHT="13"> The second button <b>selects the page preceding</b>
    the one currently displayed. If the right side of the page manager cannot accommodate all
    the pages, press and hold on this icon to shift pages towards the right, making preceding
    pages accessible. <br>&nbsp;</li>
  <li>The informational text &quot;Page:X&quot; (or &quot;Page:X-X+1 in the case of a doubled
    page)&quot; where X is a page number, <b>displays the current page number</b>. Moving the
    mouse's pointer over the right side of the page manager causes the page number to appear
    in white. <br>&nbsp;</li>
  <li><img SRC="Icons/Pager_after.gif" WIDTH="15" HEIGHT="13"> The third button <b>selects the page succeeding</b>
    the current page. If the right side of the page manager cannot accommodate all the pages,
    press and hold on this icon to shift the pages towards the left, making succeeding pages
    accessible. <br>&nbsp;</li>
  <li><img SRC="Icons/Pager_end.gif" WIDTH="16" HEIGHT="13"> The last button <b>selects the
    last page</b> of the document. <br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Right side of the Page Manager:</h3>

<p>The right side contains a <b>symbol for each page of the active document</b>. Each
icon's form varies according to the function and style of the page it represents: left
page, right page, or doubled page, in combination with an orientation of either portrait
or landscape style. </p>

<p>Clicking on the left mouse button while over one of the icons selects the corresponding
page and displays it on the screen; its page number then appears in the informational text
on the left side of the bar. </p>

<p>Clicking the right mouse button opens a <a HREF="Menu_Context.html#cm_pager">contextual
menu</a> allowing you to add, delete, or modify a page. </p>

<p><br>
</p>
