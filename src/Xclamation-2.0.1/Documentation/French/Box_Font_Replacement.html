<title>Remplacement de polices</title>
</head>

<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleDialogBox.gif" ALT="Boîte de dialogue" WIDTH="133" HEIGHT="27"> <img ALIGN="middle" SRC="Images/TitleBoxFontReplace.gif" ALT="Remplacement de polices" WIDTH="272" HEIGHT="39"> </p>

<p><br>
<br>
La boîte de remplacement de police peut apparaître lors du <a HREF="Menu_File.html#open_menu_entry">chargement d'un document</a> Xclamation, de l'<a HREF="Menu_File.html#import_text_menu_entry">importation d'un texte enrichi</a> au format
Xclamation ou de l'<a HREF="Menu_File.html#import_vector_menu_entry">importation d'un
dessin vectoriel</a>. Chacun de ces trois types de fichiers peut nécessiter l'utilisation
d'une police de caractères spécifiques. Si l'une de ces polices n'a pas d'équivalent
dans Xclamation, cette boîte s'ouvrira pour demander d'établir une substitution entre la
police utilisée dans le document et les polices réellement disponibles. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_Font_Replace.gif" ALT="Image&nbsp;: boîte de 
remplacement de polices" WIDTH="214" HEIGHT="263"> <br>
<small><i>Photo d'écran&nbsp;: Boîte de remplacement de polices </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Partie supérieure de la boîte de dialogue&nbsp;:</h3>

<ul>
  <li><a NAME="label">le label <i>&quot;Police Indisponible&quot;</i>. Ce label donne le <b>nom
    de la police à remplacer</b>, indiquée dans le fichier à lire et qui n'a pas trouvée
    d'équivalence dans les polices actuellement disponibles dans Xclamation. </a><br>
    &nbsp;</li>
  <li><a NAME="font_list">la <b>liste de polices disponibles</b> dans Xclamation. Il faut
    sélectionner un élément de la liste, celui-ci deviendra la substitution de la police
    sans équivalence. Par défaut, la police d'Xclamation, ayant le nom le plus proche de la
    police à remplacer, sera sélectionnée. </a><br>
    &nbsp;</li>
  <li><a NAME="keep_button">le bouton poussoir <i>&quot;Garder l'association&quot;</i> permet
    de conserver la substitution de la police du fichier par une police d'Xclamation, pour la
    suite de l'exécution. Ainsi, à chaque fois que la police indisponible sera rencontrée,
    la substitution avec la police d'Xclamation sera automatique. </a></li>
</ul>

<p><br>
</p>

<h3>Partie inférieure de la boîte de dialogue&nbsp;:</h3>

<ul>
  <li><a NAME="button_ok"><i>&quot;Ok&quot;</i> permet d'<b>accepter le remplacement de la
    police</b> non disponible par une police existante dans Xclamation et de continuer la
    chargement du fichier. </a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel"><i>&quot;Annuler&quot;</i> <b>annule la substitution de police</b>
    et le chargement du fichier. </a></li>
</ul>

<p><br>
</p>
