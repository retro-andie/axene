This <a HREF="Config.html">configuration file</a> section defines the default parameters
of the Image Cache. </p>

<h3>Image Cache Configuration section: <i>\CACHE_CONFIG{...}</i></h3>

<p>This section configures the disk space and memory space assigned to the Image Cache.
The configuration parameters are: 

<ol>
  <li><b>\MEMORY_CACHE_SIZEX</b> where <i>X</i> represents the amount of memory space in
    kilo-bytes assigned to the Image Cache. This value may be modified in the '<a HREF="Box_Image_Cache.html#max_memory_textfield">Image Cache Information</a>' dialog box. <br>
    &nbsp;</li>
  <li><b>\DISK_CACHE_SIZEX</b> where <i>X</i> represents the amount of disk space in
    kilo-bytes assigned to the Image Cache. This value may be modified in the '<a HREF="Box_Image_Cache.html#max_memory_textfield">Image Cache Information</a>' dialog box. <br>
    &nbsp;</li>
  <li><b>\KEEP_DISK_CACHE</b>. If this parameter is present, the Image Cache will be saved
    from one XMayday use to the next. This state can be modified from the '<a HREF="Box_Image_Cache.html#max_memory_textfield">Image Cache Information</a>' dialog box. <br>
    &nbsp;</li>
  <li><b>\CACHE_DIR{path}</b> where &quot;path&quot; is the absolute pathway of files assigned
    to the Image Cache. The user's &quot;home directory&quot; may be indicated by a
    &quot;~&quot;. <br>
    &nbsp;</li>
</ol>

<h3>Example:</h3>
<tt>

<p>\CACHE_CONFIG{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\MEMORY_CACHE_SIZE2000<br>
&nbsp;&nbsp;&nbsp;&nbsp;\DISK_CACHE_SIZE5000<br>
&nbsp;&nbsp;&nbsp;&nbsp;\KEEP_DISK_CACHE<br>
&nbsp;&nbsp;&nbsp;&nbsp;\CACHE_DIR{/tmp/.xmayday-cache}<br>
} </tt></p>
