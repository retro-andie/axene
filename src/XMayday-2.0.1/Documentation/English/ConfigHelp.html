This <a HREF="Config.html">configuration file</a> section configures the paths and
applications used to call up help. </p>

<h3>On-line Help Configuration Section: <i>\HELP_CONFIG{...}</i></h3>

<p>This section defines XMayday's on-line help configuration. The help definition begins
after the opening bracket <i>&quot;{&quot;</i> and before the corresponding closing
bracket <i>&quot;}&quot;</i>. The configuration parameters are: 

<ul>
  <li><b>\BASE_LOCATION{path}</b> where <i>path</i> represents the help-file pathway. </li>
</ul>

<h3>Example:</h3>
<tt>

<p>\HELP_CONFIG{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\BASE_LOCATION{<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$XMAYDAY_LIB/doc/XMayday/English<br>
&nbsp;&nbsp;&nbsp;&nbsp;}<br>
} </tt></p>
