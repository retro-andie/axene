<title>Utilisation de l'aide</title>

<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p>
<br>
<br>
<p>
Pour accéder à l'aide en ligne, il existe
plusieurs moyens&nbsp;:
<ul>
  <li>à partir du <a HREF="Menu_Bar.html#help">menu Aide</a>,
     cliquer sur les entrées 
     <a HREF="Menu_Bar.html#overview_menu_entry"><i>&quot;Aide Générale...&quot;</i></a>,
     <a HREF="Menu_Bar.html#table_of_contents_menu_entry"><i>&quot;Table des Matières...&quot;</i></a>,
     <a HREF="Menu_Bar.html#keyboard_menu_entry"><i>&quot;Clavier...&quot;</i></a>
     ou <a HREF="Menu_Bar.html#using_help_menu_entry"><i>&quot;Utiliser de l'aide...&quot;</i></a>.
     <p>
  <li>dans les boîtes de dialogue principales, un bouton icône
     permet d'accéder à l'aide de ces boîtes.
  <li>à partir de l'entrée 
     <a HREF="Menu_Bar.html#help_on_item_menu_entry"><i>&quot;Aide sur Item...&quot;</i></a>
     du <a HREF="Menu_Bar.html#help">menu Aide</a>. 
     Le curseur souris se transforme en point d'interrogation.
     Il suffit alors de cliquer sur une composante de l'interface
     d'XMayday pour obtenir une aide spécifique associée.
     Par exemple, pour comprendre à quoi sert un bouton icône
     de la barre horizontale d'icônes affichée, il suffit
     de choisir &quot;Aide / Aide sur Item....&quot; puis de cliquer
     sur ce bouton icône. <br> 
     Pour activer cette forme d'aide, il
     est également possible de presser simultanément
     les touches <tt>Ctrl</tt> et <tt>F1</tt>. Dans les boîtes de
     dialogues (où le menu Aide n'est pas accessible) ce 
     raccourci clavier est le seul moyen d'obtenir l'aide sur item.
     <p>
  <li>en sélectionnant un élément d'interface
     et en pressant la touche <tt>F1</tt>. Un élément
     d'interface est sélectionné lorsqu'il est entouré
     d'un fin trait noir. 
     <p>
     La méthode de 'l'aide sur item' est plus commode et efficace.
     <p>
</ul>
