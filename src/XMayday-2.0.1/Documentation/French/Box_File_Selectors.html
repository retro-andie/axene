<p><br>
<br>
Un sélecteur de fichier permet de choisir le fichier qui servira pour une lecture ou une
écriture d'information. Tous les sélecteurs de fichier fonctionnent de façon identique.
<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_FileSelectors.gif" ALT="Image&nbsp;: sélecteur de fichier type" WIDTH="223" HEIGHT="272"> <br>
<small><i>Photo d'écran&nbsp;: Sélecteur de fichier type. </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>
<a NAME="file_selector">

<h3>Eléments communs aux sélecteurs de fichier&nbsp;:</h3>
</a>

<ul>
  <li><a NAME="title_label">un <b>titre</b> indique le nom du sélecteur. </a><br>
    &nbsp;</li>
  <li><a NAME="sub_directories_list">une liste déroulante permet de remonter rapidement dans
    un répertoire ancêtre du répertoire actuel. Elle contient tous les sous-répertoires de
    l'<b>arborescence directe</b> du répertoire actuel jusqu'à la racine de l'arborescence. </a><br>
    &nbsp;</li>
  <li><a NAME="file_list">la liste suivante montre tous les <b>sous-répertoires et fichiers
    contenus dans le répertoire actuel</b>. Les noms de répertoires, classés par ordre
    alphabétique, apparaissent au début de la liste avec le caractère &quot;/&quot; à la
    fin de chaque nom. Les noms de fichiers concordant avec un éventuel filtre sont affichés
    à la suite. Double-cliquer sur un nom de répertoire permet de &quot;descendre&quot; dans
    celui-ci&nbsp;: le nom du répertoire actuel se rajoute à la liste déroulante, le
    répertoire sélectionné devient le nouveau répertoire actuel et son contenu est
    affiché dans cette liste. Un simple click sur un nom de fichier fait apparaître ce nom
    dans le champ texte juste en dessous. Double-cliquer sur un nom de fichier permet de le
    sélectionner sans autre confirmation. </a><br>
    &nbsp;</li>
  <li><a NAME="file_name_textfield">le champ texte indique le <b>nom du fichier</b>
    sélectionné dans la liste et permet d'entrer un nouveau nom. Il est possible d'entrer un
    nom de fichier complet avec le chemin. Si on entre et valide &quot;~&quot;, la racine de
    votre compte deviendra le nouveau répertoire courant ; si on entre et valide un nom de
    répertoire suivi du caractère &quot;/&quot;, le répertoire actuel pointera sur la
    nouvelle destination. Dans certains sélecteurs de fichier, une extension est ajoutée
    automatiquement au nom du fichier quand on le valide. </a><br>
    &nbsp;</li>
  <li><a NAME="left_button">le bouton de gauche de la partie inférieure d'un sélecteur de
    fichier permet d'<b>accepter le nom de fichier</b> pour l'action indiquée sur le bouton
    et ferme la boîte. </a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel">le bouton de droite <i>&quot;Annuler&quot;</i> permet de ne pas
    donner suite à l'action et <b>ferme la boîte</b>. </a></li>
</ul>

<p><br>
</p>

<hr>
<a NAME="fs_open_index">

<h3>Ouverture d'un index&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Ouverture d'un index&quot;</i> permet de choisir le
fichier contenant la page html d'index. Pour une bonne utilisation d'XMayday, cette page
html doit contenir l'index ou la table des matières d'une documentation, avec des liens
hypertextes sur les autres pages de la documentation. Seuls les fichiers ayant l'extension
<tt>&quot;.html&quot;</tt>, <tt>&quot;.htm&quot;</tt>, <tt>&quot;.HTML&quot;</tt> et <tt>&quot;.HTM&quot;</tt>
apparaîtront dans la liste des fichiers. Pour le détail de l'utilisation de ce
sélecteur de fichier, voir le mode d'emploi d'un </a><a HREF="Box_File_Selectors.html#file_selector">sélecteur de fichier standard</a>. </p>

<p><br>
</p>

<hr>
<a NAME="fs_open_file">

<h3>Ouverture d'un fichier&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Ouverture d'un fichier&quot;</i> permet de choisir le
fichier contenant la page html de navigation. La page choisie grâce à ce sélecteur de
fichier apparaîtra dans la section navigation de l'interface générale. Seuls les
fichiers ayant l'extension <tt>&quot;.html&quot;</tt>, <tt>&quot;.htm&quot;</tt>, <tt>&quot;.HTML&quot;</tt>
et <tt>&quot;.HTM&quot;</tt> apparaîtront dans la liste des fichiers. Pour le détail de
l'utilisation de ce sélecteur de fichier, voir le mode d'emploi d'un </a><a HREF="Box_File_Selectors.html#file_selector">sélecteur de fichier standard</a>. </p>

<p><br>
</p>

<hr>
<a NAME="fs_print_in_file">

<h3>Impression dans le fichier...&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Impression dans le fichier...&quot;</i> permet de
choisir le nom du fichier dans lequel les données de l'impression de la page html de
navigation seront sauvées. Ce sélecteur est appelé à partir de la boîte de dialogue '</a><a HREF="Box_Print.html">impression</a>', lorsque l'on choisi <i>&quot;Fichier&quot;</i>
comme imprimante. L'extension <tt>&quot;.ps&quot;</tt> est ajoutée automatiquement au nom
de fichier si le format d'impression est <i>&quot;PostScript&quot;</i> et l'extension <tt>&quot;.txt&quot;</tt>
pour les autres formats. Pour le détail de l'utilisation de ce sélecteur de fichier,
voir le mode d'emploi d'un <a HREF="Box_File_Selectors.html#file_selector">sélecteur de
fichier standard</a>. </p>
