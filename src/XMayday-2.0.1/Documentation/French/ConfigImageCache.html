Cette section des <a HREF="Config.html">fichiers de configuration</a> 
permet de définir les paramètres par défaut 
du cache images.
<h3>Section de configuration du cache images&nbsp;: <i>\CACHE_CONFIG{...}</i></h3>
Cette section permet de configurer l'espace disque et l'espace
mémoire attribués au cache images.
Les paramètres de configuration sont&nbsp;:
<ol>
  <li><b>\MEMORY_CACHE_SIZEX</b> où <i>X</i> représente 
     la taille de l'espace mémoire en 
     kilo-octets attribué au cache images. Cette valeur peut 
     être modifiée dans la boîte de dialogue 
     '<a HREF="Box_Image_Cache.html#max_memory_textfield">Informations Cache Images</a>'
     <p>
  <li><b>\DISK_CACHE_SIZEX</b> où <i>X</i> représente 
     la taille de l'espace disque en kilo-octets 
     attribué au cache images. Cette valeur peut 
     être modifiée dans la boîte de dialogue 
     '<a HREF="Box_Image_Cache.html#max_disk_textfield">Informations Cache Images</a>'
     <p>
  <li><b>\KEEP_DISK_CACHE</b>. Si ce paramètre est présent,
     le cache images sera sauvegardé d'une utilisation d'XMayday 
     sur l'autre. Cet état peut être modifié dans la
     boîte de dialogue 
     '<a HREF="Box_Image_Cache.html#save_cache_button">Informations Cache Images</a>'
     <p>
  <li><b>\CACHE_DIR{chemin}</b> où <i>chemin</i> est le chemin 
     absolu des fichiers associés au cache images. Le &quot;Home directory&quot;
     de l'utilisateur peut être représenté par un &quot;~&quot;.
     <p>
</ol>
<h3>Exemple&nbsp;:</h3> 
<tt>  
\CACHE_CONFIG{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\MEMORY_CACHE_SIZE2000<br>
&nbsp;&nbsp;&nbsp;&nbsp;\DISK_CACHE_SIZE5000<br> 
&nbsp;&nbsp;&nbsp;&nbsp;\KEEP_DISK_CACHE<br>
&nbsp;&nbsp;&nbsp;&nbsp;\CACHE_DIR{/tmp/.xmayday-cache}<br>
}
</tt>
