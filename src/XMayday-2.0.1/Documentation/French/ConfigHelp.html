Cette section des <a HREF="Config.html">fichiers de configuration</a> 
permet de configurer les chemins et logiciels utilisés dans
l'appel à l'aide.

<h3>Section de configuration de l'aide en ligne&nbsp;: <i>\HELP_CONFIG{...}</i></h3>
Cette section permet de définir la configuration
de l'aide en ligne d'XMayday.
La définition de l'aide s'effectue 
après l'accolade ouvrante <i>&quot;{&quot;</i> et avant 
l'accolade fermante correspondante <i>&quot;}&quot;</i>. 
Les paramètres de configuration sont&nbsp;:
<ul>
  <li><b>\BASE_LOCATION{chemin}</b> où <i>chemin</i> représente 
     le chemin des fichiers d'aide. 
     <p>
</ul>
<h3>Exemple&nbsp;:</h3> 
<tt>
\HELP_CONFIG{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\BASE_LOCATION{<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$XMAYDAY_LIB/doc/XMayday/French<br>
&nbsp;&nbsp;&nbsp;&nbsp;}<br>
}
</tt>
