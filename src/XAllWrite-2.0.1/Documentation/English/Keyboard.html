<a NAME="special_car">

<h2>Special characters:</h2>

<p>You can type a special character by entering its ASCII code. For example '©' equal 169
in décimal, xA9 in hexadécimal and 0251 in octal. You can enter: 

<ul>
  <li><i>&quot;Alt+Espace then 169&quot;</i> (to enter a decimal value, type only the value) </li>
  <li><i>&quot;Alt+Espace then xa9&quot;</i> (to enter a hexadecimal value, type <i>&quot;x&quot;</i>
    before) </li>
  <li><i>&quot;Alt+Espace then 0251&quot;</i> (to enter an octal value, type <i>&quot;0&quot;</i>
    before)</li>
</ul>
