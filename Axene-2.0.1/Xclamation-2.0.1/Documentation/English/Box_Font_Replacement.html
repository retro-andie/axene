<title>Font Replacement</title>

<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleDialogBox.gif" ALT="Dialog box" WIDTH="89" HEIGHT="29"> <img ALIGN="middle" SRC="Images/TitleBoxFontReplace.gif" ALT="Font Replacement" WIDTH="197" HEIGHT="34"> </p>

<p><br>
<br>
The font replacement dialog box may appear when <a HREF="Menu_File.html#open_menu_entry">loading
an Xclamation document</a>, <a HREF="Menu_File.html#import_text_menu_entry">importing an
enriched text</a> in Xclamation format, or <a HREF="Menu_File.html#import_vector_menu_entry">importing a line art</a>. In each of these
three types of files, a specific character or font may be called for. If one of these
fonts has no equivalent in Xclamation, this box opens in order to establish an equivalent
replacement. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_Font_Replace.gif" ALT="Picture: font replacement dialog box" WIDTH="221" HEIGHT="272"> <br>
<small><i>Screen shot: Font replacement dialog box </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Upper portion of the dialog box:</h3>

<ul>
  <li><a NAME="label">The <i>&quot;Unavailable Font&quot;</i> label. This label <b>displays
    the name of the font to be replaced</b> from the file being read, indicating that
    Xclamation was unable to find an equivalent font currently available. </a><br>&nbsp;</li>
  <li><a NAME="font_list">The Xclamation <b>Available Fonts list</b>. A font selected from
    this list will become the substitute for the unavailable font. By default, the Xclamation
    font will be selected because its name is nearest to the font to be replaced. </a><br>&nbsp;</li>
  <li><a NAME="keep_button">The <i>&quot;Keep Replacement&quot;</i> button <b>conserves the
    substitution</b> of the unavailable font by an Xclamation font for the duration of the
    execution. Each time the unavailable font is encountered, Xclamation will automatically
    replace it with its own font. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Lower portion of the dialog box:</h3>

<ul>
  <li><a NAME="button_ok"><i>&quot;Ok&quot;</i> <b>accepts the substitution</b> of unavailable
    fonts for existing fonts in Xclamation and continues loading the file. </a><br>&nbsp;</li>
  <li><a NAME="button_cancel"><i>&quot;Cancel&quot;</i> <b>cancels the font substitution</b>
    and stops loading the file. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>
