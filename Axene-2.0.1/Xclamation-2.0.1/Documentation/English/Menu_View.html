<p><br>
<br>
The View menu accesses commands to alter various aspects of the display interface. </p>

<p>Many commands on this menu are part of a pair. These commands vary according to
context; for example, if the status bar were displayed, an entry on this menu would be <i>&quot;hide
status bar&quot;</i>, but if the bar were not displayed, the command would read <i>&quot;display
status bar&quot;</i>. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Menu_View.gif" ALT="Picture: View Menu" WIDTH="234" HEIGHT="311"> <br>

<h3>The View menu contains the following options:</h3>

<ul>
  <li><a NAME="redraw_all_menu_entry"><i>&quot;Redraw all&quot;</i> <b>tidies the display
    screen</b> of the active document. This command corrects display errors; use it first
    whenever something appears wrong with the display. </a><br>&nbsp;</li>
  <li><a NAME="real_size_menu_entry"><i>&quot;Actual Size&quot;</i> <b>change the zoom factor
    to level one</b>, the size of the printed version. This command is also accessible using
    the </a><a HREF="HBar_Zoom.html#real_scale_icon">fourth button</a> of the second section
    of the horizontal 'Zoom' toolbar. <br>&nbsp;</li>
  <li><a NAME="full_page_menu_entry"><i>&quot;Entire Page&quot;</i> <b>changes the zoom factor
    in order to view the entire page</b> on the display screen of the active document. This
    command is also accessible from the </a><a HREF="HBar_Zoom.html#full_page_icon">third
    button</a> of the second section of the horizontal 'Zoom' toolbar. <br>&nbsp;</li>
  <li><a NAME="full_width_menu_entry"><i>&quot;Full Width&quot;</i> <b>changes the zoom factor
    in order to view the entire width of the page</b> on the display screen of the active
    document. This command is also accessible from the </a><a HREF="HBar_Zoom.html#full_width_icon">second button</a> of the second section of the
    horizontal 'Zoom' toolbar. <br>&nbsp;</li>
  <li><a NAME="grid_menu_entry"><i>&quot;Display/hide guide grid&quot;</i> <b>displays or
    hides the snap-to guides</b> on the display screen. The grid sections off the display
    screen using horizontal and vertical magnetic red lines. </a><br>&nbsp;</li>
  <li><a NAME="margin_menu_entry"><i>&quot;Display/ hide margins and sections&quot;</i> <b>displays
    or hides the snap-to margin and section lines</b>. These blue magnetic lines are created
    upon opening a document and are defined in the '</a><a HREF="Box_New_Document.html#margins_frame">new document</a>' dialog box. The positioning
    of these lines can be modified from the '<a HREF="Box_Modify_Page.html#margins_frame">page
    modification</a>' dialog box. <br>&nbsp;</li>
  <li><a NAME="ruler_marks_menu_entry"><i>&quot;Display/ hide ruler lines&quot;</i> <b>displays
    or hides snap-to ruler lines</b>. These green lines are retrieved under the rulers on the
    display screen of the active document. </a><br>&nbsp;</li>
  <li><a NAME="frame_border_menu_entry"><i>&quot;Display/ hide borders&quot;</i> <b>displays
    or hides the illusion of frame borders</b>. When creating transparent frames without
    borders which are then superimposed over other frames, viewing borders facilitates view of
    the foremost frame's shape. However, if you desire a display that closely resembles its
    printed appearance, borders should not be shown. </a><br>&nbsp;</li>
  <li><a NAME="rulers_menu_entry"><i>&quot;Display/hide rulers&quot;</i> <b>displays or hides
    the rulers</b> on the active document. This is used only when no rulers are needed and the
    largest possible display space is desired. </a><br>&nbsp;</li>
  <li><a NAME="clipboard_menu_entry"><i>&quot;Display/hide clipboard&quot;</i> <b>displays or
    hides the clipboard</b>. The clipboard symbolically represents its contents. Displaying
    the clipboard significantly reduces the amount of workspace on the desktop. </a><br>&nbsp;</li>
  <li><a NAME="hint_line_menu_entry"><i>&quot;Display/hide status bar&quot;</i> <b>displays or
    hides the status bar</b>. The status bar gives basic information on commands used and on
    functions of menubar buttons. </a><br>&nbsp;</li>
  <li><a NAME="magnet_menu_entry"><i>&quot;Activate/Stop magnetism&quot;</i> <b>activates or
    stops the magnetic action of lines</b>. Grid-lines, as well as margin, section, and ruler
    lines are all potential snap-to lines. The magnetism is used in positioning frames or
    points on the display screen by &quot;pulling&quot; the mouse/cursor toward the lines.
    Magnetism helps to place points precisely and/or to align frames perfectly. </a><br>&nbsp;</li>
</ul>
