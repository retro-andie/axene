<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleHBar.gif" ALT="Horizontal Toolbar" WIDTH="146" HEIGHT="23"> <img ALIGN="middle" SRC="Images/TitleHBarVector.gif" ALT="Line Art Treatment" WIDTH="224" HEIGHT="29"> </p>

<p><br>
<br>
The 'line art' toolbar provides tools used to modify the appearance of a line art in its
frame. In order to access this toolbar, a single frame containing a line art must be
selected in the display screen of the active document. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/HBar_Vector.gif" ALT="Image&nbsp;: Barre d'icônes Dessin Vectoriel." WIDTH="480" HEIGHT="59"> <br>
<small><i>Screen shot: Line Art Toolbar </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>First Section of the Toolbar:</h3>

<ul>
  <li><img SRC="icons/HBarV_Move.gif" WIDTH="30" HEIGHT="30"> <a NAME="move_icon">The first button <strong>move the
    line-art</strong> in its frame. The user must click once to pick up the line-art,
    re-position it, then click again to set it down. During re-positioning it is possible to
    cancel the action by clicking on the right mouse button. Once the line-art is set,
    clicking on the right mouse button shifts Xclamation back to selection mode.</a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarV_Center.gif" WIDTH="30" HEIGHT="30"> <a NAME="center_icon">The second button <b>re-centers
    the line art</b> in its frame so that the center of the line art corresponds to the center
    of the frame. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarV_Reset.gif" WIDTH="30" HEIGHT="30"> <a NAME="reset_icon">The third button <b>restore the
    line art</b>, that is to say re-centers the drawing within its frame and returns it to its
    original size. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Second Section of the Toolbar:</h3>

<ul>
  <li><img SRC="Icons/HBarI_FlipH.gif" WIDTH="30" HEIGHT="30"> <a NAME="fliph_icon">The first button <b>inverses the
    line art vertically</b> in its frame; the mirror effect creates a symmetry with respect to
    the horizontal axis passing through the center of the line art. If the frame has undergone
    a rotation the symmetry is created with respect to the horizontal axis as affected by the
    angle of frame rotation. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarI_FlipV.gif" WIDTH="30" HEIGHT="30"> <a NAME="flipv_icon">The second button <b>inverses the
    line art horizontally</b> in its frame; the mirror effect creates a symmetry with respect
    to the vertical axis passing through the center of the line art. If the frame has
    undergone a rotation, the symmetry is created with respect to the vertical axis as
    affected by the angle of frame rotation. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Third Section of the Toolbar:</h3>

<ul>
  <li><img SRC="Icons/HBarI_Min_Aspect.gif" WIDTH="30" HEIGHT="30"> <a NAME="min_aspect_icon">The first button <b>displays
    the entire line art in its frame without changing its shape</b>. The enlargement factor of
    the drawing adjusts itself so that it remains entirely visible within the virtual
    rectangle circumscribing the frame. This button works as a display mode; if the shape of
    the frame is changed the line art will automatically adjust itself to the new size. To
    discontinue this display mode, choose one of the two other modes or de-activate this
    button. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarI_Max_Aspect.gif" WIDTH="30" HEIGHT="30"> <a NAME="max_aspect_icon">The second button <b>fills
    the entire frame with the line art without alteration</b>. The enlargement factor adjusts
    itself so that the frame is entirely filled with the line art, without alteration to the
    drawing itself. This button works as a display mode; if the shape of the frame changes the
    drawing will automatically adjust itself to the new frame dimensions. To discontinue this
    display mode choose one of the two other display modes or de-activate this button. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarI_Best_Aspect.gif" WIDTH="30" HEIGHT="30"> <a NAME="best_aspect_icon">The third button <b>displays
    the entire line art while filling the entire frame</b>. The enlargement factor adjusts
    itself both horizontally and vertically, independent of one another, so that the
    dimensions of the virtual rectangle circumscribing the frame are equal to those of the
    line art, thus altering the drawing. This button works as a display mode; if the shape of
    the frame changes the line art will automatically adjust itself to the new frame
    dimensions. To discontinue this display mode choose one of the two other modes or
    deactivate this button. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Fourth Section of the Toolbar:</h3>

<ul>
  <li><img SRC="Icons/HBarV_Font_Toggle.gif" WIDTH="30" HEIGHT="30"> <a NAME="font_toggle_icon">This button allows
    the user to choose whether to <b>display text with the line art</b>. If this mode is not
    activated texts are not displayed and PostScript fonts, which significantly slow the
    average display time, are not calculated. </a><br>&nbsp;</li>
</ul>
