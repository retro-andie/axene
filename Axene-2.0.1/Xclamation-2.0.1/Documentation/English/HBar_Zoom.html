<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleHBar.gif" ALT="Horizontal Toolbar" WIDTH="146" HEIGHT="23"> <img ALIGN="middle" SRC="Images/TitleHBarZoom.gif" ALT="Zoom Adjust" WIDTH="154" HEIGHT="40"> </p>

<p><br>
<br>
The 'zoom' toolbar provides tools to modify the enlargement factor of the view on the
display screen of the active document. This enlargement factor is saved for each page of
each document. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/HBar_Zoom.gif" ALT="Picture: Zoom ToolBar" WIDTH="480" HEIGHT="59"> <br>
<small><i>Screen shot: Zoom Toolbar </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>First section of the Toolbar:</h3>

<ul>
  <li><img SRC="Icons/HBarZ_Zoom_Plus.gif" WIDTH="30" HEIGHT="30"> <a NAME="zoom_plus_icon">The first button <b>centers
    in on a precise point and augments the zoom by 25%</b>. Click on the left mouse button at
    the spot where you would like to center the enlargement. Click on the right mouse button
    to quickly return to frame selection mode. Zoom factor is limited to a maximum of 400%.
    Once the limit is reached this button is rendered ineffective. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarZ_Zoom_Minus.gif" WIDTH="30" HEIGHT="30"> <a NAME="zoom_minus_icon">The second button <b>centers
    in on a precise point and reduces the zoom factor by 25%</b>. Click on the left mouse
    button at the spot where you would like to center the reduction. Click on the right mouse
    button to quickly return to frame selection mode. Zoom factor is limited to a minimum of
    10%. Once the limit is reached this button is rendered ineffective. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Second Section of the Toolbar:</h3>

<ul>
  <li><img SRC="Icons/HBarZ_Zoom_Area.gif" WIDTH="30" HEIGHT="30"> <a NAME="zoom_area_icon">The first button <b>enlarges
    a zone on the display screen</b>. Stretch a rectangle on the display screen to define the
    zone; the shape of the rectangle being pulled remains in proportion to the dimensions of
    the display screen. Before placing the source point or while stretching the rectangular
    zone it is possible to cancel the zoom adjustment by clicking on the right mouse button.
    The zoom factor is limited to a maximum of 400%. Once the limit is reached this button is
    rendered ineffective. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarZ_Full_Width.gif" WIDTH="30" HEIGHT="30"> <a NAME="full_width_icon">The second button
    calculates the enlargement factor so that <b>the width of the page is entirely visible on
    the display screen</b>. The page will be horizontally centered on the screen. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarZ_Full_Page.gif" WIDTH="30" HEIGHT="30"> <a NAME="full_page_icon">The third button
    calculates the enlargement factor so that <b>the entire page is visible on the display
    screen</b>. The page will be horizontally and vertically centered on the screen. </a><br>&nbsp;</li>
  <li><img SRC="Icons/HBarZ_Real_Scale.gif" WIDTH="30" HEIGHT="30"> <a NAME="real_scale_icon">The last button
    calculates the enlargement factor so that the page appears in its <b>original size</b>.
    The page will be horizontally and vertically centered on the display screen. Warning!
    Xclamation bases its calculations on information delivered by X server. If this
    information is erroneous, the calculation will be incorrect and the page will not appear
    in its true original dimensions. To verify information given by X server about the size of
    the screen try the command: &quot;<tt>$&gt;xdpyinfo&nbsp;|&nbsp;grep&nbsp;dimensions</tt>&quot;.
    </a><br>&nbsp;</li>
</ul>

<p><br>
</p>

<h3>Third Section of the toolbar:</h3>

<ul>
  <li><img SRC="Icons/HBarZ_Predefined.gif" WIDTH="192" HEIGHT="30"> <a NAME="predefined_scale_icons">These six
    buttons start the enlargement factor at 25%, 50%, 75%, 100%, 200%, and 400% respectively. </a><br>&nbsp;</li>
</ul>

<p><br>
</p>
