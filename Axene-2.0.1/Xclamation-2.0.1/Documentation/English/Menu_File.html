<h3>The file menu contains the following options:</h3>

<ul>
  <li><a NAME="new_menu_entry"><i>&quot;New...&quot;</i> <b>creates a new document</b>. It is
    followed by the '</a><a HREF="Box_New_Document.html">New Document</a>' dialog box. <br>
    &nbsp;</li>
  <li><a NAME="open_menu_entry"><i>&quot;Open...&quot;</i> <b>loads an Xclamation document</b>
    from a file. It is followed by the '</a><a HREF="Box_File_Selectors.html#fs_load">Open a
    Document</a>' file selector. <br>
    &nbsp;</li>
  <li><a NAME="close_menu_entry"><i>&quot;Close&quot;</i> <b>closes the active document</b>.
    If this document has been modified since last saving, a dialog box will open to propose
    saving it. </a><br>
    &nbsp;</li>
  <li><a NAME="save_menu_entry"><i>&quot;Save&quot;</i> <b>saves the active document</b> under
    its original name. If no name has been given to the document, the '</a><a
    HREF="Box_File_Selectors.html#fs_save">Save a Document</a>' file selector will open. <br>
    &nbsp;</li>
  <li><a NAME="save_as_menu_entry"><i>&quot;Save As...&quot;</i> <b>saves the active document
    under a name other than its original</b>. It is followed by the '</a><a
    HREF="Box_File_Selectors.html#fs_save">Save a Document</a>' file selector. <br>
    &nbsp;</li>
  <li><a NAME="save_all_menu_entry"><i>&quot;Save All&quot;</i> saves all the open documents
    which underwent modification since last saving. If a document already has a name, it will
    be saved under that name. If not, the '</a><a HREF="Box_File_Selectors.html#fs_save">Save
    Document as...</a>' file selector will open. <br>
    &nbsp;</li>
  <li><a NAME="import_menu_entry"><i>&quot;Import&quot;</i> opens to the following sub-menu: <p
    align="center"><img SRC="Images/Menu_File_Import.gif" ALT="Picture: Import sub-menu"
    WIDTH="249" HEIGHT="84"> </p>
    <ol>
      <li></a><a NAME="import_image_menu_entry"><i>&quot;Image...&quot;</i> <b>imports an image</b>
        to the selected frame or frames in the active document. It opens the '</a><a
        HREF="Box_File_Selectors.html#fs_import_image">Import Image</a>' file selector. <br>
        &nbsp;</li>
      <li><a NAME="import_text_menu_entry"><i>&quot;Text...&quot;</i> <b>imports text</b> to the
        selected frame or frames in the active document. It opens the '</a><a
        HREF="Box_File_Selectors.html#fs_import_text">Import text</a>' file selector. <br>
        &nbsp;</li>
      <li><a NAME="import_vector_menu_entry"><i>&quot;Line Art...&quot;</i> <b>imports a line art</b>
        to the selected frame or frames in the active document. It opens the Import Line Art '</a><a
        HREF="Box_File_Selectors.html#fs_import_vector">Import line art</a>' file selector. <br>
        &nbsp;</li>
    </ol>
  </li>
  <li><a NAME="print_menu_entry"><i>&quot;Print...&quot;</i> <b>prints the active document</b>.
    It calls up the '</a><a HREF="Box_Print.html">Print</a>' dialog box. <br>
    &nbsp;</li>
  <li><a NAME="quit_menu_entry"><i>&quot;Quit...&quot;</i> <b>quits Xclamation</b>. If there
    are still open documents that have not been saved, a dialog box will open to save each one
    individually. Afterwards a confirmation box will appear so that exit from Xclamation may
    be confirmed. </a><br>
    &nbsp;</li>
</ul>
