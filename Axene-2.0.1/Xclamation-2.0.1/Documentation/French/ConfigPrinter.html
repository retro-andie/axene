Cette section des <a HREF="Config.html">fichiers de configuration</a> permet de configurer
les imprimantes. </p>

<h3>Section de configuration d'une imprimante&nbsp;: <i>\PRINTER{...}</i></h3>

<p>Cette section permet de définir une imprimante pour les impressions de vos documents
Xclamation. La définition d'une imprimante s'effectue après l'accolade ouvrante <i>&quot;{&quot;</i>
et avant l'accolade fermante correspondante <i>&quot;}&quot;</i>. Les paramètres de
configuration sont&nbsp;: 

<ol>
  <li><b>\NAME{nom}</b> où <i>nom</i> représente le nom de l'imprimante tel qu'il sera
    défini dans les menus correspondants d'Xclamation. <br>
    &nbsp;</li>
  <li><b>\COMMAND{ligne de commande}</b> où <i>ligne de commande</i> représente la commande
    d'impression de votre système. Si ce paramètre est oublié, l'impression se fera dans un
    fichier. <br>
    &nbsp;</li>
</ol>
<b>

<p>Nota&nbsp;:</b> Il est possible de définir plusieurs imprimantes. Lors de l'impression
il faudra choisir celle utilisée dans la boîte de dialogue '<a HREF="Box_Print.html#printer_list">Impression</a>'. </p>

<h3>Exemple&nbsp;:</h3>
<tt>

<p>\PRINTER{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\NAME{Laser&nbsp;Accueil}<br>
&nbsp;&nbsp;&nbsp;&nbsp;\COMMAND{lpr&nbsp;-PLaser_Acc}<br>
}<br>
</p>

<p>\PRINTER{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\NAME{Fichier}<br>
}<br>
</p>

<p>\PRINTER{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\NAME{Imprimante&nbsp;Postscript}<br>
&nbsp;&nbsp;&nbsp;&nbsp;\COMMAND{lpr}<br>
}<br>
</tt></p>
