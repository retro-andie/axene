<title>Utilisation de la souris</title>

<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">
<p ALIGN="right">
<img ALIGN="middle" SRC="Images/TitleMouse.gif" ALT="Utilisation de la souris" WIDTH="273" HEIGHT="34">
<p>
<br>
<br>
<p>
Une souris ou tout autre dispositif de pointages similaire est
absolument indispensable à l'exploitation d'Xclamation.
La norme sur les terminaux X et les stations de travail Unix est
de disposer de souris avec trois boutons. Cependant, sur des systèmes
Unix ou serveurs X fonctionnant sur compatibles PC, les souris
deux boutons sont plus largement répandues. Sur Macintosh,
la prédominance va aux souris avec un seul bouton. 
<p>
Xclamation se sert des trois boutons pour la manipulation des différentes
fonctionnalités ; cependant, les boutons du milieu et de droite ne 
sont utilisés que pour raccourcir d'autres manipulations. Ils ne
sont donc pas indispensables et l'utilisation complète du logiciel peut
être faite avec un seul bouton a votre souris.
<p>
<br>
<h3> L'emploi des trois boutons dans Xclamation&nbsp;:</h3>
<ol>
  <li>Le <b>bouton de gauche</b> est le bouton qui permet de réaliser
     toutes les opérations de pointages, sélection dans
     des listes, clic sur un bouton poussoir ou icône et glisser/lâcher.
     Il est possible de tout faire dans Xclamation en utilisant exclusivement
     ce bouton. Les deux seules touches qui peuvent être utilisée
     en conjonction avec le bouton de gauche de la souris sont&nbsp;:
     <p>
     <ul>
       <li>la touche <i>Shift</i> lors de la création et la manipulation
	  de cadres pour effectuer la <a HREF="HBar_Frame.html#rectangle_icon">création 
	  de cadre carré</a> 
	  et <a HREF="HBar_Frame.html#ellipse_icon">circulaire</a>, la 
	  <a HREF="Frame_Selection_Modes.html#select_frame">sélection multiple de cadre</a>
	  et la <a HREF="Frame_Selection_Modes.html#dup_frame">duplication de cadre</a>.
	  <p>
       <li>la touche <i>Ctrl</i> dans certaines boîtes de dialogue
	  qui montrent une liste d'éléments. L'usage simultané
	  de cette touche et du bouton gauche de la souris permet de faire
	  la sélection de plusieurs éléments dans une liste. 
	  <p>
     </ul>
     <p>
     <br>
     Un <b>double-clic sur le bouton gauche</b> de la souris s'emploie
     dans les occasions suivantes&nbsp;:
     <p>
     <ul>
       <li>un double-clic sur un cadre permet d'ouvrir la boîte de dialogue
	  '<a HREF="Box_Frame_Attributes.html">Attributs des cadres</a>'
	  d'un cadre.
	  <p>
       <li>un double-clic sur un nom de fichier dans un 
	  <a HREF="Box_File_Selectors.html#file_list">sélecteur de fichier</a>.
	  <p>
       <li>un double-clic dans un champ texte permet de sélectionner
	  un mot entier. Un triple-clic permet de sélectionner la
	  ligne entière de texte. 
     </ul>
     <p>
     <br>
  <li>le <b>bouton droit</b> est utile dans les cas suivants&nbsp;:
     <p>
     <ul>
       <li>pour repasser en <a HREF="Frame_Selection_Modes.html">mode sélection</a>
	  de cadre. Lorsque Xclamation est en mode 
	  <a HREF="HBar_Frame.html#rectangle_icon&gt;création de cadre&lt;/A&gt;,  &lt;A HREF=" HBar_Frame.html#rotation_icon>rotation</a>, 
	  <a HREF="HBar_Frame.html#scaling_icon&gt;homothétie&lt;/A&gt;,  &lt;A HREF=" HBar_Text.html#link_end_icon>chaînage de texte</a>, choix d'un
	  <a HREF="HBar_Zoom.html#zoom_area_icon&gt;nouveau facteur d'agrandissement&lt;/A&gt;...   il est possible de repasser  rapidement en mode sélection de cadre en cliquant sur le  bouton droit de la souris.  &lt;P&gt;       &lt;LI&gt;pour abandonner une opération en cours. Dans les modes  d'action cités ci-dessus, il faut souvent désigner  un emplacement source et un emplacement destination grâce  au bouton gauche de la souris. Après avoir désigné  l'emplacement source, il est possible de cliquer sur le bouton  droit afin d'annuler l'opération.  &lt;P&gt;       &lt;LI&gt;pour ouvrir un &lt;A HREF=" Menu_Context.html">menu contextuel</a>.
     </ul>
     <p>
     <br>
  <li>le <b>bouton central</b> de la souris est très rarement
     utile. Il est quand même exploitable dans les cas suivants&nbsp;:
     <p>
     <ul>
       <li>pour passer de la <a HREF="Frame_Selection_Modes.html#handles_mode">sélection 
	  de cadre en mode poignées</a>
	  à la <a HREF="Frame_Selection_Modes.html#vertices_mode">sélection de 
	  cadre en mode sommets</a> et inversement.
	  <p>
       <li>pour réinitialiser les origines dans les <a HREF="Rulers.html">règles</a>.
	  <p>
       <li>pour faire un &quot;coller&quot; dans un champ texte pour
	  insérer un morceau de texte &quot;copier&quot; depuis un
	  xterm où toute autre application X11 exploitant les mémoires
	  tampons. Dans l'éditeur de texte, il est possible de choisir
	  le tampon à coller en pressant simultanément la
	  touche <i>Shift</i> et le bouton du milieu de la souris.
     </ul>

</ol>
<p>
<br>
Pour comprendre dans quel mode opératoire Xclamation se
trouve, il est très important d'observer la forme du curseur
souris. A chaque cas d'utilisation correspond un curseur souris
spécifique.
