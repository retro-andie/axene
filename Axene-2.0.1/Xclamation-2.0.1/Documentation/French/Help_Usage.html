<BR>
<BR>
<P>
Il existe deux formes d'aide dans Xclamation.
<P>
La premi&egrave;re
est la <A HREF="Main_Interface.html#hint_line">barre d'information</A>
qui permet de <B>conna&icirc;tre de mani&egrave;re concise l'utilit&eacute;
d'une ic&ocirc;ne</B> dans les barres d'ic&ocirc;nes. Lorsque le curseur
souris est positionn&eacute; sur une ic&ocirc;ne, une phrase explicative est
affich&eacute;e dans la barre d'information situ&eacute;e en bas
de l'interface principale d'Xclamation. 
<P>
La deuxi&egrave;me forme d'aide est l'<B>aide en ligne</B>. Celle-ci
est &eacute;crite sous forme de pages HTML
que l'on peut visualiser avec n'importe quel &quot;navigateur HTML&quot;
(tel que Netscape, Mosaic, Lynx, etc.). Axene vous propose d'utiliser son
propre logiciel de visualisation de page HTML, nomm&eacute; XMayday, qui est le
plus adapt&eacute; &agrave; l'affichage de l'aide en ligne pour Xclamation
et les autres produits Axene. Le choix du logiciel pour visualiser la
documentation en ligne s'effectue gr&acirc;ce &agrave; la section
<A HREF="ConfigHelp.html">\HELP_CONFIG</A> des
<A HREF="Config.html">fichiers de configurations</A>.
<P>
Pour acc&eacute;der &agrave; l'aide en ligne, il existe
plusieurs moyens&nbsp;:
<UL>
  <LI>&agrave; partir du <A HREF="Menu_Help.html">menu Aide</A>,
     cliquer sur les entr&eacute;es 
     <A HREF="Menu_Help.html#overview_menu_entry"><I>&quot;Aide
     G&eacute;n&eacute;rale...&quot;</I></A>,
     <A HREF="Menu_Help.html#table_of_contents_menu_entry"><I>&quot;Table
     des Mati&egrave;res...&quot;</I></A>,
     <A HREF="Menu_Help.html#keyboard_menu_entry"><I>&quot;Clavier...&quot;</I></A>,
     <A HREF="Menu_Help.html#mouse_menu_entry"><I>&quot;Souris...&quot;</I></A></I>
     ou <A HREF="Menu_Help.html#using_help_menu_entry"><I>&quot;Utiliser de
     l'aide...&quot;</I></A>.
     <P>
  <LI><IMG SRC="Icons/Help.gif" ALT="">
     dans les bo&icirc;tes de dialogue principales, un bouton ic&ocirc;ne
     permet d'acc&eacute;der &agrave; l'aide de ces bo&icirc;tes.
     <P>
  <LI>&agrave; partir de l'entr&eacute;e
     <A HREF="Menu_Help.html#help_on_item_menu_entry"><I>&quot;Aide sur
     Item...&quot;</I></A>
     du <A HREF="Menu_Help.html">menu Aide</A>. 
     Le curseur souris se transforme en point d'interrogation.
     Il suffit alors de cliquer sur une composante de l'interface
     d'Xclamation pour obtenir une aide sp&eacute;cifique associ&eacute;e.
     Par exemple, pour comprendre l'utilit&eacute; d'un bouton ic&ocirc;ne
     de la barre horizontale d'ic&ocirc;nes affich&eacute;e, il suffit
     de choisir &quot;Aide / Aide sur Item....&quot; puis de cliquer
     sur ce bouton ic&ocirc;ne. <BR> 
     <B>Pour activer cette forme d'aide, il
     est &eacute;galement possible de presser simultan&eacute;ment sur
     les touches <TT>Ctrl</TT> et <TT>F1</TT>.</B> Dans les bo&icirc;tes de
     dialogues (o&ugrave; le menu Aide n'est pas accessible) ce 
     raccourci clavier est le seul moyen d'obtenir l'aide sur item.
     <P>
  <LI>en s&eacute;lectionnant un &eacute;l&eacute;ment d'interface
     et en pressant la touche <TT>F1</TT>. Un &eacute;l&eacute;ment
     d'interface est s&eacute;lectionn&eacute; lorsqu'il est entour&eacute;
     d'un trait noir fin.
     <P>
     La m&eacute;thode de 'l'aide sur item' est la plus commode et la
     plus efficace.
     <P>
</UL>
