<p><br>
<br>
Un sélecteur de fichier permet de choisir le fichier qui servira pour une lecture ou une
écriture d'information. Tous les sélecteurs de fichier fonctionnent de façon identique
; cependant, certains proposent des options supplémentaires. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_FS_Open.gif" ALT="Image&nbsp;: sélecteur de
fichier type" WIDTH="213" HEIGHT="263"> <br>
<small><i>Photo d'écran&nbsp;: Sélecteur de fichier type </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>
<a NAME="file_selector">

<h3>Eléments communs aux sélecteurs de fichier&nbsp;:</h3>
</a>

<ul>
  <li><a NAME="title_label">un <b>titre</b> indique le nom du sélecteur. </a><br>
    &nbsp;</li>
  <li><a NAME="sub_directories_list">une liste déroulante permet de remonter rapidement dans
    un répertoire ancêtre du répertoire actuel. Elle contient tous les sous-répertoires de
    l'<b>arborescence directe</b> du répertoire actuel jusqu'à la racine de l'arborescence. </a><br>
    &nbsp;</li>
  <li><a NAME="file_list">la liste suivante montre tous les <b>sous-répertoires et fichiers
    contenus dans le répertoire actuel</b>. Les noms de répertoires, classés par ordre
    alphabétique, apparaissent au début de la liste avec le caractère &quot;/&quot; à la
    fin de chaque nom. Les noms de fichiers concordant avec un éventuel filtre sont affichés
    à la suite. Double-cliquer sur un nom de répertoire permet de &quot;descendre&quot; dans
    celui-ci&nbsp;: le nom du répertoire actuel se rajoute à la liste déroulante, le
    répertoire sélectionné devient le nouveau répertoire actuel et son contenu est
    affiché dans cette liste. Un simple clic sur un nom de fichier fait apparaître ce nom
    dans le champ texte juste en dessous. Double-cliquer sur un nom de fichier permet de le
    sélectionner sans autre confirmation. </a><br>
    &nbsp;</li>
  <li><a NAME="file_name_textfield">le champ texte indique le <b>nom du fichier</b>
    sélectionné dans la liste et permet d'entrer un nouveau nom. Il est possible d'entrer un
    nom de fichier complet avec le chemin. Si on entre et valide &quot;~&quot;, la racine de
    votre compte deviendra le nouveau répertoire courant ; si on entre et valide un nom de
    répertoire suivi du caractère &quot;/&quot;, le répertoire actuel pointera sur la
    nouvelle destination. Dans certains sélecteurs de fichier, une extension est ajoutée
    automatiquement au nom du fichier quand on le valide. </a><br>
    &nbsp;</li>
  <li><a NAME="left_button">le bouton de gauche de la partie inférieure d'un sélecteur de
    fichier permet d'<b>accepter le nom de fichier</b> pour l'action indiquée sur le bouton
    et ferme la boîte. </a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel">le bouton de droite <i>&quot;Annuler&quot;</i> permet de ne pas
    donner suite à l'action et <b>ferme la boîte</b>. </a><br>
    &nbsp;</li>
</ul>

<p><br>
</p>

<hr>
<a NAME="fs_load">

<h3>Ouverture d'un document&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Ouverture d'un document&quot;</i> permet d'ouvrir un
document Xclamation précedemmment sauvegardé. Le nom d'un fichier Xclamation possède
normalement l'extension &quot;.xc&quot;; seuls les fichiers ayant cette extension seront
affichés. Ce sélecteur de fichier n'offre aucune particularité ; pour le détail de son
utilisation, voir le mode d'emploi d'un </a><a HREF="Box_File_Selectors.html#file_selector">sélecteur de fichier standard.</a> </p>

<p><br>
</p>

<hr>
<a NAME="fs_save">

<h3>Sauvegarde du document sous...&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Sauvegarde du document sous...&quot;</i> permet de
choisir le nom sous lequel le document actif est sauvegardé sur le disque. L'extension
&quot;.xc&quot; est ajoutée automatiquement au nom du fichier. Ce sélecteur de fichier
n'offre pas d'autre particularité ; pour le détail de son utilisation, voir le mode
d'emploi d'un </a><a HREF="Box_File_Selectors.html#file_selector">sélecteur de fichier
standard.</a> </p>

<p><br>
</p>

<hr>
<a NAME="fs_import_image">

<h3>Importation d'image&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Importation d'image&quot;</i> permet de remplir un
cadre avec une image provenant d'un fichier. Il est impératif qu'au moins un cadre soit
sélectionné dans le document actif. Il y a deux moyens d'ouvrir ce sélecteur de
fichier&nbsp;: soit en passant par le menu <i>&quot;</a><a HREF="Menu_File.html">Fichier</a>
/ <a HREF="Menu_File.html#import_menu_entry">Importer</a> / <a HREF="Menu_File.html#import_image_menu_entry">Image...</a>&quot;</i>, soit par le <a HREF="Menu_Context.html#cm_frame_empty">menu contextuel des cadres vides</a>. Si plusieurs
cadres sont sélectionnés, l'importation d'une image va remplir tous les cadres de la
sélection avec la même image. Ce sélecteur est identique et d'emploi similaire à un <a HREF="Box_File_Selectors.html#file_selector">sélecteur de fichier standard</a>. Le format
d'une image est reconnu automatiquement s'il fait partie de la liste suivante&nbsp;: Jpeg,
Gif, Tiff, PNG, Targa, PCX, BMP (RLE), SunRaster; MacPaint et Xwd (X Window Dump). </p>

<p><br>
</p>

<hr>
<a NAME="fs_import_text">

<h3>Importation de texte&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Importation de texte&quot;</i> permet de remplir un
cadre avec un texte provenant d'un fichier. Il est impératif qu'au moins un cadre soit
sélectionné dans le document actif. Il y a deux moyens d'ouvrir ce sélecteur de
fichier&nbsp;: soit en passant par le menu <i>&quot;</a><a HREF="Menu_File.html">Fichier</a>
/ <a HREF="Menu_File.html#import_menu_entry">Importer</a> / <a HREF="Menu_File.html#import_text_menu_entry">Texte...</a>&quot;</i>, soit par le <a HREF="Menu_Context.html#cm_frame_empty">menu contextuel des cadres vides</a>. Si plusieurs
cadres sont sélectionnés, l'importation d'un texte va chaîner automatiquement les
cadres de la sélection, du premier cadre sélectionné jusqu'au dernier. Ce sélecteur de
fichier est divisé horizontalement en deux parties. La partie gauche est identique et
d'emploi similaire à un <a HREF="Box_File_Selectors.html#file_selector">sélecteur de
fichier standard</a>. La partie droite contient la liste déroulante <i>&quot;Format&quot;</i>
qui permet de choisir le format dans lequel le fichier texte est à importer. Les deux
formats disponibles sont le format ASCII et le format interne à Xclamation (que l'on peut
sauver à partir de l'éditeur de texte). Attention! à la première ouverture de ce
sélecteur de fichier, le format sélectionné est Xclamation. </p>

<p><br>
</p>

<hr>
<a NAME="fs_import_vector">

<h3>Importation de dessin vectoriel&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Importation de dessin vectoriel&quot;</i> permet de
remplir un cadre avec un dessin vectoriel provenant d'un fichier. Il est impératif qu'au
moins un cadre soit sélectionné dans le document actif. Il y a deux moyens d'ouvrir ce
sélecteur de fichier&nbsp;: soit en passant par le menu <i>&quot;</a><a HREF="Menu_File.html">Fichier</a> / <a HREF="Menu_File.html#import_menu_entry">Importer</a>
/ <a HREF="Menu_File.html#import_vector_menu_entry">Dessin Vectoriel...</a>&quot;</i>,
soit par le <a HREF="Menu_Context.html#cm_frame_empty">menu contextuel des cadres vides</a>.
Si plusieurs cadres sont sélectionnés, l'importation d'un dessin vectoriel va remplir
tous les cadres de la sélection avec le même dessin. Ce sélecteur est identique et
d'emploi similaire à un <a HREF="Box_File_Selectors.html#file_selector">sélecteur de
fichier standard</a>. Les formats de dessin vectoriel supportés sont Adobe Illustrator®,
Windows Meta File (WMF), Xfig et certains fichiers PostScript®. Seuls les fichiers ayant
l'extension &quot;.ai&quot;, &quot;.eps&quot;, &quot;.epsf&quot;, &quot;.epsi&quot;,
&quot;.ps&quot;, &quot;.fig&quot;, &quot;.xfig&quot; et &quot;.wmf&quot; apparaîtront
dans la liste. </p>

<p><br>
</p>

<hr>
<a NAME="fs_print_in_file">

<h3>Impression dans le fichier...&nbsp;:</h3>

<p>Le sélecteur de fichier <i>&quot;Impression dans le fichier...&quot;</i> permet de
choisir le nom du fichier dans lequel les données de l'impression du document actif
seront sauvées. Ce sélecteur est appelé à partir de la boîte de dialogue '</a><a HREF="Box_Print.html">impression</a>', lorsque l'on choisi <i>&quot;Fichier&quot;</i>
comme imprimante. Il est identique et d'emploi similaire à un <a HREF="Box_File_Selectors.html#file_selector">sélecteur de fichier standard</a>.
L'extension &quot;.ps&quot; est ajoutée automatiquement au nom de fichier. </p>

<p><br>
</p>
