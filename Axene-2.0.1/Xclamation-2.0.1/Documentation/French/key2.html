<A NAME="shortcuts">
<H2>Les raccourcis claviers&nbsp;:</H2>
<UL>
  <LI><B>Ctrl+N</B>&nbsp;: <A HREF="Menu_File.html#new_menu_entry">
     Cr&eacute;er un nouveau document</A>.
  <LI><B>Ctrl+O</B>&nbsp;: <A HREF="Menu_File.html#open_menu_entry">
     Ouvrir un document</A>.
  <LI><B>Ctrl+S</B>&nbsp;: <A HREF="Menu_File.html#save_menu_entry">
     Sauver le document</A>.
  <LI><B>Ctrl+A</B>&nbsp;: <A HREF="Menu_File.html#save_as_menu_entry">
     Sauver le document sous un autre nom</A>.
  <LI><B>Ctrl+P</B>&nbsp;: <A HREF="Menu_File.html#print_menu_entry">
     Imprimer le document</A>.
  <LI><B>Ctrl+Q</B>&nbsp;: <A HREF="Menu_File.html#quit_menu_entry">
     Quitter Xclamation</A>.
  <LI><B>Ctrl+X</B>&nbsp;: <A HREF="Menu_Edit.html#cut_menu_entry">
     Couper la s&eacute;lection</A>.
  <LI><B>Ctrl+C</B>&nbsp;: <A HREF="Menu_Edit.html#copy_menu_entry">
     Copier la s&eacute;lection</A>.
  <LI><B>Ctrl+V</B>&nbsp;: <A HREF="Menu_Edit.html#paste_menu_entry">
     Coller le contenu du presse-papiers</A>.
  <LI><B>Ctrl+R</B>&nbsp;: <A HREF="Menu_Frame.html#create_rectangle_menu_entry">
     Cr&eacute;er un cadre rectangulaire</A>.
  <LI><B>Ctrl+G</B>&nbsp;: <A HREF="Menu_Frame.html#create_polygon_menu_entry">
     Cr&eacute;er un cadre polygonal</A>.
  <LI><B>Ctrl+E</B>&nbsp;: <A HREF="Menu_Frame.html#create_ellipse_menu_entry">
     Cr&eacute;er un cadre elliptique</A>.
  <LI><B>Ctrl+D</B>&nbsp;: <A HREF="Menu_Frame.html#backward_menu_entry">
     Eloigner la s&eacute;lection d'un plan</A>.
  <LI><B>Ctrl+U</B>&nbsp;: <A HREF="Menu_Frame.html#forward_menu_entry">
     Approcher la s&eacute;lection d'un plan</A>.
  <LI><B>Ctrl+L</B>&nbsp;: <A HREF="Menu_Frame.html#lock_menu_entry">
     Verrouiller / D&eacute;verrouiller la s&eacute;lection</A>.
  <LI><B>Ctrl+1</B> ... <B>Ctrl+9</B>&nbsp;: 
     S&eacute;lectionner une fen&ecirc;tre.
  <LI><B>M&eacute;ta+X</B>&nbsp;: <A HREF="Menu_View.html#redraw_all_menu_entry">
     Tout redessiner</A>.
</UL>
</A><P>
