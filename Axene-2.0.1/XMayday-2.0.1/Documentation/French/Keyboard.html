<a NAME="shortcuts">
<h2>Les raccourcis claviers&nbsp;:</h2>
<ul>
  <li><b>Ctrl+N</b>&nbsp;: <a HREF="Menu_Bar.html#new_menu_entry">
     Créer une nouvelle fenêtre</a>.
  <li><b>Ctrl+I</b>&nbsp;: <a HREF="Menu_Bar.html#open_index_menu_entry">
     Ouvrir un index</a>.
  <li><b>Ctrl+O</b>&nbsp;: <a HREF="Menu_Bar.html#open_file_menu_entry">
     Ouvrir un fichier</a>.
  <li><b>Ctrl+P</b>&nbsp;: <a HREF="Menu_Bar.html#print_menu_entry">
     Imprimer la page</a>.
  <li><b>Ctrl+W</b>&nbsp;: <a HREF="Menu_Bar.html#close_menu_entry">
     Fermer la fenêtre</a>.
  <li><b>Ctrl+Q</b>&nbsp;: <a HREF="Menu_Bar.html#quit_menu_entry">
     Quitter XMayday</a>.
  <li><b>Méta+X</b>&nbsp;: <a HREF="Menu_Bar.html#reload_menu_entry">
     Tout recharger</a>.
  <li><b>Ctrl+B</b>&nbsp;: <a HREF="Menu_Bar.html#prev_menu_entry">
     Aller à la page précédente</a>.
  <li><b>Ctrl+F</b>&nbsp;: <a HREF="Menu_Bar.html#next_menu_entry">
     Aller à la page suivante</a>.
  <li><b>Ctrl+I</b>&nbsp;: <a HREF="Menu_Bar.html#home_menu_entry">
     Aller à la page initiale</a>.
  <li><b>Alt+1 ... Alt+9</b>&nbsp;: <a HREF="Menu_Bar.html#history_menu_entry">
     Accéder directement à l'une des 9 premières pages de l'historique</a>.
</ul>
</a><p>
