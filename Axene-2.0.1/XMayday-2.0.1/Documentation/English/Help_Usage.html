<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleHelpUse.gif" ALT="Using Help" WIDTH="132" HEIGHT="34"> </p>

<p><br>
<br>
There are several ways to access on-line help: 

<ul>
  <li>From the <a HREF="Menu_Bar.html#help">Help menu</a> click on either <a HREF="Menu_Bar.html#overview_menu_entry"><i>&quot;Overview...&quot;</i></a>, <a HREF="Menu_Bar.html#table_of_contents_menu_entry"><i>&quot;Table of Contents...&quot;</i></a>,
    <a HREF="Menu_Bar.html#keyboard_menu_entry"><i>&quot;Keyboard...&quot;</i></a> or <a HREF="Menu_Bar.html#using_help_menu_entry"><i>&quot;Using Help...&quot;</i></a>. <br>
    &nbsp;</li>
  <li>Select the <a HREF="Menu_Bar.html#help_on_item_menu_entry"><i>&quot;Help on
    item...&quot;</i></a> option in the <a HREF="Menu_Bar.html#help">Help menu</a>. After
    choosing this option the mouse's cursor changes shape; to obtain specific information on
    an item, click on the corresponding XMayday interface zone. For example, to learn the
    function of a particular button on the current horizontal toolbar, choose &quot;Help /
    Help on item...&quot;, then click on the button in question.<br>
    This type of help is also available by simultaneously pressing the <tt>Control</tt> and <tt>F1</tt>
    keys. This second method can be used to display information on interface elements in the
    dialog boxes. <br>
    &nbsp;</li>
  <li>Select an interface element and press the <tt>F1</tt> key. An interface element is
    selected when a thin black line is visible surrounding the element. <p>The selection
    method 'Help on item' is simpler and more efficient than other methods. </p>
  </li>
</ul>

<p><br>
