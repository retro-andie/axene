<p><br>
<br>
The <i>Importing a Document</i> file selector selects a filename to be imported and the
type of data contained in this file. There are two types of import formats: text and
Excel® formats.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_FS_Import.gif" ALT="Image: Importing a Document File Selector"
WIDTH="273" HEIGHT="272"> <br>
<small><i>Screen snap: Importing a Document File Selector</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<p><a NAME="format_list">At the top, right portion of the selector, a pulldown list allows
the user to select the type of data imported. Depending upon what is selected from this
list, the <i>Configuration</i> section on the right side of this file selector may have
two forms:</a> 

<ol>
  <li>Importing text files: (elements &quot;Text [Unis/Dos/Mac] [space/tab/csv]&quot;) The <i>Configuration</i>
    section will appear like the screen snap above.<br>
    &nbsp;</li>
  <li>Importing Excel files: (elements &quot;Excel® [2/3/4]&quot;). The <i>Configuration</i>
    section is empty. Importing an Excel® file creates a new worksheet. Attention: the user
    must select the correct Excel® file version.</li>
</ol>

<p><a NAME="configuration_section">In the case of importing text files, the <i>Configuration
s</i>ection is composed from top to bottom by:</a> 

<ul>
  <li><a NAME="in_active_doc_button">The <i>In the Active Document</i> button allows the
    imported text file contents to be inserted in the active worksheet. This insertion into
    the active cell may erase the contents of cells underneath and to the right. The design
    elements of erased cells will not be affected. When this button is not engaged, a new
    worksheet is created to receive the imported file's contents.</a><br>
    &nbsp;</li>
  <li><a NAME="trim_before_button">The <i>Cut Spaces Before</i> button suppresses space
    characters at the beginning of each cell's contents. If the file to be imported contains
    data formatted with spaces, it is preferable to keep this button engaged.</a><br>
    &nbsp;</li>
  <li><a NAME="trim_after_button">The <i>Cut Spaces After</i> button suppresses space
    characters at the end of each cell&#146;s contents. If the file to be imported contains
    data formatted with spaces, it is preferable to keep this button engaged.</a><br>
    &nbsp;</li>
  <li><a NAME="sep_column_textfield">The columns text field: shows how cells will be separated
    into columns from the imported file. The contents of this text field are regulated by
    administered by a </a><a HREF="Box_FS_Import_grammary.html">specific syntax.</a>. <br>
    &nbsp;</li>
  <li><a NAME="encoding_buttons">The three buttons <i>Accent types</i>
    (&quot;UNIX,Windows&quot;, &quot;DOS-OS/2&quot; and &quot;Macintosh&quot;) allow the user
    to specify which accent table will be used in order to obtain a satisfactory conversion
    from the system where XQuad imports files.</a></li>
</ul>

<p><br>
