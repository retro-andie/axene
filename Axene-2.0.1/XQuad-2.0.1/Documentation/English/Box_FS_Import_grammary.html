<title>Text Import - Grammar</title>
</head>

<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleFileSelector.gif"
ALT="File Selector" WIDTH="102" HEIGHT="25"> <img ALIGN="middle"
SRC="Images/TitleFSImport.gif" ALT="Text Import" WIDTH="272" HEIGHT="35"> </p>

<p><br>
<br>
The &quot;<i>columns</i>&quot; field allows to define how text is cut out and stored in
columns. Here is the grammar for this text field: the string must be a list of semi-colon
separated sequences.</p>

<p align="center"><font COLOR="#EE3333">&lt;sequence1&gt;</font><b>;</b><font
COLOR="#EE3333">&lt;sequence2&gt;</font><b>;</b><font COLOR="#EE3333">&lt;sequence3&gt; </font></p>

<p align="center">Each sequence filter the text to store it in a column.</p>

<p>A sequence can have two forms: 

<ol>
  <li><b>A number</b>, telling how many characters to from the text before a change of column.<br>
    &nbsp;</li>
  <li><b>A character string</b> between quotes (&quot; &quot;), used as a delimiter. When this
    text is matched in the text, XQuad change to next column.<br>
    You can use special characters by using the ASCII code. For example the character <b>A</b>
    can be also written <b>\65</b> (decimal), <b>\0101</b> (octal), <b>\0x41</b>
    (hexadecimal). For further information, see the <a HREF="Keyboard.html#special_car">ASCII
    table</a> in addendum.<br>
    Some special characters can be written differently:<ul>
      <li><b>\t</b> for tabulator (ASCII 0x9)</li>
      <li><b>\n</b> for new line (ASCII 0xa)</li>
      <li><b>\r</b> for carriage return (ASCII 0xd)</li>
      <li><b>\\</b> for the slash character ('\')</li>
    </ul>
  </li>
</ol>

<p>The character '!' at the beginning of a sequence prevents from storing the text in the
column. The delimiter is still matched, thus it can be useful for skipping some part of
text.</p>

<p>The character '*' at the beginning of a string sequence tells that the column separator
is one or more times the string in the imported text.</p>

<p>The file cut out for each line is made at the first occurrence of the character <b>\n</b>
(new line), or <b>\r</b> (carriage return) or <b>\n\r</b> (new line + carriage return),
after the check of every sequences. You have two choices for ending the &quot;<i>columns</i>&quot;
field: 

<ul>
  <li>Ending with a sequence: text is cut out in columns until the first end of line.</li>
  <li>Ending with a semi-colon: all the characters before the first end of line are stored in
    the last column of the line.</li>
</ul>

<p><b>Example&nbsp;:</b><br>
Importing the file last.txt generated by the following command:</p>

<p>$ <tt>last &gt; last.txt</tt> </p>

It can be parsed with the following string in the &quot;<i>columns</i>&quot; field:<br>
<tt><b>10;13;&quot; &quot;;&quot; &quot;*;&quot; &quot;;&quot; &quot;;!&quot;-
&quot;;&quot; &quot;*;!&quot;(&quot;;&quot;)&quot;; </b></tt></p>

<p align="center"><b>Explanations:</b> <br>
<tt><b><font COLOR="#EE3333">10</font>;<font COLOR="#EE3333">13</font>;<font
COLOR="#EE3333">&quot; &quot;</font>;<font COLOR="#EE3333">&quot; &quot;*</font>;<font
COLOR="#EE3333">&quot; &quot;</font>;<font COLOR="#EE3333">&quot; &quot;</font>;<font
COLOR="#EE3333">!&quot;- &quot;</font>;<font COLOR="#EE3333">&quot; &quot;*</font>;<font
COLOR="#EE3333">!&quot;(&quot;</font>;<font COLOR="#EE3333">&quot;)&quot;</font>;</b></tt>
</p>

<p><tt><b><font COLOR="#EE3333">10</font>;<font COLOR="#EE3333">13</font></b></tt> parses
the first two columns, because the first column has 10 characters and the second 13. A
sequence like <tt><b><font COLOR="#EE3333">&quot; &quot;*</font>;<font COLOR="#EE3333">&quot;
&quot;*</font></b></tt> do not work because the second columns doesn't always exist.</p>

<p><tt><b><font COLOR="#EE3333">&quot; &quot;</font>;<font COLOR="#EE3333">&quot; &quot;*</font>;<font
COLOR="#EE3333">&quot; &quot;</font>;<font COLOR="#EE3333">&quot; &quot;</font></b></tt>
gets the following fields: day (Fri), month (Apr), day of the month (12), and connection
time (14:14).</p>

<p><tt><b><font COLOR="#EE3333">!&quot;- &quot;</font></b></tt> skips the dash between the
connection time and the de-connection time.</p>

<p><tt><b><font COLOR="#EE3333">&quot; &quot;*</font></b></tt> gets the de-connection time
and skip the trailing spaces.</p>

<p><tt><b><font COLOR="#EE3333">!&quot;(&quot;</font></b></tt> skips the open parenthesis.</p>

<p><tt><b><font COLOR="#EE3333">&quot;)&quot;</font>;</b></tt> gets the session duration.</p>
