<a NAME="box_hour"></p>

<h2 align="center">Format time configuration</h2>
</a>

<p>When the format type is either &quot;<i>Time</i>&quot; or &quot;<i>Time</i> +
Date&quot; and you select the &quot;<i>Time</i>&quot; button in the horizontal bar (upper
right portion of the 'Numeric Format' dialog box), the &quot;<i>Configuration</i>&quot;
section looks like this:</p>

<p align="center"><img SRC="Images/Box_NumFmt_Hour.gif" WIDTH="230" HEIGHT="219"> <br>
<small><i>Screen snap: &quot;Configuration&quot; section</i></small></p>

<p><a NAME="preview_hour">The &quot;sample&quot; text field can be edited. The format is
displayed in the &quot;sample&quot; area exactly like it will be in a cell. When you click
on a button of the &quot;<i>Configuration</i>&quot; section, the button's label is
inserted in the &quot;sample&quot; area. When you delete any character from an automatic
insertion, the whole block is deleted too.</a></p>

<p>To modify an time format, you have to click on the buttons and then adjust the result
in the &quot;sample&quot; text field.</p>

<p>This section is composed, from top to bottom, by: 

<ul>
  <li><a NAME="frame_alignment_1">The &quot;<i>Alignment</i>&quot; sub-section: the three
    buttons <b>select whether you want to make a time element always displayed</b> or not, and
    if necessary, which <b>character is used for replacement</b>. For example, minutes can be
    displayed with one or two digits.</a><br>
    &nbsp;<ul>
      <li>The &quot;<i>None</i>&quot; button <b>selects no alignment</b>. The different parts of a
        time are displayed with the minimum number of digit.<br>
        &nbsp;</li>
      <li>The &quot;<i>with '0'</i>&quot; button <b>selects alignment for numbers and completion
        with zeros</b>. The different parts of a time are displayed with the maximum number of
        digit, and the missing numbers are replaced by zeros.<br>
        &nbsp;</li>
      <li>The &quot;<i>with ' '</i>&quot; button <b>selects alignment for numbers and completion
        with spaces</b>. The different parts of a time are displayed with the maximum number of
        digit, and the missing numbers are replaced by spaces.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="hour_area">The three &quot;<i>Hours</i>&quot; buttons <b>insert the hours part
    of the time</b> in the sample area. The buttons are, from left to right:</a><ul>
      <li>Hour for a half day (12 hours). Thus, 5PM are displayed 5, not 17. This label is
        dependent from the &quot;<i>Alignment</i>&quot; parameter.<br>
        &nbsp;</li>
      <li>The AM / PM signs. AM stands for 'Ante Meridiem' (before noon), which means the morning.
        PM stands for 'Post Meridiem', which means the afternoon.<br>
        &nbsp;</li>
      <li>Hour for a whole day (24 hours). Thus, 1PM is displayed 13, not 1. This label is
        dependent from the &quot;<i>Alignment</i>&quot; parameter.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="minute_area">The &quot;<i>Minutes</i>&quot; button <b>inserts the minutes part
    of the time</b> in the sample area. This label is dependent from the &quot;<i>Alignment</i>&quot;
    parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="second_area">The &quot;<i>Seconds</i>&quot; button <b>inserts the seconds part
    of the time</b> in the sample area. This label is dependent from the &quot;<i>Alignment</i>&quot;
    parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="second_10_area">The &quot;<i>Second Tenths</i>&quot; button <b>inserts the
    second tenths part of the time</b> in the sample area. This label is dependent from the
    &quot;<i>Alignment</i>&quot; parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="second_100_area">The &quot;<i>Second Hundredth</i>&quot; button <b>inserts the
    second hundredth part of the time</b> in the sample area. This label is dependent from the
    &quot;<i>Alignment</i>&quot; parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="second_1000_area">The &quot;<i>Second Thousandth</i>&quot; button <b>inserts
    the second thousandth part of the time</b> in the sample area. This label is dependent
    from the &quot;<i>Alignment</i>&quot; parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="separator_area_1">The six &quot;<i>Separators</i>&quot; buttons <b>insert a
    separator character</b> in the sample area. You can either click on one of the most
    current separator characters, or enter a particular one in the sample text field.</a></li>
</ul>

<p><br>
<br>

<a NAME="bnf_date">

<h2 align="center">Format date configuration</a></h2>

<p>When the format type is either &quot;<i>Time</i>&quot; or &quot;<i>Time</i> +
Date&quot; and you select the &quot;<i>Dates</i>&quot; button in the horizontal bar (upper
right portion of the 'Numeric Format' dialog box), the &quot;<i>Configuration</i>&quot;
section looks like this:</p>

<p align="center"><img SRC="Images/Box_NumFmt_Date.gif" WIDTH="229" HEIGHT="216"> <br>
<small><i>Screen snap: &quot;Configuration&quot; section</i></small></p>

<p><a NAME="preview_date">The &quot;sample&quot; text field can be edited. The format is
displayed in the &quot;sample&quot; area exactly like it will be in a cell. When you click
on a button of the &quot;<i>Configuration</i>&quot; section, the button's label is
inserted in the &quot;sample&quot; area. When you delete any character from an automatic
insertion, the whole block is deleted too.</a></p>

<p>To modify a date format, you have to click on the buttons and then adjust the result in
the &quot;sample&quot; text field.</p>

<p>This section is composed, from top to bottom, by: 

<ul>
  <li><a NAME="frame_alignment_2">The &quot;<i>Alignment</i>&quot; sub-section: the three
    buttons <b>select whether you want to make a date element always displayed</b> or not, and
    if necessary, which <b>character is used for replacement</b>. For example, the day of the
    month can be displayed with one or two digits.</a><br>
    &nbsp;<ul>
      <li>The &quot;<i>None</i>&quot; button <b>selects no alignment</b>. The different parts of a
        date are displayed with the minimum number of digit.<br>
        &nbsp;</li>
      <li>The &quot;<i>with '0'</i>&quot; button <b>selects alignment for numbers and completion
        with zeros</b>. The different parts of a date are displayed with the maximum number of
        digit, and the missing numbers are replaced by zeros.<br>
        &nbsp;</li>
      <li>The &quot;<i>with ' '</i>&quot; button <b>selects alignment for numbers and completion
        with spaces</b>. The different parts of a date are displayed with the maximum number of
        digit, and the missing numbers are replaced by spaces.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="frame_namelength">The &quot;<i>Length of names</i>&quot; sub-section: the three
    buttons <b>selects the length for the displaying of names of the weekdays, or months</b>.</a><br>
    &nbsp;<ul>
      <li>The &quot;<i>Very Short</i>&quot; button <b>selects a very short form of the name</b>.
        The name of the weekday or of the month is displayed with one or two letters (there are
        sometimes two letters to avoid possible mistakes).<br>
        &nbsp;</li>
      <li>The &quot;<i>Short</i>&quot; button <b>selects a short form of the name</b>. The name of
        the weekday or of the month is displayed with three letters.<br>
        &nbsp;</li>
      <li>The &quot;<i>Long</i>&quot; button <b>selects a long form of the name</b>. The name of
        the weekday or of the month is displayed entirely.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="year_area">The three &quot;<i>Year</i>&quot; buttons <b>insert the year part of
    the date</b> in the sample area. The buttons are, from left to right:</a><br>
    &nbsp;<ul>
      <li>Year in long form (i.e. 4 digits for nowadays). This label is dependent from the &quot;<i>Alignment</i>&quot;
        parameter.<br>
        &nbsp;</li>
      <li>Year in short form (i.e. 2 digits for nowadays). This label is dependent from the &quot;<i>Alignment</i>&quot;
        parameter.<br>
        &nbsp;</li>
      <li>A relative indication from J.C. (Jesus Christ). &quot;Negative&quot; years have an
        &quot;BC&quot; mention, while &quot;negative&quot; years have a &quot;AC&quot; mention.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="month_area">The two &quot;<i>Month</i>&quot; buttons <b>insert the month part
    of the date</b> in the sample area. The buttons are, from left to right:</a><br>
    &nbsp;<ul>
      <li>Month as a number (i.e. 1 for January). This label is dependent from the &quot;<i>Alignment</i>&quot;
        parameter.<br>
        &nbsp;</li>
      <li>Name of the month. This label is dependent from the &quot;<i>Length of names</i>&quot;
        parameter.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="week_area">The &quot;<i>Week</i>&quot; buttons <b>inserts the week number in
    the year part of the date</b> in the sample area. The 1<sup>st</sup> January of the year
    starts the 1<sup>st</sup> week of the year. This label is dependent from the &quot;<i>Alignment</i>&quot;
    parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="day_area">The two &quot;<i>Day</i>&quot; buttons <b>insert the day part of the
    date</b> in the sample area. The buttons are, from left to right:</a><br>
    &nbsp;<ul>
      <li>The day number in the month. This label is dependent from the &quot;<i>Alignment</i>&quot;
        parameter.<br>
        &nbsp;</li>
      <li>The name of the day in the week. This label is dependent from the &quot;<i>Length of
        names</i>&quot; parameter.<br>
        &nbsp;</li>
    </ul>
  </li>
  <li><a NAME="day_year_area">The &quot;<i>Day of the year</i>&quot; buttons <b>inserts the
    day number in the year part of the date</b> in the sample area. The 1<sup>st</sup> January
    of the year is the 1<sup>st</sup> day of the year. This label is dependent from the &quot;<i>Alignment</i>&quot;
    parameter.</a><br>
    &nbsp;</li>
  <li><a NAME="separator_area_2">The six &quot;<i>Separators</i>&quot; buttons <b>insert a
    separator character</b> in the sample area. You can either click on one of the most
    current separator characters, or enter a particular one in the sample text field.</a></li>
</ul>
