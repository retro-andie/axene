This <a HREF="Config.html">configuration file</a> section configures the paths and
applications used to call up help. </p>

<h3>On-line Help Configuration Section: <i>\HELP_CONFIG{...}</i></h3>

<p>This section defines XQuad's on-line help configuration. The help definition begins
after the opening bracket <i>&quot;{&quot;</i> and before the corresponding closing
bracket <i>&quot;}&quot;</i>. The configuration parameters are: 

<ol>
  <li><b>\BASE_LOCATION{path}</b> where <i>path</i> represents the help-file pathway. <br>
    &nbsp;</li>
  <li><b>\HELP_COMMAND{...}</b>. Each \HELP_COMMAND parameter contains a means of launching
    the on-line documentation. If the first command does not work, it takes the second, and so
    on. This subsection may contain the following parameters: <br>
    &nbsp; <ol>
      <li><b>\COMMAND{command}</b> where <i>command</i> represents the command line to be
        executed. When the user calls up XQuad's on-line documentation, the page associated
        with the requested portion of documentation will be added to this command line. <br>
        &nbsp;</li>
      <li><b>\XMAYDAY_PROTOCOL</b>. The user may use this parameter if <i>XMAYDAY</i> is the
        application used to read documentation. In this case the communication protocol with
        XMAYDAY will be activated, meaning, for example, that XMAYDAY will not need to be
        re-booted each time the user calls up documentation from XQuad. <br>
        &nbsp;</li>
      <li><b>\NETSCAPE_PROTOCOL</b> works in the same manner as \XMAYDAY_PROTOCOL except it is
        used for Netscape Navigator. <br>
        &nbsp;</li>
    </ol>
  </li>
</ol>

<h3>Example:</h3>
<tt>

<p>\HELP_CONFIG{<br>
&nbsp;&nbsp;&nbsp;&nbsp;\BASE_LOCATION{<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$XCLAMATION_LIB/doc/XQuad/English<br>
&nbsp;&nbsp;&nbsp;&nbsp;}<br>
&nbsp;&nbsp;&nbsp;&nbsp;\HELP_COMMAND{<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\COMMAND{XMayday}<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\XMAYDAY_PROTOCOL<br>
&nbsp;&nbsp;&nbsp;&nbsp;}<br>
&nbsp;&nbsp;&nbsp;&nbsp;\HELP_COMMAND{<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\COMMAND{netscape}<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\NETSCAPE_PROTOCOL<br>
&nbsp;&nbsp;&nbsp;&nbsp;}<br>
&nbsp;&nbsp;&nbsp;&nbsp;\HELP_COMMAND{<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\COMMAND{Mosaic}<br>
&nbsp;&nbsp;&nbsp;&nbsp;}<br>
} </tt></p>
