<p><br>
<br>
The <i>Cell Backgrounds</i> dialog box selects colors and designs for cell backgrounds in
selected regions.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_CellPattern.gif" ALT="Image: Cell backgrounds dialog box" WIDTH="204"
HEIGHT="203"> <br>
<small><i>Screen shot: Cell backgrounds dialog box.</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Upper Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="list_foreground_color">The pulldown <i>Foreground</i> menu selects the
    foreground design to be applied to selected cells. The color list is defined in the </a><a
    HREF="Box_Color.html">Color Preparation</a> dialog box. <br>
    &nbsp;</li>
  <li><a NAME="list_background_color">The pulldown <i>Background</i> menu selects the
    background color and pattern to be applied to selected cells.</a><br>
    &nbsp;</li>
  <li><a NAME="section_pattern">The <i>Pattern Catalog</i> section previews available
    patterns. Simply click on one of the displayed pattern to change the background pattern in
    a specific region. The pattern selected will be surrounded by a thick frame. The display
    on the top left is the default worksheet pattern, which is transparent upon printing.</a></li>
</ul>

<p><br>
</p>

<h3>Lower Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="button_ok"><i>&quot;Ok&quot;</i> changes the background design of selected
    cells to a design selected here.</a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel"><i>&quot;Cancel&quot;</i> closes the box without making changes.</a></li>
</ul>

<p><br>
