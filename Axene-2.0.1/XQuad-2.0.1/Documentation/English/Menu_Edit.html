<p><br>
<br>
The Edit pulldown menu houses command for clipboard operations, deleting elements from
cells, inserting and deleting lines and columns, duplicating cells, and editing of colors.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Menu_Edit.gif" ALT="Picture: Edit menu" WIDTH="226" HEIGHT="289"> <br>
<small><i>Screen snap: Edit pulldown menu</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>The Edit menu contains the following options</h3>

<ul>
  <li><a NAME="cut_menu_entry"><i>&quot;Cut&quot;</i> lets you <b>cut selected cells to the
    clipboard</b>. You can obtain the same action by clicking on the </a><a HREF="HBar_Misc.html#cut_icon">first icon of the second section</a> of the 'General
    Functions' horizontal toolbar.<br>
    &nbsp;</li>
  <li><a NAME="copy_menu_entry"><i>&quot;Copy&quot;</i> lets you <b>copy selected cells to the
    clipboard</b>. You can obtain the same action by clicking on the </a><a HREF="HBar_Misc.html#copy_icon">second icon of the second section</a> of the 'General
    Functions' horizontal toolbar.<br>
    &nbsp;</li>
  <li><a NAME="paste_menu_entry"><i>&quot;Paste&quot;</i> lets you <b>paste clipboard content
    to the spreadsheet</b>. You can obtain the same action by clicking on the </a><a HREF="HBar_Misc.html#paste_icon">last icon of the second section</a> of the 'General
    Functions' horizontal toolbar.<br>
    &nbsp;</li>
  <li><a NAME="delete_menu_entry"><i>&quot;Delete&quot;</i> opens to the following sub-menu
    when there are selected cell:</a><p align="center"><img SRC="Images/Menu_Edit_Delete.gif" ALT="Delete submenu" WIDTH="165" HEIGHT="198"> </p>
    <ol>
      <li><a NAME="delete_all_menu_entry"><i>&quot;Delete All&quot;</i> lets you <b>empty cells
        from their content and ornaments</b>. Cells will become like it was at the sheet creation.
        You can obtain the same action by selecting <i>&quot;Delete Formulas&quot;</i> and then <i>&quot;Delete
        Formats&quot;</i>.</a><br>
        <a NAME="delete_all_menu_entry"></a>&nbsp;</li>
      <li><a NAME="delete_formulas_menu_entry"><i>&quot;Delete Formulas&quot;</i> lets you <b>empty
        cells from their content</b>. Cells' ornaments will not be deleted.</a><br>
        &nbsp;</li>
      <li><a NAME="delete_formats_menu_entry"><i>&quot;Delete Formats&quot;</i> lets you <b>reset
        the cells' ornaments</b>. Cells will become like it was at the sheet creation.</a><br>
        &nbsp;</li>
      <li><a NAME="delete_patterns_menu_entry"><i>&quot;Delete Backgrounds&quot;</i> lets you <b>reset
        the cells' background pattern</b>. The default background pattern is the first in the <i>&quot;Pattern
        catalog&quot;</i> of the '</a><a HREF="Box_CellPattern.html#section_pattern">Cell
        Backgrounds</a>' dialog box.<br>
        &nbsp;</li>
      <li><a NAME="delete_borders_menu_entry"><i>&quot;Delete Borders&quot;</i> lets you <b>delete
        the cells' borders</b>. You can obtain the same action by clicking on the first icon of
        the</a> '<a HREF="HBar_Ornament.html#noborder_icon">Cell Ornament</a>' horizontal toolbar.
        <br>
        &nbsp;</li>
      <li><a NAME="delete_styles_menu_entry"><i>&quot;Delete Styles&quot;</i> lets you <b>reset
        the cells' numeric format</b>. The cells will get the default numeric format (<i>&quot;Standard&quot;</i>)
        defined in the '</a><a HREF="Box_NumFormat.html">Numeric Format</a>' dialog box. <br>
        &nbsp;</li>
      <li><a NAME="delete_positions_menu_entry"><i>&quot;Delete Positions&quot;</i> lets you <b>reset
        cells' position parameters</b>. The default position if left for text and right for
        numeric values, vertically centered on a single line, and writing from left to right.</a><br>
        &nbsp;</li>
      <li><a NAME="delete_fonts_menu_entry"><i>&quot;Delete Fonts&quot;</i> lets you <b>reset the
        cells' font</b>. The default font is the <i>&quot;Style&quot;</i> font defined in the '</a><a HREF="Box_Font.html">Font</a>' dialog box. </li>
    </ol>
    <p><a NAME="delete_frame_menu_entry">When frames are selected, <i>&quot;Delete&quot;</i>
    let you delete the selected frames.</a></p>
  </li>
  <li><a NAME="insert_rows_menu_entry"><i>&quot;Insert Rows&quot;</i> lets you <b>insert lines
    at the selection level</b>. The number of inserted lines depends from the selection lines
    number. Lines are inserted on top of the selection, so the selection and lines below are
    shifted down. Inserting and shifting only happens on the columns of the selection, then to
    insert a whole line you have to select a whole line. This command is not available if
    there are several selected areas or a whole column selected.</a><br>
    &nbsp;</li>
  <li><a NAME="delete_rows_menu_entry"><i>&quot;Delete Row&quot;</i> lets you <b>delete lines
    at the selection level</b>. All selection cells will be deleted and all the cells on
    bottom will be shifted up. To delete a whole line you have to select a whole line. This
    command is not available if there are several selected areas or a whole column selected.</a><br>
    &nbsp;</li>
  <li><a NAME="insert_columns_menu_entry"><i>&quot;Insert Columns&quot;</i> lets you <b>insert
    columns at the selection level</b>. The number of inserted columns depends from the
    selection columns number. columns are inserted on left of the selection, so the selection
    and right columns are shifted right. Inserting and shifting only happens on the lines of
    the selection, then to insert a whole column you have to select a whole column. This
    command is not available if there are several selected areas or a whole line selected.</a><br>
    &nbsp;</li>
  <li><a NAME="delete_columns_menu_entry"><i>&quot;Delete Column&quot;</i> lets you <b>delete
    columns at the selection level</b>. All selection cells will be deleted and all the cells
    on right will be shifted left. To delete a whole column you have to select a whole column.
    This command is not available if there are several selected areas or a whole line
    selected.</a><br>
    &nbsp;</li>
  <li><a NAME="copy_to_bottom_menu_entry"><i>&quot;Copy to Bottom&quot;</i> lets you <b>copy
    the content of first line from the selection to the remaining lines in the selection</b>.
    The selection must contain more than one line to make this command avaible.</a><br>
    &nbsp;</li>
  <li><a NAME="copy_to_right_menu_entry"><i>&quot;Copy to Right&quot;</i> lets you <b>copy the
    content of first column from the selection to the remaining column in the selection</b>.
    The selection must contain more than one column to make this command avaible.</a><br>
    &nbsp;</li>
  <li><a NAME="color_menu_entry"><i>&quot;Colors...&quot;</i> lets you <b>edit the color list</b>.
    It opens the '</a><a HREF="Box_Color.html">Color</a>' dialog box. </li>
</ul>
