<p><br>
<br>
The <i>Row and Column Size</i> dialog box selects dimensions for rows and/or columns in
the selected cell region.<br>
</p>

<hr>

<p><br>
</p>

<p align="center"><img SRC="Images/Box_ColumnRowSize.gif" ALT="Image: Row and Column Size dialog box" WIDTH="161" HEIGHT="171"> <br>
<small><i>Screen snap: Row and Column Size dialog box</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Upper Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="entry_column_width">The <em>Column Width</em> text field <strong>selects the
    width of columns</strong> in the selected cell region. The value is expressed in
    centimeters and must be set between 0 and 100 cm. When this value is changed, the Apply
    button in the columns section selects itself automatically.</a><br>
    &nbsp;</li>
  <li><a NAME="button_colsize_apply">The <em>Apply</em> button in the column section <strong>determines
    whether or not a column width value will be applied or not</strong>. The user may change
    column widths and row heights independently.</a><br>
    &nbsp;</li>
  <li><a NAME="entry_row_height">The <em>Row Height</em> text field <strong>selects the height
    of rows</strong> in the selected cell region. This value is expressed in centimeters and
    must be set between 0 and 100 cm. When this value is changed, the Apply button in the rows
    section selects itself automatically.</a><br>
    &nbsp;</li>
  <li><a NAME="button_rowsize_apply">The <em>Apply</em> button in the row section <strong>determines
    whether or not a row height value will be applied or not</strong>. The user may change row
    height and column widths independently. </a></li>
</ul>

<p><br>
</p>

<h3>Lower Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="button_ok"><em>OK</em> <strong>changes the width of columns and/or the height
    of rows</strong> in the selected cell regions according to the given indications.</a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel"><em>Cancel</em> <strong>closes the box without changes</strong>
    to the worksheet.</a></li>
</ul>

<p><br>
</p>
