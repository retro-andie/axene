<p><br>
<br>
The <i>Paste function</i> dialog box inserts a <a HREF="Functions_alpha.html">function</a>
(by its keyword) into a cell. Functions are <a HREF="Functions_type.html">classed by type</a>.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_PasteFunction.gif" ALT="Image : Paste function dialog box"
WIDTH="246" HEIGHT="209"> <br>
<small><i>Screen shot: Paste function dialog box.</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Upper Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="list_functions">The Function list selects a function to be inserted at the
    insertion bar. All listed functions are available in the areas defined in the <i>type</i>
    section. Functions are displayed in alphabetical order.</a><br>
    &nbsp;</li>
  <li><a NAME="section_type">The <i>Type </i>section organizes displayed functions from the
    list according to areas of application. By default the button <i>All Types</i> is selected
    and all existing functions are displayed in the list. Other buttons only display functions
    of a certain type. More than one type may be selected at a time by clicking on a button
    while holding the <tt>CTRL</tt> key.</a><br>
    &nbsp;</li>
  <li><a NAME="entry_function">The non-editable text field displays the currently selected
    function.</a></li>
</ul>

<p><br>
</p>

<h3>Lower Portion of the Dialog Box:</h3>

<ul>
  <li><a NAME="button_ok">&quot;Ok&quot; inserts the selected function at the cursor in the
    insertion bar and closes the box. If the cursor is at the beginning of the insertion bar,
    an equals sign (=) is automatically added in front of the function.</a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel">&quot;Cancel&quot; closes the box without changing anything.</a></li>
</ul>

<p><br>
</p>
