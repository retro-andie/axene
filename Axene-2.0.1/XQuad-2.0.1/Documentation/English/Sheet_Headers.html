<p><br>
<br>
You can select whole columns or rows by clicking on the spreadsheet headers, and then you
can modify rows height and columns width.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Sheet_Headers.gif" ALT="Image: En-têtes des lignes et colonnes" WIDTH="322" HEIGHT="123"> <br>
<small><i>Screen snap: sheet headers</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>
<a NAME="Origin">

<h3>Header origin</h3>
</a>

<p>The rectangular area at the intersection of the horizontal header bar and the vertical
header bar is the header origin. The origin is viewable only if the column headers and the
rows headers are viewable too.</p>

<p>When you click on the origin, the whole spreadsheet is selected and cell at position A1
becomes the active cell. Selecting the menu entry &quot;<a HREF="Menu_Selection.html">Selection</a>
/ <a HREF="Menu_Selection.html#select_all_cells_menu_entry">Select all cells</a>&quot; has
the same effect. </p>

<p><br>
</p>

<h3>Column headers</h3>

<p>The column header bar is on top of the spreadsheet and displays column coordinates
(letters series). You can hide the bar by selecting the menu entry &quot;<a HREF="Menu_View.html">View</a> / <a HREF="Menu_View.html#column_headers_menu_entry">Hide
column headers</a>&quot;. </p>

<h4>Selecting a whole column</h4>

<p>You must click on middle of the wanted column header. The first cell from top of the
column becomes active.</p>

<p>You can also select a column range: 

<ol>
  <li>Click on the first column header without releasing the mouse button.</li>
  <li>Move the mouse pointer to the last column header (to cancel the selection, press the
    right mouse button).</li>
  <li>Release the mouse button.</li>
</ol>

<p>You can select several column ranges by keeping the '<tt>Ctrl</tt>' key pressed during
all the operations.</p>

<p>To widen or to shrink the selection, you have to press the '<tt>Shift</tt>' key and
either use the horizontal arrows keys or click on a new column header. </p>

<h4>Modifying a column width</h4>

<p>You can either do it by yourself or let it done automatically.</p>

<p>To modify the column width by yourself: 

<ol>
  <li>Press the left mouse button (and do not release) on the header's right border of the
    column you want to modify.</li>
  <li>Drag the mouse left to shrink or right to widen the column width header (to cancel the
    modification, press the right mouse button).</li>
  <li>Release the mouse button.</li>
</ol>

<p>To automatically modify the column width, you have to double-click on the header's
right border of the column you want to modify. Then Xquad will compute the optimal width,
taking each column's cells content into consideration.</p>

<p>If you modify the width of one among several columns in a range or a sequence, the
modified width will be applied to all selected columns.</p>

<p><br>
</p>

<h3>Row headers</h3>

<p>The row header bar is on left of the spreadsheet and displays rows coordinates
(numbers). You can hide the bar by selecting the menu entry &quot;<a HREF="Menu_View.html">View</a>
/ <a HREF="Menu_View.html#row_headers_menu_entry">Hide rows headers</a>&quot;. </p>

<h4>Selecting a whole row</h4>

<p>You must click on middle of the wanted row header. The first cell from left of the row
becomes active.</p>

<p>You can also select a row range: 

<ol>
  <li>Click on the first row header without releasing the mouse button. </li>
  <li>Move the mouse pointer to the last row header (to cancel the selection, press the right
    mouse button).</li>
  <li>Release the mouse button.</li>
</ol>

<p>You can select several row ranges by keeping the '<tt>Ctrl</tt>' key pressed during all
the operations.</p>

<p>To widen or to shrink the selection, you have to press the '<tt>Shift</tt>' key and
either use the vertical arrows keys, or the '<tt>Page Up</tt>' and '<tt>Page Down</tt>'
keys, or click on a new column header. </p>

<h4>Modifying a row height</h4>

<p>You can either do it by yourself or let it done automatically.</p>

<p>To modify the row height by yourself: 

<ol>
  <li>Press the left mouse button (and do not release) on the header's bottom border of the
    row you want to modify.</li>
  <li>Drag the mouse up to shrink or down to widen the row height header (to cancel the
    modification, press the right mouse button).</li>
  <li>Release the mouse button.</li>
</ol>

<p>To automatically modify the row height, you have to double-click on the header's bottom
border of the row you want to modify. Then Xquad will compute the optimal height, taking
each line's cells content into consideration. </p>

<p>If you modify the height of one among several row in a range or a sequence, the
modified height will be applied to all selected lines.</p>

<p><br>
</p>
