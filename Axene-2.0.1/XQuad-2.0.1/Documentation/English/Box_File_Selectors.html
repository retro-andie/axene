<p><br>
<br>
A file selector chooses a file to read or upon which to make alterations. All file
selectors function identically, however some offer additional features.<br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_FS_Open.gif" ALT="Image: standard File Selectors dialog box" WIDTH="213" HEIGHT="263"> <br>
<small><i>Screen snap: standard File Selectors dialog box</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>
<a NAME="file_selector">

<h3>Common elements of a file selector:</h3>
</a>

<ul>
  <li><a NAME="title_label">A title <strong>indicates the selector name</strong></a><br>
    &nbsp;</li>
  <li><a NAME="sub_directories_list">A pulldown list <strong>allowing the user to rapidly
    search a branch of the current directory</strong>. It contains all the sub-directories of
    the current directory&#146;s branch, up to the root directory.</a><br>
    &nbsp;</li>
  <li><a NAME="file_list">The next list <strong>shows all sub-directories and files from the
    current directory</strong>. Directory names appear in alphabetical order at the beginning
    of the list with the &quot;/&quot; character at the end of each name. Filenames receiving
    an eventual filter are displyed next. Double clicking on a directory name allows the user
    to access that file; the current directory is returned to the pulldown list and the
    selected directory becomes the new active directory with its contents displayed in the
    list. A simple click on a file name causes that filename to appear in the text field
    below. Double clicking on a filename selects the file without other confirmation.</a><br>
    &nbsp;</li>
  <li><a NAME="file_name_textfield">The text field <strong>displays the file name selected
    from the list and allows the user to change that name</strong>. The user may enter a
    filename complete with routing. If the entry is affixed with the &quot;~&quot; character,
    this directory becomes the new current directory. If the name is entered and affixed with
    the &quot;/&quot; character, the current directory will point to the new destination. In
    some file selectors an extension is automatically added to the file name upon validation.</a><br>
    &nbsp;</li>
  <li><a NAME="left_button">The left button of the lower portion of the file selector <strong>accepts
    the filename</strong> for the action indicated on the button and closes the box.</a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel">The <i>Cancel</i> button on the right <strong>cancels all
    actions</strong> and closes the box.</a></li>
</ul>

<p><br>
</p>

<hr>
<a NAME="fs_load">

<h3>Opening a document:</h3>

<p>The <i>Opening a Document</i> file selector opens a previously saved XQuad document.
The XqQad filename will usually posess an &quot;.xq&quot; extension; only files with this
extension will be displayed. This file selector is no different than other file selectors;
for further details about its use, see the instructions in </a><a HREF="Box_File_Selectors.html#file_selector">Standard File Selectors</a> .</p>

<p><br>
</p>

<hr>
<a NAME="fs_save">

<h3>Saving a document as:</h3>

<p>The <i>Saving a Document as..</i> file selector selects the filename under which the
active worksheet will be saved on disk. The <i>.xq</i> extension will be added
automatically to the filename. The file selector is no different than other file
selectors; for further details about its use, see the instructions in </a><a HREF="Box_File_Selectors.html#file_selector">Standard File Selectors</a></p>

<p><br>
</p>

<hr>
<a NAME="fs_print_in_file">

<h3>Printing to a file</h3>

<p>The <i>Printing to a File</i> file selector selects the filename to which print data
from the active worksheet will be saved. This file selector is called up from the </a><a HREF="Box_Print.html">Print</a> dialog box when <i>File</i> is selected<i> </i>as the
destination printer. This file selector is exactly like the <a HREF="Box_File_Selectors.html#file_selector">Standard File Selector</a>. The <i>.ps</i>
extension is added to the filename.</p>

<p><br>
</p>
