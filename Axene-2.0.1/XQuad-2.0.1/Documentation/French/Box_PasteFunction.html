<title>Coller une fonction</title>
</head>

<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p ALIGN="right"><img ALIGN="middle" SRC="Images/TitleDialogBox.gif" ALT="Boîte de dialogue" WIDTH="133" HEIGHT="27"> <img ALIGN="middle" SRC="Images/TitleBoxPasteFunction.gif" ALT="Coller une fonction" WIDTH="219" HEIGHT="37"> </p>

<p><br>
<br>
La boîte de dialogue <i>'Coller une Fonction'</i> permet d'insérer une <a HREF="Functions_alpha.html">fonction</a> (par son mot clef) dans une cellule. Les
fonctions sont classées par <a HREF="Functions_type.html">types</a>. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_PasteFunction.gif" ALT="Image : boîte 'Coller une fonction'" WIDTH="246" HEIGHT="209"> <br>
<small><i>Photo d'écran : Boîte de 'Collage d'une fonction' .</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Partie supérieure de la boîte de dialogue&nbsp;:</h3>

<ul>
  <li><a NAME="list_functions">la liste des fonctions permet de <b>choisir la fonction à
    insérer dans la barre d'édition</b>. Les fonctions listées sont toutes les celles
    disponibles dans les domaines définis par la section <i>&quot;Type&quot;</i>. Elles sont
    affichées par ordre alphabétique. </a><br>
    &nbsp;</li>
  <li><a NAME="section_type">la section <i>&quot;type&quot;</i> permet de <b>filtrer les
    fonctions affichées dans la liste</b>, selon le domaine d'application de celles-ci. Par
    défaut, le bouton <i>&quot;Tout types&quot;</i> est sélectionné et toutes les fonctions
    existantes sont affichées dans la liste. Les autres boutons permettent d'afficher
    exclusivement les fonctions d'un type choisi. Il est possible de sélectionner plusieurs
    types en même temps en cliquant sur un bouton en maintenant la touche <tt>&lt;Ctrl&gt;</tt>
    enfoncée. </a><br>
    &nbsp;</li>
  <li><a NAME="entry_function">le champ texte, non éditable, <b>affiche la fonction
    actuellement sélectionnée</b> de la liste. </a></li>
</ul>

<p><br>
</p>

<h3>Partie inférieure de la boîte de dialogue&nbsp;:</h3>

<ul>
  <li><a NAME="button_ok">&quot;Ok&quot; <b>insère la fonction sélectionnée dans la barre
    d'édition</b> au niveau du curseur et ferme la boîte. Si le curseur se trouve au début
    de la barre d'édition, un '=' est ajouté automatiquement devant la fonction. </a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel">&quot;Annuler&quot; ferme la boîte sans <b>rien changer</b>. </a></li>
</ul>

<p><br>
</p>
