<body BGCOLOR="#FFFFFF" BACKGROUND="Images/back.gif" TEXT="#000000">

<p><br>
<br>
</p>

<p>Une souris ou tout autre dispositif de pointages similaire est absolument indispensable
à l'exploitation d'XQuad. La norme sur les terminaux X et les stations de travail Unix
est de disposer de souris avec trois boutons. Cependant, sur des systèmes Unix ou
serveurs X fonctionnant sur compatibles PC, les souris deux boutons sont plus largement
répandues. Sur Macintosh, la prédominance va aux souris avec un seul bouton. </p>

<p>XQuad se sert des trois boutons pour la manipulation des différentes fonctionnalités
; cependant, les boutons du milieu et de droite ne sont utilisés que pour raccourcir
d'autres manipulations. Ils ne sont donc pas indispensables et l'utilisation complète du
logiciel peut être faite avec un seul bouton a votre souris. </p>

<p><br>
</p>

<h3>L'emploi des trois boutons dans XQuad&nbsp;:</h3>

<ol>
  <li>Le <b>bouton de gauche</b> est le bouton qui permet de réaliser toutes les opérations
    de pointages, sélection dans des listes, clic sur un bouton poussoir ou icône et
    glisser/lâcher. Il est possible de tout faire dans XQuad en utilisant exclusivement ce
    bouton. Les deux seules touches qui peuvent être utilisée en conjonction avec le bouton
    de gauche de la souris sont&nbsp;: <br>
    &nbsp;<ul>
      <li>la touche <i>Shift</i> lors d'une <a HREF="Sheet_Cells.html#select_region">sélection de
        cellules</a>, de la <a HREF="Sheet_Cells.html#cut_copy_paste">copie de sélection</a>, ou
        de l'<a HREF="Sheet_Cells.html#insert">insertion de lignes et de colonnes</a>. <br>
        &nbsp;</li>
      <li>la touche <i>Ctrl</i> dans certaines boîtes de dialogue qui montrent une liste
        d'éléments. L'usage simultané de cette touche et du bouton gauche de la souris permet
        de faire la sélection de plusieurs éléments dans une liste.<br>
        Elle est aussi utilisable dans le cas des <a HREF="Sheet_Cells.html#extend">extension de
        séries</a>. </li>
    </ul>
    <p><br>
    Un <b>double-clic sur le bouton gauche</b> de la souris s'emploie dans les occasions
    suivantes&nbsp;: <ul>
      <li>un double-clic sur un cadre permet d'ouvrir la boîte de dialogue '<a HREF="Box_Frame_Attributes.html">Attributs des cadres</a>' d'un cadre. <br>
        &nbsp;</li>
      <li>un double-clic sur un nom de fichier dans un <a HREF="Box_File_Selectors.html#file_list">sélecteur
        de fichier</a>. <br>
        &nbsp;</li>
      <li>un double-clic dans un champ texte permet de sélectionner un mot entier. Un triple-clic
        permet de sélectionner la ligne entière de texte. </li>
    </ul>
    <p><br>
    </p>
  </li>
  <li>le <b>bouton droit</b> est utile dans les cas suivants&nbsp;: <br>
    &nbsp;<ul>
      <li>pour abandonner une opération en cours. Dans certains modes d'action, il faut désigner
        un emplacement source et un emplacement destination grâce au bouton gauche de la souris.
        Après avoir désigné l'emplacement source, il est possible de cliquer sur le bouton
        droit afin d'annuler l'opération. </li>
    </ul>
  </li>
</ol>

<p>&nbsp;

<ol>
  <li>le <b>bouton central</b> de la souris est exploitable dans le cas suivant&nbsp;: <br>
    &nbsp;<ul>
      <li>le <a HREF="Sheet_Cells.html#cut_copy_paste">déplacement d'une sélection</a>. <br>
        &nbsp;</li>
      <li>pour faire un &quot;coller&quot; dans un champ texte pour insérer un morceau de texte
        &quot;copier&quot; depuis un xterm où toute autre application X11 exploitant les
        mémoires tampons. </li>
    </ul>
  </li>
</ol>

<p><br>
Pour comprendre dans quel mode opératoire XQuad se trouve, il est très important
d'observer la forme du curseur souris. A chaque cas d'utilisation correspond un curseur
souris spécifique. <br>
<br>
</p>
