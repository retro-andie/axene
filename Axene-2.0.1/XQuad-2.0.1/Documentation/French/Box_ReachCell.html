<p><br>
<br>
La boîte de dialogue 'Atteindre la Cellule', permet de déplacer la cellule active et la
zone affichée de la feuille de calcul, sur une cellule désignée par ces coordonnées. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Box_ReachCell.gif" ALT="Image : boîte
      'atteindre la cellules'"
WIDTH="172" HEIGHT="76"> <br>
<small><i>Photo d'écran : Boîte 'Atteindre la cellule' .</i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Partie supérieure de la boîte de dialogue&nbsp;:</h3>

<ul>
  <li><a NAME="entry_goto">le champ texte <i>&quot;Aller à la cellule&quot;</i> permet de <b>spécifier
    les coordonnées de la cellule à atteindre</b>. Les coordonnées d'une cellule sont
    composées d'une suite de lettre, comprise entre A et ZZ, pour désigner la colonne et
    d'un nombre compris entre 1 et 30.000 pour désigner la ligne. Dans ce champ texte, il est
    possible de spécifier des coordonnées entières (colonne + ligne) ou une coordonnée
    simple (colonne ou ligne). Exemple: I2, AG453, FI, 3151...</a> </li>
</ul>

<p><br>
</p>

<h3>Partie inférieure de la boîte de dialogue&nbsp;:</h3>

<ul>
  <li><a NAME="button_ok"><i>&quot;Ok&quot;</i> ferme la boîte, <b>déplace la zone affichée</b>
    de la feuille de calcul <b>et la cellule active vers la cellule spécifiée</b>. </a><br>
    &nbsp;</li>
  <li><a NAME="button_cancel"><i>&quot;Annuler&quot;</i> ferme la boîte <b>sans effectuer
    aucune opération</b>. </a></li>
</ul>

<p><br>
</p>
