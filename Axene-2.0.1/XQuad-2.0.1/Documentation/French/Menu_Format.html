<p><br>
<br>
Le menu déroulant Format permet d'accéder à toutes les fonctions qui permettent de
changer l'apparence du contenu et de la décoration des cellules. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Menu_Format.gif" ALT="Image&nbsp;: Menu Format" WIDTH="168" HEIGHT="153"> <br>
<small><i>Photo d'écran&nbsp;: Menu déroulant Format </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Le menu Format comporte les entrées suivantes&nbsp;:</h3>

<ul>
  <li><a NAME="numbers_menu_entry">l'entrée <i>&quot;Nombres...&quot;</i> permet de <b>changer
    le format des nombres</b>. Cette entrée ouvre la boîte de dialogue '</a><a HREF="Box_NumFormat.html">Mise en forme des nombres</a>'. <br>
    &nbsp;</li>
  <li><a NAME="patterns_menu_entry">l'entrée <i>&quot;Fonds...&quot;</i> permet de <b>changer
    le motif de fond et ses couleurs</b>. Cette entrée ouvre la boîte de dialogue '</a><a HREF="Box_CellPattern.html">Attribution de fond aux cellules</a>'. <br>
    &nbsp;</li>
  <li><a NAME="borders_menu_entry">l'entrée <i>&quot;Bords...&quot;</i> permet de <b>changer
    le motif et les couleurs des bordures</b>. Cette entrée ouvre la boîte de dialogue '</a><a HREF="Box_CellBorder.html">Attribution de bordures aux cellules</a>'. <br>
    &nbsp;</li>
  <li><a NAME="fonts_menu_entry">l'entrée <i>&quot;Polices...&quot;</i> permet de <b>choisir
    la police de caractère</b>. Cette entrée ouvre la boîte de dialogue '</a><a HREF="Box_Font.html">Composition des polices</a>'. <br>
    &nbsp;</li>
  <li><a NAME="rc_sizes_menu_entry">l'entrée <i>&quot;Lignes et colonnes...&quot;</i> permet
    de <b>redéfinir la largeur des colonnes et la hauteur des lignes</b>. Cette entrée ouvre
    la boîte de dialogue '</a><a HREF="Box_ColumnRowSize.html">Taille des lignes et des
    colonnes</a>'. </li>
</ul>
