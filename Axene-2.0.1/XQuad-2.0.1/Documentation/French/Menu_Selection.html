<p><br>
<br>
Le menu déroulant Sélection comporte des fonctions pour atteindre rapidement certaines
cellules et aussi pour sélectionner automatiquement certains éléments de la feuille de
calcul. <br>
<br>
</p>

<hr>

<p align="center"><br>
<img SRC="Images/Menu_Selection.gif" ALT="Image&nbsp;: Menu Selection" WIDTH="238" HEIGHT="198"> <br>
<small><i>Photo d'écran&nbsp;: Menu déroulant Sélection </i></small></p>

<p><br>
</p>

<hr>

<p><br>
</p>

<h3>Le menu Sélection comporte les entrées suivantes&nbsp;:</h3>

<ul>
  <li><a NAME="paste_function_menu_entry">l'entrée <i>&quot;Coller une Fonction...&quot;</i>
    permet d'<b>insérer un nom de fonction</b> dans la </a><a HREF="Edit_Bar.html">barre de
    saisie</a>. Cette entrée ouvre la boîte de dialogue '<a HREF="Box_PasteFunction.html">Coller
    une fonction</a>'. <br>
    &nbsp;</li>
  <li><a NAME="reach_cell_menu_entry">l'entrée <i>&quot;Atteindre la cellule...&quot;</i>
    permet de <b>déplacer la cellule active</b> et la zone affichée de la feuille de calcul,
    sur une cellule désignée par ces coordonnées. Cette entrée ouvre la boîte de dialogue
    '</a><a HREF="Box_ReachCell.html">Atteindre la cellule</a>'. <br>
    &nbsp;</li>
  <li><a NAME="reach_active_cell_menu_entry">l'entrée <i>&quot;Atteindre la cellule
    active&quot;</i> permet de <b>déplacer la zone affichée de la feuille de calcul pour
    rendre visible la cellule active</b>. Lorsque l'on déplace la zone affichée avec les
    barres de défilements, la cellule active ne bouge pas et peut n'être plus visible à
    l'écran. </a><br>
    &nbsp;</li>
  <li><a NAME="reach_last_cell_menu_entry">l'entrée <i>&quot;Atteindre la dernière
    cellule&quot;</i> permet de <b>déplacer la cellule active et la zone affichée de la
    feuille de calcul sur la dernière cellule remplie</b>. La dernière cellule correspond à
    la cellule ayant un contenu et étant située le plus en bas et le plus à droite de la
    feuille de calcul. </a><br>
    &nbsp;</li>
  <li><a NAME="select_used_area_menu_entry">l'entrée <i>&quot;Sélectionner la Zone
    utile&quot;</i> permet de <b>sélectionner la région des cellules utilisées</b>. Cette
    sélection correspond à la région rectangulaire, la plus petite, contenant toutes les
    cellules ayant un contenu (texte, valeur ou formule). </a><br>
    &nbsp;</li>
  <li><a NAME="select_all_cells_menu_entry">l'entrée <i>&quot;Sélectionner toutes les
    Cellules&quot;</i> permet de <b>sélectionner l'intégralité des cellules de la feuille
    de calcul</b>. L'action de cette entrée est identique à celle du bouton d'</a><a HREF="Sheet_Headers.html#Origin">origine des cellules</a> (bouton formant l'intersection
    des en-têtes de lignes et de colonnes) de la feuille de calcul. <br>
    &nbsp;</li>
  <li><a NAME="select_all_frames_menu_entry">l'entrée <i>&quot;Sélectionner tous les
    Cadres&quot;</i> permet de <b>sélectionner tous les cadres présents sur la feuille de
    calcul</b>. Si, par maladresse, un cadre est placé entièrement en dehors de la feuille
    de calcul, cette option est la seule qui permette d'y accéder. </a></li>
</ul>
